# GitHub Actions CI 流水线（细化_M6_质量门禁 D7 §四 CI-01/CI-02 载体本体）
#
# 触发：push / pull_request（CI-01）
# 步骤：① 依赖安装 → ② ruff → ③ mypy → ④ pytest 全量 → ⑤ coverage 阈值（CI-01 五步）
# 任一 step 失败 → job 失败（GitHub Actions step 失败即 job 失败，CI-01「exit≠0 语义」）
# 口径一致（CI-02 / D7-D3）：① 建 .venv 复刻本地布局（run_all_tests.py / verify_m0.py
#   硬编码 .venv/bin/python，CI 同布局后可直接调用全量入口）；④ 直接调用
#   scripts/run_all_tests.py 全量（阶段1 pytest 层 + 阶段2 verify_m0~m5，阶段0 lint /
#   阶段3 coverage 由 D7 LNT/COV 批次接入后自动继承）；⑤ coverage 独立段复刻 D7 COV-03/04
#   （三目录各自 ≥80%，禁合计稀释），阈值 80% 与 COV-04/run_all_tests 同源，不另定义阈值。

name: CI

on: [push, pull_request]

jobs:
  quality-gate:
    name: 质量门禁（ruff + mypy + pytest 全量 + coverage 阈值）
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ① 依赖安装（CI-01 步骤①）：建 .venv 与本地开发布局同构（run_all_tests/verify 脚本
      #    均按 .venv/bin/python 定位解释器），再装 requirements.txt（锁定源）+ dev 组
      #    （pyproject [project.optional-dependencies].dev；ruff/mypy/coverage 由 D7
      #    LNT-03/COV-01 批次入依赖后此处自动覆盖）
      - name: ① 依赖安装（venv + requirements.txt + -e .[dev]）
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt
          .venv/bin/pip install -e ".[dev]"

      # ④ 全量门禁（CI-01 步骤②~⑤ / P2-1 收敛，批7B 审查）：直接调用 run_all_tests.py 全量
      #    入口（CI-02 首选形态，与本地同一命令同一阈值）——阶段0 lint（ruff/mypy，D7 LNT-04）
      #    + 阶段1 pytest 层（unit/contract/e2e/fault）+ 阶段2 verify_m0~m5 + 阶段3 coverage
      #    真实核算（core/engine/content 各自 ≥80%，D7 COV-03/04）；任一阶段失败 → 脚本
      #    exit 非 0 → job 失败。单一形态防 CI 内双口径（不再单独跑 ruff/mypy/coverage）。
      - name: ④ 全量门禁（run_all_tests.py 全量入口）
        run: .venv/bin/python scripts/run_all_tests.py

      # 归档（可选，CI-02「CI 产物留档 docs/verify/」；no files → 告警不失败）
      - name: 归档 docs/verify/
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-outputs
          path: docs/verify/