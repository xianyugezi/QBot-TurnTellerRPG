<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>内容编辑器 · 批3 分区页签</title>
<link rel="stylesheet" href="/static/tokens.css">
<style>
/* 终端极简风（令牌全部来自 tokens.css；此处只写骨架与组件布局，零 CDN、零外链字体） */
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; height: 100%; }
body {
  font-family: var(--font-mono);
  font-size: var(--fs-12);
  line-height: var(--lh-tight);
  color: var(--text);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
}
.app { width: 100%; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

/* ---------- 顶栏：内容包选择器 + 保存状态 + 身份/权限开关 ----------
   窄窗口约束：三段信息不换行、不互相挤压——可收缩项（包名/保存状态）用省略号，
   身份切换与权限角标固定宽度（用户两批验收反馈：窄窗口顶栏被挤到换行）。 */
.topbar { height: var(--h-topbar); flex: 0 0 var(--h-topbar); display: flex; align-items: center;
  gap: var(--sp-7); padding: 0 var(--sp-8); border-bottom: var(--bw) solid var(--line-strong);
  white-space: nowrap; overflow: hidden; }
.brand { color: var(--text-strong); font-weight: 700; letter-spacing: .04em;
  flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.brand .mark { color: var(--accent); }
.pkgsel, .rolesel { display: inline-flex; align-items: center; gap: var(--sp-3);
  border: var(--bw) solid var(--line-strong); padding: 2px var(--sp-4); min-width: 0; }
.pkgsel { flex: 0 1 auto; max-width: 42vw; }
.rolesel { flex: 0 0 auto; }
.pkgsel .lb, .rolesel .lb { color: var(--text-4); flex: 0 0 auto; }
.pkgsel select, .rolesel select { font-family: inherit; font-size: var(--fs-12); color: var(--accent);
  background: var(--bg); border: 0; outline: none; padding: 1px 2px; max-width: 280px; min-width: 0; }
.pkgsel select { flex: 0 1 auto; min-width: 0; overflow: hidden; white-space: nowrap;
  text-overflow: ellipsis; }
.pkgsel .from { color: var(--text-6); flex: 0 0 auto; }
.saved { color: var(--accent); flex: 0 1 auto; min-width: 0;
  overflow: hidden; text-overflow: ellipsis; }
.saved::before { content: "["; color: var(--text-6); }
.saved::after { content: "]"; color: var(--text-6); }
.saved.dirty { color: var(--warn); }
.saved.err { color: var(--danger); }
.topright { margin-left: auto; display: flex; align-items: center; gap: var(--sp-6); color: var(--text-3);
  flex: 0 0 auto; white-space: nowrap; }
.who b { color: var(--text-value); font-weight: 700; }
.role { border: var(--bw) solid var(--accent); color: var(--accent); padding: 0 var(--sp-2); }
.role.ro { border-color: var(--warn); color: var(--warn); }
@media (max-width: 900px) {
  .topbar { gap: var(--sp-5); padding: 0 var(--sp-5); }
  .pkgsel .from { display: none; }        /* 窄窗口先舍来源标注，包名与状态保省略号 */
  .brand { letter-spacing: 0; }
}
/* 批5.2（V2）：更窄时先舍品牌字样，把宽度让给包名/状态；身份切换固定宽不参与收缩。
   包名/状态可收缩 + 省略号，完整信息由 title 悬停给出（syncPackTitle）。 */
@media (max-width: 760px) {
  .brand { display: none; }
  .pkgsel { max-width: 56vw; }
}

.body { flex: 1 1 auto; display: flex; min-height: 0; }

/* ---------- 三栏骨架：①模块分类 ②条目列表 ③大编辑面板 ---------- */
.col-mod { width: var(--w-mod); flex: 0 0 var(--w-mod); border-right: var(--bw) solid var(--line-strong);
  display: flex; flex-direction: column; min-height: 0; }
.col-list { width: var(--w-list); flex: 0 0 var(--w-list); border-right: var(--bw) solid var(--line-strong);
  display: flex; flex-direction: column; min-height: 0; }
.col-hd { height: var(--h-bar); flex: 0 0 var(--h-bar); display: flex; align-items: center;
  padding: 0 var(--sp-6); border-bottom: var(--bw) solid var(--line-soft);
  color: var(--text-5); letter-spacing: .08em; }
.col-hd .src { margin-left: auto; color: var(--text-6); font-size: var(--fs-10); letter-spacing: 0; }
.mods { flex: 1 1 auto; min-height: 0; overflow-y: auto; overflow-x: hidden; padding: var(--sp-2) 0; }
.mod { display: flex; align-items: center; gap: 2px; padding: var(--sp-2) var(--sp-6);
  color: var(--text-2); white-space: nowrap; cursor: pointer; }
.mod::before { content: "\00b7 "; color: var(--text-6); }
.mod.grp::before { content: "\25be "; color: var(--text-4); }
.mod.sub { padding-left: calc(var(--sp-6) + var(--ind-lv)); }
.mod.sub::before { content: "\2514 "; color: var(--text-6); }
.mod:hover { background: var(--surface-hover); }
.mod.on { background: var(--surface-sel); color: var(--text-strong); border-left: var(--bw) solid var(--accent); }
.mod.on::before { content: "> "; color: var(--accent); }
.mod.sub.on::before { content: "\2514 "; color: var(--accent); }
.mod .ct { margin-left: auto; color: var(--text-4); }
.mod.on .ct { color: var(--accent); }

.list-hd { height: var(--h-bar); flex: 0 0 var(--h-bar); display: flex; align-items: center;
  padding: 0 var(--sp-6); border-bottom: var(--bw) solid var(--line-soft); }
.list-title { color: var(--text-strong); font-weight: 700; }
.list-count { margin-left: var(--sp-5); color: var(--text-5); font-size: var(--fs-11); font-weight: 400; }
.list-tools { display: flex; align-items: center; padding: var(--sp-3) var(--sp-6); border-bottom: var(--bw) solid var(--line-soft); }
.search { display: flex; align-items: center; border: var(--bw) solid var(--line-strong); padding: 2px var(--sp-4); width: 100%; }
.search input { border: 0; background: transparent; outline: none; color: var(--text-value);
  font-family: inherit; font-size: var(--fs-12); width: 100%; }
.rows { flex: 1 1 auto; min-height: 0; overflow-y: auto; overflow-x: hidden; padding: var(--sp-2) 0; }
.item { display: block; padding: var(--sp-3) var(--sp-6); color: var(--text-2); white-space: nowrap;
  overflow: hidden; text-overflow: ellipsis; cursor: pointer; }
.item::before { content: "\00b7 "; color: var(--text-6); }
.item:hover { background: var(--surface-hover); }
.item.on { background: var(--surface-sel); color: var(--text-strong); border-left: var(--bw) solid var(--accent); }
.item.on::before { content: "> "; color: var(--accent); }
.item.dirty::after { content: " *"; color: var(--warn); }
.list-ft { margin-top: auto; padding: var(--sp-4) var(--sp-6); border-top: var(--bw) solid var(--line-strong);
  color: var(--text-4); display: flex; align-items: center; gap: var(--sp-5); }
.sp { margin-left: auto; }

/* ---------- 细滚动条：6px、低对比、悬停略亮 ---------- */
.mods::-webkit-scrollbar, .rows::-webkit-scrollbar, .panel-body::-webkit-scrollbar { width: var(--sb-size); height: var(--sb-size); }
.mods::-webkit-scrollbar-track, .rows::-webkit-scrollbar-track, .panel-body::-webkit-scrollbar-track { background: transparent; }
.mods::-webkit-scrollbar-thumb, .rows::-webkit-scrollbar-thumb, .panel-body::-webkit-scrollbar-thumb { background: var(--sb-thumb); border-radius: var(--radius-sb); }
.mods::-webkit-scrollbar-thumb:hover, .rows::-webkit-scrollbar-thumb:hover, .panel-body::-webkit-scrollbar-thumb:hover { background: var(--sb-thumb-hover); }

/* ---------- 大编辑面板（占其余全部宽度） ---------- */
.panel { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; min-height: 0; }
.panel-hd { flex: 0 0 auto; padding: var(--sp-5) var(--sp-8); border-bottom: var(--bw) solid var(--line-soft);
  display: flex; align-items: center; gap: var(--sp-6); }
.panel-title { color: var(--text-strong); font-weight: 700; }
.panel-title::before { content: "> "; color: var(--accent); }
.panel-sub { color: var(--text-4); }
.panel-id { margin-left: auto; color: var(--text-4); }
.toolbar { flex: 0 0 auto; display: flex; align-items: center; gap: var(--sp-5); flex-wrap: wrap;
  padding: var(--sp-4) var(--sp-8); border-bottom: var(--bw) solid var(--line-soft); color: var(--text-4); }
.panel-body { flex: 1 1 auto; min-height: 0; overflow-y: auto; overflow-x: hidden; padding: var(--sp-6) var(--sp-8); }
.panel-ft { flex: 0 0 auto; display: flex; align-items: center; gap: var(--sp-5);
  padding: var(--sp-5) var(--sp-8); border-top: var(--bw) solid var(--line-strong); color: var(--text-5); }

.btn { font-family: inherit; font-size: var(--fs-12); cursor: pointer; color: var(--text-btn);
  background: transparent; border: var(--bw) solid var(--line-strong); padding: 2px var(--sp-6); }
.btn:hover { border-color: var(--accent); color: var(--accent); }
.btn.primary { border-color: var(--accent); color: var(--accent); }
.btn.danger:hover { border-color: var(--danger); color: var(--danger); }
.btn:disabled { color: var(--text-disabled); border-color: var(--line); cursor: not-allowed;
  background: transparent; }
.btn:disabled:hover { color: var(--text-disabled); border-color: var(--line); }
/* 批5.2（V4）：危险按钮（回退）无备份时必须呈现真禁用——灰边灰字，不受 danger:hover 影响。 */
.btn.danger:disabled, .btn.danger:disabled:hover {
  border-color: var(--line); color: var(--text-disabled); background: transparent; }
.tbnote { color: var(--text-5); font-size: var(--fs-11); }

.meta { display: flex; align-items: center; gap: var(--sp-5); margin: 0 0 var(--sp-6);
  padding: var(--sp-3) var(--sp-5); border: var(--bw) solid var(--line); border-left: var(--bw-accent) solid var(--accent);
  color: var(--text-2); flex-wrap: nowrap; overflow: hidden; min-width: 0; }
.meta .mk { color: var(--accent); flex: 0 0 auto; }
.meta .mk::before { content: "["; color: var(--text-5); }
.meta .mk::after { content: "]"; color: var(--text-5); }
/* 批5.2（V5）：主信息分段固定，来源路径可收缩 + 省略号，窄屏不折行（悬停 title 看全文）。 */
.meta .mi { color: var(--text-3); flex: 0 0 auto; white-space: nowrap; }
.meta .mi + .mi::before { content: "· "; color: var(--text-6); }
.meta .src { margin-left: auto; min-width: 0; color: var(--text-4);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* 校验结果（红拦/黄提示；人话：哪一项 / 为什么 / 怎么改） */
.vbox { margin: 0 0 var(--sp-6); border: var(--bw) solid var(--line);
  border-left: var(--bw-accent) solid var(--ok); padding: var(--sp-4) var(--sp-5); }
.vbox.red { border-left-color: var(--danger); }
.vbox.warn { border-left-color: var(--warn); }
.vhead { color: var(--text-strong); margin-bottom: var(--sp-3); }
.vbox.red .vhead { color: var(--danger); }
.vbox.warn .vhead { color: var(--warn); }
.vrow { color: var(--text-2); padding: var(--sp-2) 0; border-top: var(--bw) solid var(--line-faint);
  line-height: var(--lh-ex); white-space: pre-wrap; overflow-wrap: anywhere; }
.vrow b { color: var(--danger); font-weight: 700; }
.vrow.yellow b { color: var(--warn); }
.vrow .vfix { color: var(--text-5); display: block; }

/* 分组页签（终端极简风 06 组件）：名称 + 字段计数徽标；名称来自元数据 group_labels */
.gtabs { display: flex; align-items: center; gap: var(--sp-3); margin: 0 0 var(--sp-6);
  padding-bottom: var(--sp-4); border-bottom: var(--bw) solid var(--line-soft); flex-wrap: wrap; }
.gtab { display: inline-flex; align-items: center; height: var(--h-ctl); font-family: inherit;
  font-size: var(--fs-12); cursor: pointer; color: var(--text-3);
  border: var(--bw) solid var(--line); background: transparent; padding: 0 var(--sp-5); }
.gtab b { margin-left: var(--sp-2); color: var(--text-5); font-weight: 400; }
.gtab:hover { border-color: var(--line-strong); color: var(--text-value); }
.gtab.on { color: var(--accent); border-color: var(--accent); }
.gtab.on b { color: var(--accent); }
.gpane[hidden] { display: none; }
.gempty { color: var(--text-5); padding: var(--sp-8) var(--sp-6); line-height: var(--lh-ex); }

/* 双列字段网格：同一行的两列基线对齐。要点：
   · .row 内容顶部对齐（align-items:start），标签固定为「单行控件高度」的盒子并居中，
     因此两列的标签与首行控件始终落在同一条线上；长提示只向下撑高本行 .rval，
     不会把标签改成垂直居中（用户验收反馈：长提示把整行撑歪）；
   · .rows2 默认 stretch → 同一网格行的两列等高、底线对齐。 */
.rows2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); column-gap: var(--sp-11); align-items: stretch; }
.row { display: grid; grid-template-columns: 132px minmax(0, 1fr); gap: var(--sp-5); align-items: start;
  padding: var(--sp-4) 0; border-bottom: var(--bw) solid var(--line-faint); min-width: 0; }
/* 宽字段（列表/引用列表，批4 UX）：跨双列独占一行——多列表格拿整幅面板宽度，
   列不再被挤到面板右缘；仍放不下时由 .ltable-scroll 横向滚动兜底。 */
.rows2 > .row.wide { grid-column: 1 / -1; }
.row > .rlab { color: var(--text-4); display: flex; align-items: center; gap: var(--sp-3);
  flex-wrap: wrap; min-height: var(--h-ctl); min-width: 0; }
.row > .rlab::before { content: "> "; color: var(--line-mute); }
.row.dirty > .rlab { color: var(--warn); }
.row.dirty > .rlab::after { content: " ● 已改动"; color: var(--warn); font-size: var(--fs-10); }
.ftype { color: var(--accent-dim); }
.ftype::before { content: "<"; color: var(--text-6); }
.ftype::after { content: ">"; color: var(--text-6); }
/* 字段原始键名（批3.5）：中文名为主、键名为辅——弱化色 + 更小字号，不抢主标签 */
.fkey { color: var(--text-5); font-size: var(--fs-11); font-weight: 400; }
.rval { min-width: 0; align-self: start; }
.inp { color: var(--text-value); white-space: pre-wrap; overflow-wrap: anywhere; }
.inp.mono { color: var(--accent); white-space: pre-wrap; overflow-wrap: anywhere; }
.inp.bool { display: flex; align-items: center; gap: var(--sp-3); color: var(--text-value); }
.box { display: inline-block; width: 11px; height: 11px; border: var(--bw) solid var(--line-strong); }
.box.on { border-color: var(--accent); background: var(--accent); }
.ta { width: 100%; border: var(--bw) solid var(--line); background: transparent; color: var(--text);
  font-family: inherit; font-size: var(--fs-12); line-height: var(--lh-text); padding: var(--sp-4) var(--sp-5);
  white-space: pre-wrap; overflow-wrap: anywhere; }
.ex { color: var(--text-5); }
.ro { color: var(--text-5); font-size: var(--fs-10); }
.nest { border-bottom: 0; padding: var(--sp-2) 0; grid-template-columns: 110px 1fr; }

/* 编辑控件（终端极简风：直角、细边、聚焦亮线） */
.cin, .cta { width: 100%; background: transparent; color: var(--text-value);
  font-family: inherit; font-size: var(--fs-12); border: var(--bw) solid var(--line);
  padding: 2px var(--sp-4); outline: none; }
.cta { line-height: var(--lh-text); padding: var(--sp-4) var(--sp-5); resize: vertical; }
.cin:focus, .cta:focus { border-color: var(--focus); box-shadow: 0 0 0 var(--focus-offset) var(--focus); }
/* 批5.2（V10）：下拉框右侧预留原生箭头区，箭头不遮住被选文本。 */
select.cin { padding: 1px var(--sp-9) 1px var(--sp-2); }
.ctl-bool { display: inline-flex; align-items: center; gap: var(--sp-3); cursor: pointer; color: var(--text-value); }
.ctl-bool input { accent-color: var(--accent); width: 13px; height: 13px; }

.ltable { width: 100%; border-collapse: collapse; table-layout: fixed; }
.ltable th { text-align: left; font-weight: 400; color: var(--text-3); border: var(--bw) solid var(--line);
  background: var(--surface-th); padding: var(--sp-3) var(--sp-4); white-space: nowrap; overflow: hidden; }
.ltable th .ftype { margin-left: var(--sp-2); }
.ltable td { border: var(--bw) solid var(--line-soft); padding: var(--sp-3) var(--sp-4); color: var(--text);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ltable tr:nth-child(even) td { background: var(--surface-zebra); }
.lmeta { color: var(--text-4); font-size: var(--fs-11); margin: var(--sp-2) 0; }

/* ---------- 可增删行表格（批4 组件04）：行内编辑 + 行尾删除 + 表下「+ 添加一行」 ---------- */
/* 宽表不缩写（批4 UX）：列宽按内容自适应 + 最小列宽，容器横向滚动（细滚动条令牌）；
   表格不再被 table-layout:fixed 压窄，列头不会退化成 act/pro/wei 这类截断缩写。 */
.ltable-scroll { max-width: 100%; overflow-x: auto; }
.ltable-scroll::-webkit-scrollbar { height: var(--sb-size); }
.ltable-scroll::-webkit-scrollbar-track { background: transparent; }
.ltable-scroll::-webkit-scrollbar-thumb { background: var(--sb-thumb); border-radius: var(--radius-sb); }
.ltable-scroll::-webkit-scrollbar-thumb:hover { background: var(--sb-thumb-hover); }
/* 表格宽度 = 容器宽（列按可用空间分配）；内容确实放不下时按最小内容宽溢出，
   由 .ltable-scroll 横向滚动兜底。不用 width:max-content —— 否则列恒取最长内容宽，
   表头换行也压不窄列。 */
.ltable-edit, .ltable-ro { table-layout: auto; width: 100%; }
.ltable-edit th { min-width: 96px; overflow: visible; white-space: normal; }
.ltable-ro th { min-width: 96px; overflow: visible; }
/* 批5.2（V10）：引用列加宽档（类名由控件形态 scalarCssClass 给出），下拉文本不再被裁。 */
.ltable-edit th.ref, .ltable-ro th.ref { min-width: 170px; }
.ltable-edit td { padding: var(--sp-2) var(--sp-3); }
.ltable-edit td .cin { padding: 1px var(--sp-3); }
/* V10：表格单元格里的下拉同样预留箭头区（覆盖上面的紧凑内边距）。 */
.ltable-edit td select.cin { padding-right: var(--sp-9); }
.ltable th.op, .ltable td.op { width: 84px; min-width: 84px; text-align: right; border-left: 0; }
.ltable-edit th.op, .ltable-edit td.op { padding-right: var(--sp-5); }
.lcell.warn { border-color: var(--warn); }
/* 表格内可编辑单元格（批4 UX）：与 tokens.css 控件同一套边框/底色/聚焦态（.cin 自带聚焦环）；
   --bg 底让输入框在斑马纹行上仍是清晰的「字段面」，不再与表格底色混成一块。 */
.ltable-edit .cin, .ltable-edit .cta { background: var(--bg); }
/* 只读单元格（对象/映射/嵌套列表）：同样有框有底，空值走 EMPTY_TEXT；宽 JSON 自动换行 */
.ro-cell { display: block; width: 100%; max-width: 260px; min-height: var(--h-ctl);
  padding: 1px var(--sp-3); border: var(--bw) solid var(--line-soft); background: var(--surface);
  color: var(--text-4); font-size: var(--fs-11); white-space: pre-wrap; overflow-wrap: anywhere; }
.ldel { display: inline-flex; align-items: center; height: var(--h-ctl-sm); padding: 0 var(--sp-3);
  font-family: inherit; font-size: var(--fs-11); cursor: pointer; background: transparent;
  border: var(--bw) solid var(--line-strong); color: var(--text-3); }
.ldel:hover { border-color: var(--danger); color: var(--danger); }
.ladd { display: inline-flex; align-items: center; margin-top: var(--sp-4); padding: var(--sp-2) var(--sp-6);
  font-family: inherit; font-size: var(--fs-12); cursor: pointer; background: transparent;
  border: var(--bw) dashed var(--line-accent-dash); color: var(--accent); }
.ladd:hover { background: var(--surface-hover); }
.lwrap { width: 100%; }

/* ---------- 块状换行布局（批5.1）：列表元素含嵌套结构化子字段时，逐条成块 ----------
   一张 N 列宽表在窄面板里必然横向滚动（V14），条件/键值编辑器塞进单元格又把行高撑高、
   同行其它列基线错位（V13）。规则：元素只要含嵌套子字段（列描述 nested=true，判定依据是
   控件形态而非业务字段名），该列表改为「逐条成块」——块首行横排标量列（尽量占满一行），
   嵌套字段各自换行成块、占满容器宽度（不再有单元格右侧空白）。
   分隔沿用 tokens：外层细边框 + 左侧色条（--line-accent-dash），嵌套块之间用最弱分隔线。 */
.lblocks { display: flex; flex-direction: column; gap: var(--sp-6); }
.lblock { border: var(--bw) solid var(--line-strong);
  border-left: var(--bw-accent) solid var(--line-accent-dash); }
.lb-head { display: flex; align-items: flex-start; gap: var(--sp-5); flex-wrap: wrap;
  padding: var(--sp-5) var(--sp-6); }
.lb-head > .ldel { margin-left: auto; }
.lb-no { color: var(--text-5); font-size: var(--fs-11); min-height: var(--h-ctl);
  display: inline-flex; align-items: center; }
.lb-scalars { flex: 1 1 auto; min-width: 0; display: flex; flex-wrap: wrap; gap: var(--sp-5); }
.lb-scalar { display: flex; flex-direction: column; gap: var(--sp-2); min-width: 0;
  flex: 1 1 170px; }
.lb-scalar.num { flex: 0 1 120px; }
.lb-scalar.bool { flex: 0 1 140px; }
.lb-scalar.ref { flex: 2 1 230px; }
.lb-scalar.wide { flex: 1 1 100%; }
.lb-k { color: var(--text-4); font-size: var(--fs-11); display: flex; align-items: center;
  gap: var(--sp-3); flex-wrap: wrap; min-height: 16px; }
.lb-scalar .cin, .lb-scalar .cta { width: 100%; }
.lb-nests { display: flex; flex-direction: column; border-top: var(--bw) solid var(--line-soft); }
.lb-nest { padding: var(--sp-5) var(--sp-6); border-top: var(--bw) solid var(--line-faint); }
.lb-nest:first-child { border-top: 0; }
.lb-nest-h { color: var(--text-4); display: flex; align-items: center; gap: var(--sp-3);
  flex-wrap: wrap; margin-bottom: var(--sp-3); }
.lb-nest-h::before { content: "> "; color: var(--line-mute); }
.lb-nest-b { width: 100%; min-width: 0; }
/* 嵌套块里的表格/只读块占满宽度：取消单元格 260px 上限与固定表格布局造成的右侧空白 */
.lb-nest-b .ro-cell { max-width: none; }
.lb-nest-b .ltable-scroll, .lb-nest-b .ltable-edit, .lb-nest-b .ltable-ro { width: 100%; }

/* ---------- 引用字段选择器（批4 组件03）：可搜索候选 + 已选值 + 非法值黄提示 ---------- */
.refvals { display: flex; flex-wrap: wrap; gap: var(--sp-3); margin-bottom: var(--sp-3); }
.refval { display: inline-flex; align-items: center; gap: var(--sp-4); border: var(--bw) solid var(--line);
  padding: var(--sp-2) var(--sp-4); color: var(--text-2); max-width: 100%; min-width: 0; }
/* 批5.2（V10）：chip 名称过长时省略号收尾（悬停 title 给全文），不再硬裁到看不清。 */
.refval .mono2 { color: var(--accent); min-width: 0; overflow: hidden;
  text-overflow: ellipsis; white-space: nowrap; }
.refval.warn { border-color: var(--warn); }
.refwarn { color: var(--warn); font-size: var(--fs-11); }
.refnote { display: block; }
.refsel { width: 100%; border: var(--bw) solid var(--line); margin-top: var(--sp-2); }
.rf-hd { display: flex; align-items: center; gap: var(--sp-4); height: var(--h-ctl);
  padding: 0 var(--sp-4); border-bottom: var(--bw) solid var(--line-soft); }
.rf-hd .q { color: var(--text-4); white-space: nowrap; }
.rf-hd input { flex: 1 1 auto; height: 18px; border: 0; background: transparent;
  color: var(--text-value); font-family: inherit; font-size: var(--fs-12); outline: none; }
.rf-list { padding: var(--sp-2) 0; max-height: 180px; overflow-y: auto; }
.rf-it { display: flex; align-items: center; gap: var(--sp-5); padding: var(--sp-3) var(--sp-4);
  color: var(--text-2); cursor: pointer; }
.rf-it::before { content: "\00b7 "; color: var(--text-6); }
.rf-it:hover, .rf-it.h { background: var(--surface); color: var(--text-strong); }
.rf-it:hover::before, .rf-it.h::before { content: "> "; color: var(--accent); }
.rf-it .id2 { margin-left: auto; color: var(--text-5); font-size: var(--fs-11); }
.rf-ft { display: flex; gap: var(--sp-8); padding: var(--sp-3) var(--sp-4);
  border-top: var(--bw) solid var(--line-soft); color: var(--text-5); font-size: var(--fs-11); }
.empty { color: var(--text-5); padding: var(--sp-10) var(--sp-8); line-height: var(--lh-ex); }
.vtag { flex: 0 0 auto; height: var(--h-ctl-sm); display: flex; align-items: center;
  padding: 0 var(--sp-8); color: var(--text-5); border-top: var(--bw) solid var(--line-soft); }

/* ---------- 字段说明气泡（批4.6）：悬停中文名出现 · 点击固定 · Esc/点空白关闭 ----------
   视觉按 tokens.css 终端极简风：深底、细边框、等宽感、直角；细滚动条令牌承载长文。
   定位交给纯逻辑 helpPlace（优先字段行下方/上方，避让正在编辑的字段，窄窗口贴边）。 */
.flabel.helpable { cursor: help; border-bottom: var(--bw) dotted var(--line-mute);
  outline: none; }
.flabel.helpable:hover, .flabel.helpable:focus-visible { color: var(--text-strong);
  border-bottom-color: var(--accent); }
.flabel.helpable:focus-visible { box-shadow: 0 0 0 var(--focus-offset) var(--focus); }
.help-card { position: fixed; z-index: 50; max-width: min(420px, 92vw); max-height: 45vh;
  overflow: auto; background: var(--bg); border: var(--bw) solid var(--line-strong);
  padding: var(--sp-6) var(--sp-7); color: var(--text-2); font-family: var(--font-mono);
  font-size: var(--fs-11); line-height: var(--lh-ex); box-shadow: 0 6px 22px rgba(0, 0, 0, .5);
  overflow-wrap: anywhere; }
.help-card[hidden] { display: none; }
.help-card::-webkit-scrollbar { width: var(--sb-size); }
.help-card::-webkit-scrollbar-track { background: transparent; }
.help-card::-webkit-scrollbar-thumb { background: var(--sb-thumb); border-radius: var(--radius-sb); }
.help-card::-webkit-scrollbar-thumb:hover { background: var(--sb-thumb-hover); }
.help-card .hc-close { position: absolute; top: var(--sp-3); right: var(--sp-3);
  width: 20px; height: 20px; display: flex; align-items: center; justify-content: center;
  padding: 0; background: transparent; border: var(--bw) solid transparent; cursor: pointer;
  color: var(--text-5); font-family: inherit; font-size: var(--fs-14); line-height: 1; }
.help-card .hc-close:hover { color: var(--text-strong); border-color: var(--line-strong); }
.help-card .hc-close:focus-visible { color: var(--text-strong);
  outline: none; box-shadow: 0 0 0 var(--focus-offset) var(--focus); }
.help-card .hc-hd { color: var(--text-strong); margin-bottom: var(--sp-4);
  padding-bottom: var(--sp-3); border-bottom: var(--bw) solid var(--line-soft);
  padding-right: var(--sp-10);
  display: flex; align-items: center; gap: var(--sp-5); flex-wrap: wrap; }
.help-card .hc-t { min-width: 0; overflow-wrap: anywhere; word-break: break-word; }
.help-card .hc-tag { color: var(--warn); font-size: var(--fs-10); }
.help-card .hc-row { display: grid; grid-template-columns: 68px minmax(0, 1fr);
  gap: var(--sp-5); padding: var(--sp-1) 0; }
.help-card .hc-k { color: var(--text-5); }
.help-card .hc-v { color: var(--text-value); white-space: pre-wrap;
  overflow-wrap: anywhere; word-break: break-word; }

/* ---------- 关联分区（批5 · 派生分区）：相关条目卡片 + 就地编辑 + 跳转 ---------- */
.assoc { display: flex; flex-direction: column; gap: var(--sp-6); }
.ac-hint { color: var(--text-3); font-size: var(--fs-12); line-height: var(--lh-ex);
  border-left: 2px solid var(--line-accent-dash); padding-left: var(--sp-5); }
.assoc-card { border: var(--bw) solid var(--line-strong); background: var(--surface); }
.assoc-card > .rows2 { padding: var(--sp-5) var(--sp-6) 0; }
.ac-head { display: flex; align-items: center; gap: var(--sp-5); flex-wrap: wrap;
  padding: var(--sp-4) var(--sp-6); border-bottom: var(--bw) solid var(--line-soft); }
.ac-head b { color: var(--text-strong); }
.ac-head .id2 { color: var(--text-5); font-size: var(--fs-11); font-family: var(--font-mono); }
.ac-rel { color: var(--text-5); font-size: var(--fs-11); }
.ac-sub { color: var(--text-5); font-size: var(--fs-11); padding: var(--sp-3) var(--sp-6) 0; }
.ac-foot { display: flex; align-items: center; gap: var(--sp-5); flex-wrap: wrap;
  padding: var(--sp-5) var(--sp-6); }
.ac-note { color: var(--text-5); font-size: var(--fs-11); }
.assoc-card.ro .ac-head { border-bottom: 0; }
.ajump, .asave { display: inline-flex; align-items: center; height: var(--h-ctl);
  padding: 0 var(--sp-8); font-family: inherit; font-size: var(--fs-12); cursor: pointer;
  background: transparent; border: var(--bw) solid var(--line-strong); color: var(--accent); }
.ajump:hover, .asave:hover { background: var(--surface-hover); }
.asave:disabled { color: var(--text-6); border-color: var(--line-soft); cursor: not-allowed; }

/* ---------- 条件行编辑器（批5）：主体 / 比较符 / 值 + 两级嵌套 + 增删行 ---------- */
.cond-edit { width: 100%; }
.cond-edit .cmeta, .map-edit .cmeta { color: var(--text-4); font-size: var(--fs-11);
  margin: var(--sp-2) 0 var(--sp-3); }
.crows { display: flex; flex-direction: column; gap: var(--sp-3); }
.crow { display: flex; align-items: center; gap: var(--sp-3); flex-wrap: wrap;
  border: var(--bw) solid var(--line-soft); background: var(--surface); padding: var(--sp-3); }
.crow.combine { flex-direction: column; align-items: stretch; }
.crow .chead { display: flex; align-items: center; gap: var(--sp-3); flex-wrap: wrap; }
.crow .cin { min-width: 92px; }
.crow .csubject { min-width: 120px; }
.crow .cvalue { min-width: 110px; }
.crow .cnote { color: var(--text-5); font-size: var(--fs-11); }
.cchildren { display: flex; flex-direction: column; gap: var(--sp-3); margin-top: var(--sp-3); }
.cgroup { border-left: 2px solid var(--line-accent-dash); padding-left: var(--sp-5);
  display: flex; flex-direction: column; gap: var(--sp-3); }
.cglab { color: var(--text-5); font-size: var(--fs-11); }
.cadd, .cdel { display: inline-flex; align-items: center; height: var(--h-ctl-sm);
  padding: 0 var(--sp-4); font-family: inherit; font-size: var(--fs-11); cursor: pointer;
  background: transparent; border: var(--bw) solid var(--line-strong); color: var(--text-3); }
.cadd { color: var(--accent); border-style: dashed; }
.cadd:hover { background: var(--surface-hover); }
.cdel:hover { border-color: var(--danger); color: var(--danger); }

/* ---------- 键值对表格（批5 数值覆盖 / 印记消耗）：键值行 + 增删 ---------- */
.map-edit { width: 100%; }
.mrows { display: flex; flex-direction: column; gap: var(--sp-3); }
.mrow { display: flex; align-items: center; gap: var(--sp-3); flex-wrap: wrap;
  border: var(--bw) solid var(--line-soft); background: var(--surface); padding: var(--sp-3); }
.mrow .mkey { min-width: 140px; }
.mrow .mval { min-width: 110px; }

/* ---------- 批6：新建条目 / 删除条目 / 全局检索 ---------- */
/* 新建入口在中栏列表上方（与搜索同区），只读身份下置灰不可用 */
.list-tools.lt-new { padding-bottom: var(--sp-2); }
.newbtn { width: 100%; justify-content: center; }
.newbtn:disabled { color: var(--text-disabled); border-color: var(--line-soft); cursor: not-allowed; }
/* 全局检索结果按模块分组：粘性分组头 + 条目行（点击跳转并切模块） */
.gsec { padding: var(--sp-3) var(--sp-6); color: var(--text-5); font-size: var(--fs-11);
  border-bottom: var(--bw) solid var(--line-soft); position: sticky; top: 0;
  background: var(--bg); z-index: 1; }
.gsec .gt { color: var(--text-3); }
.item .idtag { color: var(--text-5); font-size: var(--fs-11); margin-left: var(--sp-4); }
/* 新建条目的 ID 区：人话说明 + 建议 ID + 按名称生成 + 即时唯一性状态 */
.newid { border: var(--bw) solid var(--line-strong); background: var(--surface);
  padding: var(--sp-4) var(--sp-5); margin: var(--sp-4) var(--sp-6);
  display: flex; flex-wrap: wrap; align-items: center; gap: var(--sp-3); }
.newid .nidlab { color: var(--text-3); }
.newid input { flex: 1 1 180px; }
.newid .nid-rule { color: var(--text-5); font-size: var(--fs-11); }
.newid .nid-st { font-size: var(--fs-11); }
.newid .nid-st.red { color: var(--danger); }
.newid .nid-st.ok { color: var(--text-4); }
.newid .nid-hint { flex-basis: 100%; color: var(--text-4); font-size: var(--fs-11);
  line-height: var(--lh-ex); }
.newfoot { display: flex; flex-wrap: wrap; align-items: center; gap: var(--sp-3);
  margin: var(--sp-4) var(--sp-6); }
.newfoot .nfn { color: var(--text-5); font-size: var(--fs-11); }
</style>
</head>
<body>
<div class="app">

  <header class="topbar">
    <span class="brand"><span class="mark">▚</span> 内容编辑器 :: 分区页签</span>
    <label class="pkgsel">
      <span class="lb">pkg=</span>
      <select id="packs" aria-label="内容包选择器"></select>
      <span class="from">manifest.json</span>
    </label>
    <span class="saved" id="dirty">已保存</span>
    <div class="topright">
      <label class="rolesel">
        <span class="lb">身份=</span>
        <select id="role" aria-label="权限位切换"></select>
      </label>
      <span class="role" id="roleTag">可编辑</span>
    </div>
  </header>

  <div class="body">

    <!-- 栏①：模块分类栏（模块与层级来自 manifest 声明；父子缩进表达） -->
    <aside class="col-mod">
      <div class="col-hd">模块<span class="src" id="mod-src">manifest.modules</span></div>
      <nav class="mods" id="mods"></nav>
    </aside>

    <!-- 栏②：条目列表栏（只名字 · 细滚动条 · 无翻页器） -->
    <aside class="col-list">
      <div class="list-hd">
        <span class="list-title" id="list-title">条目</span>
        <span class="list-count" id="list-count"></span>
      </div>
      <div class="list-tools lt-new">
        <button class="ladd newbtn" id="btn-new" type="button"
          title="在当前模块新建一个条目：先给一个可编辑的建议 ID（即时校验唯一性），其余字段按元数据默认值初始化；创建走校验 + 原子写 + 自动备份">+ 新建条目</button>
      </div>
      <div class="list-tools">
        <div class="search"><input id="filter" placeholder="过滤当前模块（按名称/ID）" aria-label="过滤当前模块（本地，按名称或 ID）"></div>
      </div>
      <div class="list-tools lt-g">
        <div class="search"><input id="gfilter" placeholder="全局检索（跨模块 · 按名称/ID）" aria-label="全局检索（跨模块，按名称或 ID）"></div>
      </div>
      <div class="rows" id="rows"></div>
      <div class="list-ft"><span>无翻页 · 滚动查看</span><span class="sp" id="list-ft">共 0 条</span></div>
    </aside>

    <!-- 栏③：大编辑面板（占其余全部宽度；批2 可编辑 + 草稿态 + 校验/保存/回退） -->
    <section class="panel">
      <div class="panel-hd">
        <span class="panel-title" id="p-title">未选择条目</span>
        <span class="panel-sub" id="p-sub"></span>
        <span class="panel-id" id="p-id"></span>
      </div>
      <div class="toolbar" id="toolbar">
        <button class="btn" id="btn-validate" disabled>校验</button>
        <button class="btn primary" id="btn-save" disabled>保存</button>
        <button class="btn" id="btn-cancel" disabled>取消</button>
        <button class="btn danger" id="btn-delete" disabled
          title="删除当前条目（二次确认；删除前自动备份，可用右侧「回退到上一份备份」恢复）">删除条目</button>
        <span class="sp"></span>
        <span class="tbnote" id="backup-note">备份：—</span>
        <button class="btn danger" id="btn-rollback" disabled>回退到上一份备份</button>
      </div>
      <div class="panel-body" id="p-body">
        <div class="empty">从左侧选择模块与条目。字段按内容包元数据渲染；改动先进草稿，保存时才校验并落盘。</div>
      </div>
      <div class="panel-ft"><span>批6 · 新增/删除条目 + 检索（建议 ID 即时唯一性 · 删除二次确认 + 被引用黄提示 · 跨模块全局检索 · 改动先进草稿）</span></div>
    </section>

  </div>

  <div class="vtag" id="vtag">终端极简风 · 元数据驱动 · 零 CDN</div>
</div>

<!-- 字段说明气泡（批4.6）：内容由后端 help_card 自动拼装 + 元数据人工 help 填充 -->
<div id="help-card" class="help-card" role="tooltip" hidden></div>

<script>
"use strict";

/* 草稿态纯逻辑（无 DOM 依赖；浏览器挂在 globalThis.EditorDraft，node 下走 module.exports）。
 * 语义：改动先进草稿 → 与「原值」相同的改动自动撤销（未保存计数据此归零）→ 保存/取消清空。 */
/* EDITOR_DRAFT_BEGIN */
(function (root, factory) {
  if (typeof module === "object" && module.exports) { module.exports = factory(); }
  else { root.EditorDraft = factory(); }
})(typeof globalThis !== "undefined" ? globalThis : this, function () {
  function deepSame(a, b) {
    if (a === b) { return true; }
    if (typeof a !== typeof b) { return false; }
    if (a && b && typeof a === "object") { return JSON.stringify(a) === JSON.stringify(b); }
    return false;
  }
  function newDraft() { return { changes: {} }; }
  function set(draft, key, value, baseValue) {
    if (deepSame(value, baseValue)) { delete draft.changes[key]; }
    else { draft.changes[key] = value; }
    return draft;
  }
  function count(draft) { return Object.keys(draft.changes).length; }
  function dirty(draft) { return count(draft) > 0; }
  function keys(draft) { return Object.keys(draft.changes); }
  function patch(draft) {
    var out = {};
    Object.keys(draft.changes).forEach(function (k) { out[k] = draft.changes[k]; });
    return out;
  }
  function discard(draft) { draft.changes = {}; return draft; }
  return { newDraft: newDraft, set: set, count: count, dirty: dirty, keys: keys,
           patch: patch, discard: discard, deepSame: deepSame };
});
/* EDITOR_DRAFT_END */

/* 分组页签纯逻辑（无 DOM 依赖；浏览器挂 globalThis.EditorGroups，node 下走 module.exports）。
 * 语义：页签 = 后端元数据声明的分组（顺序/显示名/计数都来自元数据，
 * 但声明了却没有字段落进去的组也保留 → empty=true 走空态文案）。
 * 切组只改「当前视图索引」，**绝不触碰草稿**：草稿按字段键持有，跨组编辑不丢。 */
/* EDITOR_GROUPS_BEGIN */
(function (root, factory) {
  if (typeof module === "object" && module.exports) { module.exports = factory(); }
  else { root.EditorGroups = factory(); }
})(typeof globalThis !== "undefined" ? globalThis : this, function () {
  function labelOf(g) {
    var name = g && g.name != null ? String(g.name) : "";
    var label = g && g.label ? String(g.label) : "";
    return label || name;
  }
  function view(groups, fields) {
    var byName = {};
    (fields || []).forEach(function (f) {
      var n = String((f && f.group) || "");
      (byName[n] = byName[n] || []).push(f);
    });
    var seen = {};
    var out = [];
    (groups || []).forEach(function (g) {
      var name = g && g.name != null ? String(g.name) : "";
      if (!name || seen[name]) { return; }
      seen[name] = true;
      var fs = byName[name] || [];
      out.push({ name: name, label: labelOf(g), fields: fs,
                 count: typeof g.count === "number" ? g.count : fs.length,
                 empty: fs.length === 0 });
    });
    Object.keys(byName).forEach(function (name) {
      if (seen[name] || !name) { return; }
      seen[name] = true;
      out.push({ name: name, label: name, fields: byName[name],
                 count: byName[name].length, empty: false });
    });
    out.active = 0;
    return out;
  }
  function switchGroup(v, index) {
    var i = Number(index);
    if (!isFinite(i) || i < 0 || i >= v.length) { i = 0; }
    v.active = i;
    return v;
  }
  function activeFields(v) { return (v[v.active || 0] || { fields: [] }).fields || []; }
  return { view: view, switchGroup: switchGroup, activeFields: activeFields };
});

/* EDITOR_HEADER_LABEL_BEGIN */
// 列表表头/块标签（批5.2 · V11）：只显示「中文名」+ 类型，原始键名缩为悬停 tooltip。

function headerLabelHtml(label, key) {
  var l = label == null ? "" : String(label);
  var k = key == null ? "" : String(key);
  var text = l || k;
  var title = (k && l && l !== k) ? (l + "（" + k + "）") : (l || k);
  return '<span class="hkey"' + (title ? ' title="' + esc(title) + '"' : "") + ">"
    + esc(text) + "</span>";
}
/* EDITOR_HEADER_LABEL_END */

/* EDITOR_LABELED_KEY_BEGIN */
// 「中文（键）」并列（批5.2 · V9）：区块副标题/空态里不再裸露原始键；有中文名时

function labeledKey(label, key) {

/* EDITOR_LABELED_KEY_END */

/* EDITOR_COUNT_LABEL_BEGIN */
// 模块计数口径（批5.2 · V6）：左栏模块计数含子项，中栏条目列表是本模块条数——口径不同
// 却同样显示一个裸数字，容易误会。此处统一给「含子项」标注 + 悬停明细；叶子模块（无子项）
// 计数等于本模块条数，不加后缀，口径天然一致。通用：只按 own_count/count/children 判定。
function moduleCountLabel(n) {
  var node = n || {};
  var total = node.count == null ? 0 : Number(node.count);
  var own = node.own_count == null ? total : Number(node.own_count);
  var hasKids = !!(node.children && node.children.length) || own !== total;
  var text = String(total) + (hasKids ? "（含子项）" : "");

    ? ("含子项合计 " + total + "：本模块 " + own + " + 子项 " + (total - own))

/* EDITOR_TOPBAR_LABEL_BEGIN */
// 顶栏内容包显示（批5.2 · V2）：窄窗口下包名/标识会被省略（曾截成 `(veinbo..`）——可见文本
// 保持紧凑，完整信息（名称/标识/版本/模块数）挂 `title`，悬停可见；宽度分配交给 CSS
// （可收缩项省略号、身份切换固定宽）。通用：字段缺失按实际值回退。
function packOptionText(p) {
  var pack = p || {};
  var name = pack.name == null ? "" : String(pack.name);
  var id = pack.id == null ? "" : String(pack.id);
  var count = pack.module_count == null ? 0 : pack.module_count;
  return (name || id) + "  (" + id + " · " + count + " 模块)";
}

function packOptionTitle(p) {
  var pack = p || {};
  var name = pack.name == null ? "" : String(pack.name);
  var id = pack.id == null ? "" : String(pack.id);
  var parts = [(name || id) + (id && name && name !== id ? "（" + id + "）" : "")];
  if (pack.version) { parts.push("版本 " + pack.version); }
  parts.push((pack.module_count == null ? 0 : pack.module_count) + " 个模块");
  parts.push("来源 manifest.json");

/* EDITOR_TOPBAR_LABEL_END */

/* EDITOR_ROLLBACK_BEGIN */
// 回退按钮可用性（批5.2 · V4）：无备份（或只读 / 请求中）时必须真禁用——旧实现只在
// 成功回读备份状态时写 `disabled`，切到空模块/备份接口失败会沿用上一模块的可用态。
// 判定集中在这里，`refreshBackup`/`setBusy`/切换模块统一调用；视觉走 tokens 的
// `.btn:disabled`（灰边灰字）。

/* EDITOR_ROLLBACK_END */

/* EDITOR_FIELD_LABEL_BEGIN */
// 字段标签渲染（批3.5）：中文名为主 + 原始键名为辅。
//   · 元数据给了中文名（label !== 原始键）→「中文名 + 弱化键名」并列；
//   · 无中文名（label 与键相同 / 键缺失）→ 只显示原始键（现状，不凭空造词）；
//   · 通用：任何模块、任何字段都走这一个函数，框架不认任何业务字段名。
function fieldLabelHtml(label, key) {
  var l = label == null ? "" : String(label);
  var k = key == null ? "" : String(key);
  if (k && l && l !== k) {
    return esc(l) + ' <span class="fkey">' + esc(k) + "</span>";
  }
  return esc(l || k);
}
/* EDITOR_FIELD_LABEL_END */
function el(id) { return document.getElementById(id); }

/* EDITOR_HELP_BEGIN */
// 字段说明气泡（批4.6）：纯逻辑部分（可 node 直接执行；DOM 接线在本模块下方）。
//   · 卡片内容 = 后端 help_card（自动拼装：类型/数值还是比例/建议范围/默认值/必填/
//     候选值/引用目标 + 人工 help）；前端只按结构渲染，不认字段类型、不认业务字段名。
//   · 状态机：悬停开（未固定）· 点击固定/再点关闭 · Esc 或点空白关闭 · 键盘可达。
var HELP_CARDS = {};   // 说明 id → help_card（每次渲染重建，见 resetHelpCards）
var HELP_SEQ = 0;

function resetHelpCards() { HELP_CARDS = {}; HELP_SEQ = 0; }

function helpRegister(card) {
  if (!card) { return ""; }
  var id = "h" + (++HELP_SEQ);
  HELP_CARDS[id] = card;
  return id;
}

// 卡片行（有序）：人工「说明」优先，其后是自动拼装项；空项不出现。
// 批5.2（V1）：行内提示不再常驻撑高字段行——`hint`（必填/候选/引用/范围/0=不限/默认）
// 与 `view_note`（当前视图说明，如本批只读）都收进本卡片，字段网格行高因此一致。
function helpLines(card) {
  if (!card) { return []; }
  var out = [];
  if (card.help) { out.push({ k: "说明", v: card.help }); }
  if (card.hint) { out.push({ k: "提示", v: card.hint }); }
  if (card.view_note) { out.push({ k: "当前视图", v: card.view_note }); }
  var typeText = card.type || "未标注";
  if (card.type_source) { typeText += " · " + card.type_source; }
  out.push({ k: "类型", v: typeText });
  out.push({ k: "数值/比例", v: card.scale || "未标注" });
  out.push({ k: "建议范围", v: card.range || "未标注" });
  out.push({ k: "默认值", v: card.default || "无默认值" });
  out.push({ k: "填写要求", v: card.required ? "必填" : "选填" });
  if (card.enum && card.enum.length) { out.push({ k: "候选值", v: card.enum.join(" / ") }); }
  if (card.ref_target) { out.push({ k: "引用目标", v: String(card.ref_target) }); }
  return out;
}

// 卡片标题：中文名（原始键）——与字段标签同一口径。
function helpTitle(card) {
  if (!card) { return ""; }
  var label = card.label || card.key || "";
  if (card.key && label && card.key !== label) { return label + "（" + card.key + "）"; }
  return label || card.key || "";
}

function helpCardHtml(card) {
  if (!card) { return ""; }
  var rows = helpLines(card).map(function (r) {
    return '<div class="hc-row"><span class="hc-k">' + esc(r.k) + "</span>"
      + '<span class="hc-v">' + esc(r.v) + "</span></div>";
  }).join("");
  return '<button type="button" class="hc-close" aria-label="关闭说明" title="关闭说明（Esc）">×</button>'
    + '<div class="hc-hd"><span class="hc-t">' + esc(helpTitle(card)) + "</span>"
    + (card.unregistered ? '<span class="hc-tag">元数据未登记</span>' : "")
    + "</div>" + rows;
}

// 状态机（纯函数，便于 node 断言）：{open, pinned, id}
function helpStateClosed() { return { open: false, pinned: false, id: null }; }
function helpHover(state, id) {
  if (state && state.pinned) { return state; }
  return { open: true, pinned: false, id: id };
}
function helpUnhover(state) {
  if (state && state.pinned) { return state; }
  return helpStateClosed();
}
function helpClick(state, id) {
  if (state && state.open && state.pinned && state.id === id) { return helpStateClosed(); }
  return { open: true, pinned: true, id: id };
}
function helpKey(state, id, keyName) {
  if (keyName === "Escape" || keyName === "Esc") { return helpStateClosed(); }
  if (keyName === "Enter" || keyName === " " || keyName === "Spacebar") {
    return helpClick(state, id);
  }
  return state || helpStateClosed();
}
function helpVisible(state, id) {
  return !!(state && state.open && state.id === id);
}

// 定位：**优先避让被编辑字段**——先试上方，再侧向（右/左），空间实在不足才向下；
// 四个候选都不与 avoid（正在编辑的字段行矩形）重叠，保证不遮住当前输入框。
// 视口内放不下时选「可见面积最大且不压字段行」的候选（水平收进视口）；极端才退回上方。
// 矩形统一 {left, top, right, bottom}。
function helpPlace(anchor, size, viewport, avoid, gap) {
  gap = (gap == null) ? 6 : gap;
  var margin = 4;
  avoid = avoid || anchor;
  var w = size.w || 0, h = size.h || 0;
  function rect(placement, left, top) {
    return { placement: placement, left: left, top: top,
             right: left + w, bottom: top + h };
  }
  var cands = [
    rect("above", anchor.left, avoid.top - h - gap),
    rect("right", avoid.right + gap, avoid.top),
    rect("left", avoid.left - w - gap, avoid.top),
    rect("below", anchor.left, avoid.bottom + gap)
  ];
  function fits(c) {
    return c.left >= margin && c.top >= margin
      && c.right <= viewport.w - margin && c.bottom <= viewport.h - margin;
  }
  for (var i = 0; i < cands.length; i++) {
    if (fits(cands[i])) { return cands[i]; }
  }
  // 视口放不下：逐候选水平收进视口，取可见面积最大者；压到字段行的一律淘汰。
  var best = null, bestArea = -1;
  for (var j = 0; j < cands.length; j++) {
    var c = cands[j];
    c.left = Math.max(margin, Math.min(c.left, viewport.w - w - margin));
    c.right = c.left + w;
    if (helpOverlaps(c, avoid)) { continue; }
    var visW = Math.max(0, Math.min(c.right, viewport.w - margin) - Math.max(c.left, margin));
    var visH = Math.max(0, Math.min(c.bottom, viewport.h - margin) - Math.max(c.top, margin));
    var area = visW * visH;
    if (area > bestArea) { bestArea = area; best = c; }
  }
  if (best) { return best; }
  var fallback = rect("above", anchor.left, Math.max(margin, avoid.top - h - gap));
  fallback.left = Math.max(margin, Math.min(fallback.left, viewport.w - w - margin));
  fallback.right = fallback.left + w;
  return fallback;
}

function helpOverlaps(a, b) {
  return !(a.right <= b.left || b.right <= a.left
    || a.bottom <= b.top || b.bottom <= a.top);
}

// 字段标签包装：可出说明卡时加键盘可达的触发器（tabindex/role/aria-expanded）。
// 批5.2（V1）：`f.view_note`（当前视图说明）并入说明卡内容；无 view_note 时原样注册
// `f.help_card`（保持既有调用零行为变化）。
function helpTriggerHtml(f, inner) {
  if (!f || !f.help_card) { return inner; }
  var card = f.help_card;
  if (f.view_note) {
    card = {};
    for (var ck in f.help_card) { card[ck] = f.help_card[ck]; }
    card.view_note = f.view_note;
  }
  var id = helpRegister(card);
  return '<span class="flabel helpable" data-help="' + esc(id) + '" tabindex="0"'
    + ' role="button" aria-expanded="false" aria-label="字段说明：'
    + esc(f.label || f.key || "") + '">' + inner + "</span>";
}
/* EDITOR_HELP_END */

// ---- 说明气泡 DOM 接线（纯逻辑状态机见上；此处只做事件/定位/显隐）----
var helpDom = { state: helpStateClosed(), timer: null };

function helpCardBox() { return el("help-card"); }
function helpCancelClose() {
  if (helpDom.timer) { clearTimeout(helpDom.timer); helpDom.timer = null; }
}

function helpHideDom() {
  helpDom.state = helpStateClosed();
  var box = helpCardBox();
  if (box) { box.hidden = true; }
  Array.prototype.forEach.call(document.querySelectorAll(".flabel.helpable"), function (t) {
    t.setAttribute("aria-expanded", "false");
  });
}

function helpRenderDom(id) {
  var card = HELP_CARDS[id];
  var box = helpCardBox();
  if (!card || !box) { helpHideDom(); return; }
  box.innerHTML = helpCardHtml(card);
  box.hidden = false;
  var trig = document.querySelector('.flabel.helpable[data-help="' + id + '"]');
  var anchor = trig ? trig.getBoundingClientRect()
    : { left: 8, top: 8, right: 8, bottom: 8 };
  var row = (trig && trig.closest) ? trig.closest(".row") : null;
  var avoid = (row && row.getBoundingClientRect) ? row.getBoundingClientRect() : anchor;
  var pos = helpPlace(
    { left: anchor.left, top: anchor.top, right: anchor.right, bottom: anchor.bottom },
    { w: box.offsetWidth, h: box.offsetHeight },
    { w: window.innerWidth || 1024, h: window.innerHeight || 768 },
    { left: avoid.left, top: avoid.top, right: avoid.right, bottom: avoid.bottom }, 6);
  box.style.left = pos.left + "px";
  box.style.top = pos.top + "px";
  Array.prototype.forEach.call(document.querySelectorAll(".flabel.helpable"), function (t) {
    t.setAttribute("aria-expanded", t === trig ? "true" : "false");
  });
}

function helpApply(state) {
  helpDom.state = state;
  if (state && state.open) { helpRenderDom(state.id); } else { helpHideDom(); }
}

function bindHelp() {
  helpHideDom();
  Array.prototype.forEach.call(document.querySelectorAll(".flabel.helpable"), function (trig) {
    var id = trig.dataset.help;
    trig.addEventListener("mouseenter", function () {
      helpCancelClose();
      helpApply(helpHover(helpDom.state, id));
    });
    trig.addEventListener("mouseleave", function () {
      if (helpDom.state.pinned) { return; }
      helpCancelClose();
      helpDom.timer = setTimeout(function () { helpApply(helpUnhover(helpDom.state)); }, 140);
    });
    trig.addEventListener("click", function (ev) {
      ev.preventDefault();
      helpCancelClose();
      helpApply(helpClick(helpDom.state, id));
    });
    trig.addEventListener("keydown", function (ev) {
      var next = helpKey(helpDom.state, id, ev.key);
      if (next === helpDom.state) { return; }
      ev.preventDefault();
      helpCancelClose();
      helpApply(next);
    });
  });
  var box = helpCardBox();
  if (!box || box.dataset.bound) { return; }
  box.dataset.bound = "1";
  box.addEventListener("mouseenter", helpCancelClose);
  box.addEventListener("mouseleave", function () {
    if (helpDom.state.pinned) { return; }
    helpApply(helpUnhover(helpDom.state));
  });
  // 卡片右上角关闭按钮（×）：点击即关（在卡片内，document 的「点空白关闭」不会接管）。
  box.addEventListener("click", function (ev) {
    var t = ev.target;
    if (t && t.closest && t.closest(".hc-close")) {
      ev.preventDefault();
      helpApply(helpStateClosed());
    }
  });
  document.addEventListener("click", function (ev) {
    if (!helpDom.state.open) { return; }
    var t = ev.target;
    if (t && t.closest && (t.closest(".help-card") || t.closest(".flabel.helpable"))) { return; }
    helpApply(helpStateClosed());
  });
  document.addEventListener("keydown", function (ev) {
    if (ev.key === "Escape" && helpDom.state.open) { helpApply(helpStateClosed()); }
  });
  window.addEventListener("resize", function () {
    if (helpDom.state.open) { helpRenderDom(helpDom.state.id); }
  });
}

function api(path) {
  return fetch(path, { headers: { "Accept": "application/json" } }).then(function (r) {
    return r.json().then(function (data) {
      if (!r.ok) { throw new Error((data && data.error) || ("HTTP " + r.status)); }
      return data;
    });
  });
}
function postJSON(path, body) {
  return fetch(path, {
    method: "POST",
    headers: { "Content-Type": "application/json", "Accept": "application/json" },
    body: JSON.stringify(body || {})
  }).then(function (r) {
    return r.json().then(function (data) {
      if (!r.ok) { throw new Error((data && data.error) || ("HTTP " + r.status)); }
      return data;
    });
  });
}
function fail(where, err) {
  el("p-body").innerHTML = '<div class="empty">' + esc(where + " 失败：" + err.message) + "</div>";
}

// ---------------------------------------------------------------------------
// 草稿态：未保存计数 / 取消 / 离开守卫（不静默丢失）
// ---------------------------------------------------------------------------
function draftCount() {
  var n = 0;
  allForms().forEach(function (ctx) { n += EditorDraft.count(ctx.draft); });
  return n;
}

function markDirty() {
  var n = draftCount();
  var tag = el("dirty");
  tag.textContent = n ? ("未保存改动 " + n + " 项") : "已保存";
  tag.className = "saved" + (n ? " dirty" : "");
  var has = n > 0;
  var isNew = !!state.newEntry;
  // 新建态：主表单的校验/保存不适用（走新建面板的「创建」按钮），置灰避免误点
  el("btn-save").disabled = !has || !state.editable || state.busy || isNew;
  el("btn-cancel").disabled = (!has && !isNew) || state.busy;
  el("btn-validate").disabled = !has || state.busy || isNew;
  // 删除入口：有选中条目 + 可编辑 + 非请求中 + 非新建态
  el("btn-delete").disabled = !state.entry || !state.editable || state.busy || isNew;
  // 新建入口：只读身份 / 未选模块 / 请求中不可用（与批2 权限位一致）
  el("btn-new").disabled = !state.module || !state.editable || state.busy;
  refreshCreateButton();
  // 每个表单上下文各自标脏（主表单 + 关联分区条目；字段键只在各自上下文里比对）
  allForms().forEach(function (ctx) {
    var box = formBox(ctx);
    if (!box) { return; }
    Array.prototype.forEach.call(box.querySelectorAll(".row[data-field]"), function (row) {
      row.classList.toggle("dirty", hasOwn(ctx.draft.changes, row.dataset.field));
    });
  });
  Array.prototype.forEach.call(document.querySelectorAll(".item[data-id]"), function (it) {
    it.classList.toggle("dirty", n > 0 && it.dataset.id === state.entry);
  });
}

function discardDraft() {
  allForms().forEach(function (ctx) { EditorDraft.discard(ctx.draft); });
  if (state.newDraft) { EditorDraft.discard(state.newDraft); }
  // 退出新建态：主表单草稿指针还原（新建草稿已丢弃）
  MAIN_CTX.draft = draft; MAIN_CTX.isNew = false;
  state.newEntry = null; state.newDraft = null; state.newIdTouched = false;
  state.pendingDrafts = {};
  markDirty();
}

function canLeave() {
  var n = draftCount();
  if (!n) { return true; }
  return window.confirm("当前有 " + n + " 项未保存改动；离开将丢弃这些改动。确定离开吗？");
}

// ---------------------------------------------------------------------------
// 权限位：机主可编辑 / GM 只读预览
// ---------------------------------------------------------------------------
function loadSession() {
  return api("/api/session").then(function (s) {
    state.role = s.role; state.editable = !!s.editable;
    var sel = el("role");
    sel.innerHTML = "";
    (s.roles || []).forEach(function (r) {
      var o = document.createElement("option");
      o.value = r.value; o.textContent = r.label;
      sel.appendChild(o);
    });
    sel.value = state.role;
    renderRoleTag();
  });
}

function renderRoleTag() {
  var tag = el("roleTag");
  tag.textContent = state.editable ? "可编辑" : "只读预览";
  tag.className = "role" + (state.editable ? "" : " ro");
  markDirty();
  refreshRollbackButton();   // V4：只读身份切换后回退按钮同步禁用
}

function switchRole(role) {
  return postJSON("/api/session/role", { role: role }).then(function (s) {
    state.role = s.role; state.editable = !!s.editable;
    renderRoleTag();
    return reloadDetail();  // 只读/可编辑切换后重画控件
  });
}

// ---------------------------------------------------------------------------
// 内容包选择器
// ---------------------------------------------------------------------------
function loadPacks() {
  return api("/api/packs").then(function (data) {
    var sel = el("packs");
    sel.innerHTML = "";
    (data.packs || []).forEach(function (p) {
      var o = document.createElement("option");
      o.value = p.id;
      // V2：可见文本紧凑 + 完整信息（名称/标识/版本/模块数）挂 title，悬停可见。
      o.textContent = packOptionText(p);
      o.title = packOptionTitle(p);
      sel.appendChild(o);
    });
    state.pack = data.default || (data.packs[0] && data.packs[0].id) || null;
    if (state.pack) { sel.value = state.pack; }
    syncPackTitle();
    sel.addEventListener("change", function () {
      if (!canLeave()) { sel.value = state.pack; return; }
      discardDraft();
      state.pack = sel.value; state.module = null; state.entry = null;
      state.refCache = {}; state.refKnown = {}; state.refQuery = {};  // 换包后引用候选必须重拉
      state.entryIndex = null; state.gquery = "";
      el("gfilter").value = "";   // 换包后全局检索结果作废
      syncPackTitle();
      loadModules();
      loadEntryIndex();
    });
  });
}

// 顶栏包名被省略时，悬停出完整信息（V2）；`label` 与 `select` 都挂 title。
function syncPackTitle() {
  var sel = el("packs");
  if (!sel) { return; }
  var opt = sel.options[sel.selectedIndex];
  var title = (opt && opt.title) || (opt ? opt.textContent : "");
  sel.title = title;
  var box = sel.closest ? sel.closest(".pkgsel") : null;
  if (box) { box.title = title; }
}

// ---------------------------------------------------------------------------
// 栏①：模块分类（层级来自包元数据；item.children 递归渲染）
// ---------------------------------------------------------------------------
function renderModules() {
  var nav = el("mods");
  nav.innerHTML = "";
  function node(n, depth) {
    var d = document.createElement("div");
    d.className = "mod" + (n.children && n.children.length ? " grp" : "") + (depth > 0 ? " sub" : "")
      + (n.module === state.module ? " on" : "");
    d.dataset.module = n.module;
    // V6：计数统一标注口径（含子项时明示 + 悬停明细；叶子模块为本模块条数）。
    var cl = moduleCountLabel(n);
    d.innerHTML = esc(n.label) + '<span class="ct" title="' + esc(cl.title) + '">'
      + esc(cl.text) + "</span>";
    d.addEventListener("click", function () { selectModule(n.module); });
    nav.appendChild(d);
    (n.children || []).forEach(function (c) { node(c, depth + 1); });
  }
  (state.modules || []).forEach(function (m) { node(m, 0); });
}

function loadModules() {
  if (!state.pack) { return Promise.resolve(); }
  return api("/api/pack/" + enc(state.pack) + "/modules").then(function (data) {
    state.modules = data.modules || [];
    var flat = data.flat ? "平铺" : "层级声明";
    // V6：层级包在栏头明示计数口径；平铺包每个模块计数即本模块条数，无需标注。
    el("mod-src").textContent = "manifest.modules · " + state.modules.length + " · " + flat
      + (data.flat ? "" : " · 计数含子项");
    var first = state.modules[0];
    if (!state.module && first) { selectModule(first.module); } else { renderModules(); }
  });
}

// ---------------------------------------------------------------------------
// 栏②：条目列表（只名字；无翻页）
// ---------------------------------------------------------------------------
function selectModule(mod) {
  if (!canLeave()) { return; }
  discardDraft();
  state.result = null;
  state.module = mod; state.entry = null; state.filter = ""; el("filter").value = "";
  // 切模块 → 全局检索范围回到「当前模块」，本地过滤也清空（避免两处查询串味）
  state.gquery = ""; el("gfilter").value = "";
  // V4：切模块先清空备份状态 → 回退按钮立即禁用，不沿用上一模块的可用外观。
  state.backup = null;
  el("backup-note").textContent = "备份：—";
  refreshRollbackButton();
  renderModules();
  var pos = findModule(mod);
  el("list-title").textContent = pos ? pos.label : mod;
  return loadEntries();
}

function findModule(mod) {
  var found = null;
  (function walk(list) {
    (list || []).forEach(function (n) {
      if (n.module === mod) { found = n; }
      if (n.children) { walk(n.children); }
    });
  })(state.modules);
  return found;
}

function loadEntries() {
  if (!state.pack || !state.module) { return Promise.resolve(); }
  return api("/api/pack/" + enc(state.pack) + "/module/" + enc(state.module) + "/entries")
    .then(function (data) {
      state.entries = data.entries || [];
      el("list-count").textContent = state.entries.length + " 条";
      renderEntries();
      if (state.entries.length) { selectEntry(state.entries[0].id); }
      else {
        // 空模块没有条目 → 没有备份状态可读：回退按钮保持禁用（V4）。
        state.backup = null;
        el("backup-note").textContent = "备份：—";
        refreshRollbackButton();
        el("p-body").innerHTML = '<div class="empty">该模块暂无条目（条目列表为空）。</div>'
          + '<div id="result" hidden></div>';   // 删空模块后仍能展示「被引用者」等结果
        el("p-title").textContent = EMPTY_TEXT; el("p-sub").textContent = ""; el("p-id").textContent = "";
        helpHideDom();
      }
    });
}

function renderEntries() {
  // 全局检索优先：有跨模块查询时，中栏列「按模块分组」的命中结果（点击跳转+切模块）
  if (state.gquery) { return renderGlobalResults(); }
  var box = el("rows");
  box.innerHTML = "";
  // 中栏过滤作用域写清：当前模块内，按名称或 ID 过滤（EditorEntry 纯逻辑）
  var shown = EditorEntry.filterEntries(state.entries, state.filter);
  shown.forEach(function (e) {
    var d = document.createElement("div");
    d.className = "item" + (e.id === state.entry ? " on" : "");
    d.dataset.id = e.id;
    d.textContent = e.name;
    d.title = e.name + "  [" + e.id + "]";
    d.addEventListener("click", function () { selectEntry(e.id); });
    box.appendChild(d);
  });
  if (state.filter && !shown.length) {
    box.innerHTML = '<div class="ex" style="padding:var(--sp-5) var(--sp-6)">'
      + "本模块没有匹配「" + esc(state.filter) + "」的名称或 ID。</div>";
  }
  el("list-ft").textContent = "共 " + shown.length + " 条"
    + (shown.length !== state.entries.length ? "（已过滤 / 全部 " + state.entries.length + "）" : "");
}

// 全局检索结果（跨模块；结果按模块分组，点击跳转并切换模块）
function renderGlobalResults() {
  var box = el("rows");
  box.innerHTML = "";
  var groups = EditorEntry.searchIndex(state.entryIndex, state.gquery);
  var total = EditorEntry.searchCount(groups);
  if (!groups.length) {
    box.innerHTML = '<div class="ex" style="padding:var(--sp-5) var(--sp-6)">'
      + "整包范围没有匹配「" + esc(state.gquery) + "」的名称或 ID"
      + (state.entryIndex ? "" : "（条目索引尚未加载）") + "。</div>";
  }
  groups.forEach(function (g) {
    var h = document.createElement("div");
    h.className = "gsec";
    h.innerHTML = '<span class="gt">' + esc(g.label) + "</span> · " + g.entries.length + " 条";
    box.appendChild(h);
    g.entries.forEach(function (e) {
      var d = document.createElement("div");
      d.className = "item" + (g.module === state.module && e.id === state.entry ? " on" : "");
      d.dataset.id = e.id;
      d.innerHTML = esc(e.name) + '<span class="idtag">' + esc(e.id) + "</span>";
      d.title = (g.label ? g.label + " · " : "") + e.name + "  [" + e.id + "]（点击跳转到该模块）";
      d.addEventListener("click", function () { jumpTo(g.module, e.id); });
      box.appendChild(d);
    });
  });
  el("list-ft").textContent = "全局命中 " + total + " 条 · 跨 " + groups.length + " 个模块";
}

// 全包条目索引（跨模块全局检索 + ID 即时唯一性校验的数据源；一次拉取，前端本地过滤）
function loadEntryIndex() {
  if (!state.pack) { return Promise.resolve(); }
  return api("/api/pack/" + enc(state.pack) + "/entry-index").then(function (d) {
    state.entryIndex = d;
    if (state.gquery) { renderGlobalResults(); }
    return d;
  }).catch(function () { state.entryIndex = null; });
}

// 新建/删除后的口径一致刷新：左栏计数 + 中栏条数 + 条目索引（页签计数随条目详情重画）
function refreshAfterMutation(newId, keepResult) {
  return loadModules()
    .then(function () { return loadEntries(); })
    .then(function () { return loadEntryIndex(); })
    .then(function () {
      if (newId && (state.entries || []).some(function (e) { return e.id === newId; })) {
        return selectEntry(newId);   // 注意：selectEntry 会清 state.result，故结果最后回填
      }
    })
    .then(function () {
      // 新建/删除的结果（含「被引用者」黄提示）在选中切换后回填，不被 selectEntry 清掉
      if (keepResult) { state.result = keepResult; renderResult(keepResult); }
    });
}

// ---------------------------------------------------------------------------
// 批6 · 新建条目（模块级）：建议 ID（可编辑）+ 即时唯一性 + 元数据默认值 + 创建
// 只读身份不可用；创建走批2 同一落盘链路（校验 → 原子写 → 自动备份 → 回退）。
// ---------------------------------------------------------------------------
function openNewEntry() {
  if (!state.module) { return Promise.resolve(); }
  if (!state.editable) {
    window.alert("当前身份为只读预览，不能新增条目；请切换为可编辑身份后重试。");
    return Promise.resolve();
  }
  if (!canLeave()) { return Promise.resolve(); }
  discardDraft();
  state.result = null;
  return api("/api/pack/" + enc(state.pack) + "/module/" + enc(state.module) + "/new")
    .then(function (d) { renderNewEntry(d); })
    .catch(function (err) { fail("读取新建表单", err); });
}

function newIdentHtml(d) {
  var rule = EditorEntry.ruleText((d.id_rule || {}).rule, (d.id_rule || {}).prefix);
  return '<div class="newid">'
    + '<span class="nidlab">条目 ' + esc(d.id_field_label || d.id_field) + "（ID）</span>"
    + '<input class="cin" id="new-id" type="text" autocomplete="off" spellcheck="false"'
    + ' value="' + esc(d.suggested_id || "") + '" placeholder="英文小写 + 下划线（如 sword_aura）">'
    + '<button type="button" class="ladd" id="btn-suggest"'
    + ' title="按元数据的 ID 规则，用当前名称生成一个不重复的建议 ID">按名称生成</button>'
    + '<span class="nid-st" id="new-id-st"></span>'
    + '<div class="nid-hint">' + esc(d.id_hint || "") + " 当前规则：" + esc(rule)
    + "（建议 ID 可自由修改）。</div></div>";
}

function renderNewEntry(d) {
  state.newEntry = d;
  state.newDraft = EditorDraft.newDraft();
  state.newIdTouched = false;
  el("p-title").textContent = "新建条目 · " + (d.module_label || d.module);
  el("p-sub").textContent = "字段按元数据默认值初始化 · 保存写入 " + d.module
    + ".json（校验 + 原子写 + 自动备份）";
  el("p-id").textContent = "（未保存）";
  resetHelpCards();
  MAIN_CTX.isNew = true;
  MAIN_CTX.module = state.module; MAIN_CTX.entry = null;
  MAIN_CTX.fields = d.fields || [];
  MAIN_CTX.fieldIndex = {};
  (d.fields || []).forEach(function (f) { MAIN_CTX.fieldIndex[f.key] = f; });
  MAIN_CTX.draft = state.newDraft; MAIN_CTX.detail = d;
  renderCtx = MAIN_CTX;
  state.forms = {};

  var html = '<div class="meta"><span class="mk">新建条目</span>'
    + '<span class="mi">' + (d.field_count || 0) + " 个可初始化字段</span>"
    + '<span class="mi">' + (d.group_count || 0) + " 个分组</span>"
    + '<span class="mi">' + (state.editable ? "可编辑" : "只读预览") + "</span>"
    + '<span class="src" title="元数据来源：' + esc(d.meta_source) + '">'
    + esc(d.meta_source) + "</span></div>"
    + '<div id="result" hidden></div>';
  html += newIdentHtml(d);
  html += '<div class="newfoot"><button type="button" class="btn primary" id="btn-create">创建条目</button>'
    + '<button type="button" class="btn" id="btn-new-cancel">放弃并关闭</button>'
    + '<span class="nfn">创建后写入该模块文件；可随时用「回退到上一份备份」撤销。</span></div>';

  var groupTabs = EditorGroups.view(d.groups || [], d.fields || []);
  state.tabs = groupTabs.map(function (g, i) {
    return { kind: "group", idx: i, label: g.label, count: g.count, group: g };
  });
  if (!groupTabs.length) {
    html += '<div class="empty">该模块没有额外字段需要初始化（按元数据只填 ID 即可创建）。</div>';
  } else {
    var tbar = '<div class="gtabs">';
    groupTabs.forEach(function (g, i) {
      tbar += '<button class="gtab' + (i === 0 ? " on" : "") + '" data-g="' + i
        + '" title="' + esc("分组键：" + g.name) + '">' + esc(g.label)
        + " <b>" + g.count + "</b></button>";
    });
    tbar += "</div>";
    html += tbar;
    groupTabs.forEach(function (g, i) {
      html += '<div class="gpane"' + (i === 0 ? "" : " hidden") + ' data-g="' + i + '">'
        + (g.empty
          ? '<div class="gempty">该分组暂无字段（元数据声明了此分组，新建条目里没有字段落在其中）。</div>'
          : '<div class="rows2">' + g.fields.map(fieldRow).join("") + "</div>")
        + "</div>";
    });
  }

  el("p-body").innerHTML = html;
  el("p-body").dataset.fctx = "main";
  renderCtx = MAIN_CTX;
  bindTabs();
  bindControls();
  bindNewIdent();
  bindHelp();
  state.pendingDrafts = {};
  markDirty();
}

function bindNewIdent() {
  var inp = el("new-id");
  if (inp) {
    inp.addEventListener("input", function () {
      state.newIdTouched = true;   // 用户手动改过 ID：不再自动跟随名称
      updateNewIdStatus();
    });
  }
  var sg = el("btn-suggest");
  if (sg) { sg.addEventListener("click", function () { suggestIdFromName(); }); }
  var cancel = el("btn-new-cancel");
  if (cancel) {
    cancel.addEventListener("click", function () {
      if (draftCount() && !window.confirm("放弃这次新建的未保存内容并关闭吗？")) { return; }
      discardDraft();
      return closeNewEntry();
    });
  }
  var create = el("btn-create");
  if (create) { create.addEventListener("click", function () { createEntry(); }); }
  // 名称字段：ID 未被手动改过时，跟随名称自动重取建议 ID（可发现、不用背规则）
  if (state.newEntry && state.newEntry.name_field) {
    var nf = el("p-body").querySelector('[data-key="' + state.newEntry.name_field + '"]');
    if (nf) {
      nf.addEventListener("input", function () {
        if (!state.newIdTouched) { suggestIdFromName(); }
      });
    }
  }
  updateNewIdStatus();
}

function currentNewId() {
  var inp = el("new-id");
  var v = inp ? String(inp.value || "").trim() : "";
  if (v) { return v; }
  return state.newEntry ? String(state.newEntry.suggested_id || "") : "";
}

function newIdStatusNow() {
  return EditorEntry.idStatus(currentNewId(), state.module, state.entryIndex);
}

function updateNewIdStatus() {
  var st = newIdStatusNow();
  var box = el("new-id-st");
  if (box) {
    box.textContent = st.message;
    box.className = "nid-st " + st.level;
  }
  refreshCreateButton();
  return st;
}

function refreshCreateButton() {
  var btn = el("btn-create");
  if (!btn) { return; }
  var st = state.newEntry ? newIdStatusNow() : { ok: false };
  btn.disabled = !state.editable || state.busy || !st.ok;
}

function suggestIdFromName() {
  if (!state.newEntry) { return Promise.resolve(); }
  var nameField = state.newEntry.name_field;
  var nf = nameField ? el("p-body").querySelector('[data-key="' + nameField + '"]') : null;
  var name = nf ? nf.value : "";
  return api("/api/pack/" + enc(state.pack) + "/module/" + enc(state.module)
    + "/suggest_id?name=" + enc(name))
    .then(function (d) {
      var inp = el("new-id");
      if (inp) { inp.value = d.suggested_id || ""; }
      state.newIdTouched = false;
      updateNewIdStatus();
    }).catch(function () { /* 建议失败不阻断：用户可手填 ID */ });
}

function closeNewEntry() {
  state.newEntry = null; state.newDraft = null; state.newIdTouched = false;
  MAIN_CTX.isNew = false; MAIN_CTX.draft = draft;
  state.pendingDrafts = {};
  if (state.entry) { return reloadDetail(); }
  el("p-body").innerHTML = '<div class="empty">从左侧选择模块与条目，或用「+ 新建条目」新建一个。</div>';
  el("p-title").textContent = "未选择条目"; el("p-sub").textContent = ""; el("p-id").textContent = "";
  markDirty();
  return Promise.resolve();
}

function createEntry() {
  if (!state.newEntry || !state.editable || state.busy) { return Promise.resolve(); }
  var st = updateNewIdStatus();
  if (!st.ok) { window.alert(st.message); return Promise.resolve(); }
  var eid = currentNewId();
  var patch = EditorDraft.patch(state.newDraft);
  setBusy(true);
  return postJSON("/api/pack/" + enc(state.pack) + "/module/" + enc(state.module) + "/entry",
    { entry_id: eid, patch: patch })
    .then(function (res) {
      state.result = res;
      if (res.ok) {
        state.newEntry = null; state.newDraft = null;
        MAIN_CTX.isNew = false; MAIN_CTX.draft = draft;
        state.pendingDrafts = {};
        return refreshAfterMutation(eid, res);
      }
      renderResult(res);
    }).catch(function (err) {
      state.result = { ok: false, message: "新建请求失败：" + err.message, errors: [] };
      renderResult(state.result);
    }).then(function () { setBusy(false); });
}

// ---------------------------------------------------------------------------
// 批6 · 删除条目：二次确认（人话：删哪个 / 不可撤销 / 可回退）+ 被引用检查（黄提示）
// ---------------------------------------------------------------------------
function deleteEntry() {
  if (!state.entry || !state.editable || state.busy) { return Promise.resolve(); }
  var mod = state.module, eid = state.entry;
  var name = (state.detail && state.detail.name) || eid;
  setBusy(true);
  return api("/api/pack/" + enc(state.pack) + "/entry/" + enc(mod) + "/" + enc(eid) + "/refs")
    .then(function (r) {
      var refs = (r && r.referrers) || [];
      var lines = refs.map(function (x) { return "· " + EditorEntry.referrerText(x); });
      var msg = "确定删除条目「" + name + "」（" + eid + "）吗？\n\n"
        + "删除不可撤销（内容包文件会被改写）；删除前会自动备份，"
        + "可用「回退到上一份备份」恢复。";
      if (refs.length) {
        msg += "\n\n注意：有 " + refs.length + " 个条目引用了它，删除后这些引用会指向"
          + "不存在的条目（黄提示、不拦截）：\n" + lines.slice(0, 10).join("\n")
          + (lines.length > 10 ? "\n… 其余 " + (lines.length - 10) + " 条见删除结果" : "");
      }
      if (!window.confirm(msg)) { return null; }
      return postJSON("/api/pack/" + enc(state.pack) + "/entry/" + enc(mod) + "/" + enc(eid)
        + "/delete", {});
    })
    .then(function (res) {
      if (!res) { return; }
      state.result = res;
      if (res.ok) {
        state.entry = null; state.detail = null;
        return refreshAfterMutation(null, res);
      }
      renderResult(res);
    }).catch(function (err) {
      state.result = { ok: false, message: "删除请求失败：" + err.message, errors: [] };
      renderResult(state.result);
    }).then(function () { setBusy(false); });
}

// ---------------------------------------------------------------------------
// 栏③：条目详情（字段由元数据生成；控件由后端 control 决定）
// ---------------------------------------------------------------------------
function selectEntry(id) {
  if (!canLeave()) { return; }
  discardDraft();
  state.result = null;
  state.entry = id;
  renderEntries();
  return reloadDetail();
}

function reloadDetail() {
  if (!state.pack || !state.module || !state.entry) { return Promise.resolve(); }
  return api("/api/pack/" + enc(state.pack) + "/entry/" + enc(state.module) + "/" + enc(state.entry))
    .then(function (data) {
      state.detail = data;
      state.fieldIndex = {};
      (data.fields || []).forEach(function (f) { state.fieldIndex[f.key] = f; });
      renderDetail(data);
      return refreshBackup();
    }).catch(function (err) { fail("读取条目", err); });
}

function refreshBackup() {
  if (!state.pack || !state.module) { return Promise.resolve(); }
  return api("/api/pack/" + enc(state.pack) + "/module/" + enc(state.module) + "/backup")
    .then(function (b) {
      state.backup = b;
      el("backup-note").textContent = b.exists
        ? ("备份：" + b.path + " · " + b.size + " 字节") : "备份：暂无（保存一次后生成）";
      refreshRollbackButton();
    }).catch(function () {
      // 备份状态失败不阻断编辑，但按钮必须回到禁用态（V4：不留上一模块的可用外观）。
      state.backup = null;
      refreshRollbackButton();
    });
}

// V4：回退按钮可用性唯一出口——无备份 / 只读 / 请求中 → 真禁用（tokens `.btn:disabled`）。
function refreshRollbackButton() {
  el("btn-rollback").disabled = rollbackDisabled(state.backup, state.editable, state.busy);
}

function renderDetail(d) {
  // 退出新建态：主表单草稿指针还原（新建草稿由 discardDraft 负责清空）
  state.newEntry = null; state.newDraft = null; state.newIdTouched = false;
  MAIN_CTX.isNew = false; MAIN_CTX.draft = draft;
  el("p-title").textContent = d.name;
  el("p-sub").textContent = (d.module_label || d.module) + " · 字段由元数据渲染";
  el("p-id").textContent = d.id;
  resetHelpCards();   // 说明卡注册表随渲染重建（字段行构建时注册 help id）
  syncMainCtx(d);
  state.forms = {};   // 关联分区各条目的草稿随条目详情重建（切换条目已有 canLeave 守卫）
  renderCtx = MAIN_CTX;

  // 批5.2（V5）：元数据横幅分段——主信息一行（字数/分组数/可编辑），来源路径收进
  // 右侧小字并挂 title（悬停可见全文），窄屏以省略号收尾而不是折成三行。
  var html = '<div class="meta"><span class="mk">元数据驱动</span>'
    + '<span class="mi">' + d.field_count + " 个字段</span>"
    + '<span class="mi">' + d.group_count + " 个分组</span>"
    + '<span class="mi">' + (state.editable ? "可编辑" : "只读预览") + "</span>"
    + '<span class="src" title="元数据来源：' + esc(d.meta_source) + '">'
    + esc(d.meta_source) + "</span></div>";
  html += '<div id="result" hidden></div>';

  var groupTabs = EditorGroups.view(d.groups || [], d.fields || []);
  var assoc = d.associations || [];
  // 页签 = 元数据声明的分组 + 元数据声明的关联分区（标签/说明都来自声明，框架不写死）
  var tabs = groupTabs.map(function (g, i) {
    return { kind: "group", idx: i, label: g.label, count: g.count, group: g };
  });
  assoc.forEach(function (a, ai) {
    tabs.push({ kind: "assoc", idx: ai, label: a.label, count: a.count, assoc: a });
  });
  state.tabs = tabs;

  if (!tabs.length) {
    el("p-body").innerHTML = html + '<div class="empty">该条目没有可渲染字段。</div>';
    helpHideDom();
    markDirty();
    return;
  }
  var tbar = '<div class="gtabs">';
  groupTabs.forEach(function (g, i) {
    tbar += '<button class="gtab' + (i === 0 ? " on" : "") + '" data-g="' + i
      + '" title="' + esc("分组键：" + g.name) + '">'
      + esc(g.label) + " <b>" + g.count + "</b></button>";
  });
  assoc.forEach(function (a, ai) {
    var i = groupTabs.length + ai;
    tbar += '<button class="gtab' + (i === 0 ? " on" : "") + '" data-g="' + i + '" title="'
      + esc(a.hint || a.label) + '">' + esc(a.label) + " <b>" + a.count + "</b></button>";
  });
  tbar += "</div>";
  html += tbar;

  groupTabs.forEach(function (g, i) {
    html += '<div class="gpane"' + (i === 0 ? "" : " hidden") + ' data-g="' + i + '">'
      + (g.empty
        ? '<div class="gempty">该分组暂无字段（元数据声明了此分组，本条目里没有字段落在其中）。</div>'
        : '<div class="rows2">' + g.fields.map(fieldRow).join("") + "</div>")
      + "</div>";
  });
  assoc.forEach(function (a, ai) {
    var gi = groupTabs.length + ai;
    html += '<div class="gpane"' + (gi === 0 ? "" : " hidden") + ' data-g="' + gi + '">'
      + assocPaneHtml(a) + "</div>";
  });

  el("p-body").innerHTML = html;
  el("p-body").dataset.fctx = "main";
  renderCtx = MAIN_CTX;
  bindTabs();
  bindControls();
  bindAssocSections();
  bindHelp();
  state.pendingDrafts = {};   // 已消费（registerForm 回填完毕）
  if (state.result) { renderResult(state.result); }
  markDirty();
}

// ---------------------------------------------------------------------------
// 关联分区（批5）：按元数据声明列出「引用本条目」的相关条目；声明可编辑时就地编辑。
// 每个相关条目 = 一个独立表单上下文（自己的草稿）；保存走该模块的校验 + 原子写链路。
// ---------------------------------------------------------------------------
function assocPaneHtml(a) {
  var html = '<div class="assoc">';
  if (a.hint) { html += '<div class="ac-hint">' + esc(a.hint) + "</div>"; }
  if (a.note) { html += '<div class="ex">' + esc(a.note) + "</div>"; }
  if (!a.entries || !a.entries.length) {
    html += '<div class="ex">（暂无相关条目：' + labeledKey(a.module_label, a.module)
      + " 里还没有条目的 " + labeledKey(a.field_label, a.field) + " 指向本条目（"
      + labeledKey(a.local_field_label, a.local_field) + "）。）</div></div>";
    return html;
  }
  a.entries.forEach(function (e) {
    var paths = (e.matches || []).map(function (m) { return m.path; }).join("、");
    if (!a.editable) {
      html += '<div class="assoc-card ro" data-amod="' + esc(a.module) + '" data-aentry="'
        + esc(e.id) + '"><div class="ac-head"><b>' + esc(e.name) + '</b>'
        + '<span class="id2">' + esc(e.id) + "</span>"
        + '<span class="ac-rel">命中：' + esc(paths) + "</span>"
        + '<button type="button" class="ajump" data-ajump="' + esc(a.module) + "|"
        + esc(e.id) + '">打开</button></div></div>';
      return;
    }
    var key = "assoc:" + a.key + ":" + e.id;
    var ctx = registerForm(key, a.module, e.id, e);
    var prev = renderCtx;
    renderCtx = ctx;
    html += '<section class="assoc-card" data-fctx="' + esc(key) + '" data-amod="' + esc(a.module)
      + '" data-aentry="' + esc(e.id) + '"><div class="ac-head"><b>' + esc(e.name) + "</b>"
      + '<span class="id2">' + esc(e.id) + "</span>"
      + '<span class="ac-rel">命中：' + esc(paths) + "</span></div>"
      + '<div class="ac-sub">来自模块 ' + labeledKey(a.module_label, a.module) + " · 保存写入 "
      + esc(a.module) + ".json（校验 + 原子写 + 备份）</div>"
      + '<div class="rows2">' + (e.fields || []).map(fieldRow).join("") + "</div>"
      + '<div class="ac-foot"><button type="button" class="asave" data-asave="' + esc(key) + '"'
      + (state.editable ? "" : " disabled") + ">保存这条</button>"
      + '<span class="ac-note">改动先进本条草稿，不落盘</span></div></section>';
    renderCtx = prev;
  });
  return html + "</div>";
}

function bindAssocSections() {
  Array.prototype.forEach.call(el("p-body").querySelectorAll(".ajump"), function (b) {
    b.addEventListener("click", function () {
      var parts = String(b.dataset.ajump).split("|");
      jumpTo(parts[0], parts[1]);
    });
  });
  Array.prototype.forEach.call(el("p-body").querySelectorAll(".asave"), function (b) {
    b.addEventListener("click", function () { saveForm(b.dataset.asave); });
  });
}

function jumpTo(mod, entry) {
  if (!canLeave()) { return; }
  discardDraft();
  state.result = null;
  // 从全局检索结果跳转：清掉跨模块查询，回到「当前模块」的中栏语义
  state.gquery = ""; if (el("gfilter")) { el("gfilter").value = ""; }
  state.module = mod; state.entry = null;
  renderModules();
  var pos = findModule(mod);
  el("list-title").textContent = pos ? pos.label : mod;
  return loadEntries().then(function () {
    if ((state.entries || []).some(function (e) { return e.id === entry; })) {
      return selectEntry(entry);
    }
  });
}

function bindTabs() {
  var tabs = state.tabs || [];
  Array.prototype.forEach.call(el("p-body").querySelectorAll(".gtab"), function (btn) {
    btn.addEventListener("click", function () {
      var idx = Number(btn.dataset.g);
      EditorGroups.switchGroup(tabs, idx);   // 纯视图索引：草稿（按字段键持有）不受影响
      Array.prototype.forEach.call(el("p-body").querySelectorAll(".gtab"), function (b) {
        b.classList.toggle("on", b === btn);
      });
      Array.prototype.forEach.call(el("p-body").querySelectorAll(".gpane"), function (p) {
        p.hidden = Number(p.dataset.g) !== idx;
      });
      helpHideDom();  // 切组后原字段可能不可见：关掉说明卡，避免悬空
      markDirty();  // 跨组编辑过的字段仍标脏、未保存计数不变
    });
  });
}

function fieldRow(f) {
  // 列表型控件（可增删行表格 / 引用列表）标记为跨列：宽字段独占整行，避免多列表格
  // 被挤在双列网格的右缘（批4 UX）。只按后端 control 判定，框架不认业务字段名。
  var wide = (f.control === "listtable" || f.control === "reflist"
    || f.control === "condition" || f.control === "maptable") ? " wide" : "";
  // 批5.2（V1）：行内提示不再常驻渲染（旧 `.hint` 撑高整行 → 纵向节奏忽松忽紧）。
  // `f.hint` 由后端并入说明卡；只读视图说明经 `view_note` 一并进卡。
  var note = (typeof state !== "undefined" && state.editable && f.editable === false)
    ? "本批只读展示（编辑见后续批次）" : "";
  var trig = note
    ? { label: f.label, key: f.key, help_card: f.help_card, view_note: note }
    : f;
  return '<div class="row' + wide + '" data-field="' + esc(f.key) + '" data-present="'
    + (f.present ? "true" : "false") + '"><div class="rlab">'
    + helpTriggerHtml(trig, fieldLabelHtml(f.label, f.key))
    + ' <span class="ftype">' + esc(typeZh(f.type)) + "</span></div>"
    + '<div class="rval">' + fieldBody(f) + "</div></div>";
}

function fieldBody(f) {
  // 只读渲染（非编辑控件 / 只读身份 / 本批只读形态）
  return state.editable && f.editable ? editControl(f) : readonlyValue(f);
}

function readonlyValue(f) {
  // 批5.2（V1）：只读说明不再以 `.hint` 常驻字段下方（见 fieldRow 的 view_note）。
  return fieldValue(f);
}

// ---------------------------------------------------------------------------
// 编辑控件（只按后端 control 渲染，不认字段类型）
// ---------------------------------------------------------------------------
function currentFieldValue(f) {
  var ctx = renderCtx || MAIN_CTX;
  return hasOwn(ctx.draft.changes, f.key) ? ctx.draft.changes[f.key] : f.value;
}

// 事件处理里按「上下文的草稿」取值（不能用 renderCtx：事件触发时渲染上下文已复位）
function ctxFieldValue(ctx, f) {
  var c = ctx || MAIN_CTX;
  return hasOwn(c.draft.changes, f.key) ? c.draft.changes[f.key] : f.value;
}

function editControl(f) {
  var v = currentFieldValue(f);
  switch (f.control) {
    case "textarea":
      return '<textarea class="cta" rows="4" data-key="' + esc(f.key)
        + '" placeholder="' + esc(INPUT_EMPTY) + '">'
        + esc(v == null ? "" : v) + "</textarea>";
    case "number":
      return '<input class="cin" type="number" step="' + esc(f.number_step || "any")
        + '" data-key="' + esc(f.key) + '" placeholder="' + esc(INPUT_EMPTY)
        + '" value="' + esc(v == null ? "" : v) + '">';
    case "bool":
      return '<label class="ctl-bool"><input type="checkbox" data-key="' + esc(f.key) + '"'
        + (v ? " checked" : "") + '> <span class="btxt">' + (v ? "是" : "否") + "</span></label>";
    case "select":
      return selectHtml(f.key, v, f.enum || [], "（未选择）", "");
    case "ref":
      return selectHtml(f.key, v, [], "（未选择）",
