<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>内容编辑器 · 批2 编辑与保存</title>
<link rel="stylesheet" href="/static/tokens.css">
<style>
/* 终端极简风（令牌全部来自 tokens.css；此处只写骨架与组件布局，零 CDN、零外链字体） */
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; height: 100%; }
body {
  font-family: var(--font-mono);
  font-size: var(--fs-12);
  line-height: var(--lh-tight);
  color: var(--text);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
}
.app { width: 100%; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

/* ---------- 顶栏：内容包选择器 + 保存状态 + 身份/权限开关 ---------- */
.topbar { height: var(--h-topbar); flex: 0 0 var(--h-topbar); display: flex; align-items: center;
  gap: var(--sp-7); padding: 0 var(--sp-8); border-bottom: var(--bw) solid var(--line-strong); }
.brand { color: var(--text-strong); font-weight: 700; letter-spacing: .04em; }
.brand .mark { color: var(--accent); }
.pkgsel, .rolesel { display: inline-flex; align-items: center; gap: var(--sp-3);
  border: var(--bw) solid var(--line-strong); padding: 2px var(--sp-4); }
.pkgsel .lb, .rolesel .lb { color: var(--text-4); }
.pkgsel select, .rolesel select { font-family: inherit; font-size: var(--fs-12); color: var(--accent);
  background: var(--bg); border: 0; outline: none; padding: 1px 2px; max-width: 280px; }
.pkgsel .from { color: var(--text-6); }
.saved { color: var(--accent); }
.saved::before { content: "["; color: var(--text-6); }
.saved::after { content: "]"; color: var(--text-6); }
.saved.dirty { color: var(--warn); }
.saved.err { color: var(--danger); }
.topright { margin-left: auto; display: flex; align-items: center; gap: var(--sp-6); color: var(--text-3); }
.who b { color: var(--text-value); font-weight: 700; }
.role { border: var(--bw) solid var(--accent); color: var(--accent); padding: 0 var(--sp-2); }
.role.ro { border-color: var(--warn); color: var(--warn); }

.body { flex: 1 1 auto; display: flex; min-height: 0; }

/* ---------- 三栏骨架：①模块分类 ②条目列表 ③大编辑面板 ---------- */
.col-mod { width: var(--w-mod); flex: 0 0 var(--w-mod); border-right: var(--bw) solid var(--line-strong);
  display: flex; flex-direction: column; min-height: 0; }
.col-list { width: var(--w-list); flex: 0 0 var(--w-list); border-right: var(--bw) solid var(--line-strong);
  display: flex; flex-direction: column; min-height: 0; }
.col-hd { height: var(--h-bar); flex: 0 0 var(--h-bar); display: flex; align-items: center;
  padding: 0 var(--sp-6); border-bottom: var(--bw) solid var(--line-soft);
  color: var(--text-5); letter-spacing: .08em; }
.col-hd .src { margin-left: auto; color: var(--text-6); font-size: var(--fs-10); letter-spacing: 0; }
.mods { flex: 1 1 auto; min-height: 0; overflow-y: auto; overflow-x: hidden; padding: var(--sp-2) 0; }
.mod { display: flex; align-items: center; gap: 2px; padding: var(--sp-2) var(--sp-6);
  color: var(--text-2); white-space: nowrap; cursor: pointer; }
.mod::before { content: "\00b7 "; color: var(--text-6); }
.mod.grp::before { content: "\25be "; color: var(--text-4); }
.mod.sub { padding-left: calc(var(--sp-6) + var(--ind-lv)); }
.mod.sub::before { content: "\2514 "; color: var(--text-6); }
.mod:hover { background: var(--surface-hover); }
.mod.on { background: var(--surface-sel); color: var(--text-strong); border-left: var(--bw) solid var(--accent); }
.mod.on::before { content: "> "; color: var(--accent); }
.mod.sub.on::before { content: "\2514 "; color: var(--accent); }
.mod .ct { margin-left: auto; color: var(--text-4); }
.mod.on .ct { color: var(--accent); }

.list-hd { height: var(--h-bar); flex: 0 0 var(--h-bar); display: flex; align-items: center;
  padding: 0 var(--sp-6); border-bottom: var(--bw) solid var(--line-soft); }
.list-title { color: var(--text-strong); font-weight: 700; }
.list-count { margin-left: var(--sp-5); color: var(--text-5); font-size: var(--fs-11); font-weight: 400; }
.list-tools { display: flex; align-items: center; padding: var(--sp-3) var(--sp-6); border-bottom: var(--bw) solid var(--line-soft); }
.search { display: flex; align-items: center; border: var(--bw) solid var(--line-strong); padding: 2px var(--sp-4); width: 100%; }
.search input { border: 0; background: transparent; outline: none; color: var(--text-value);
  font-family: inherit; font-size: var(--fs-12); width: 100%; }
.rows { flex: 1 1 auto; min-height: 0; overflow-y: auto; overflow-x: hidden; padding: var(--sp-2) 0; }
.item { display: block; padding: var(--sp-3) var(--sp-6); color: var(--text-2); white-space: nowrap;
  overflow: hidden; text-overflow: ellipsis; cursor: pointer; }
.item::before { content: "\00b7 "; color: var(--text-6); }
.item:hover { background: var(--surface-hover); }
.item.on { background: var(--surface-sel); color: var(--text-strong); border-left: var(--bw) solid var(--accent); }
.item.on::before { content: "> "; color: var(--accent); }
.item.dirty::after { content: " *"; color: var(--warn); }
.list-ft { margin-top: auto; padding: var(--sp-4) var(--sp-6); border-top: var(--bw) solid var(--line-strong);
  color: var(--text-4); display: flex; align-items: center; gap: var(--sp-5); }
.sp { margin-left: auto; }

/* ---------- 细滚动条：6px、低对比、悬停略亮 ---------- */
.mods::-webkit-scrollbar, .rows::-webkit-scrollbar, .panel-body::-webkit-scrollbar { width: var(--sb-size); height: var(--sb-size); }
.mods::-webkit-scrollbar-track, .rows::-webkit-scrollbar-track, .panel-body::-webkit-scrollbar-track { background: transparent; }
.mods::-webkit-scrollbar-thumb, .rows::-webkit-scrollbar-thumb, .panel-body::-webkit-scrollbar-thumb { background: var(--sb-thumb); border-radius: var(--radius-sb); }
.mods::-webkit-scrollbar-thumb:hover, .rows::-webkit-scrollbar-thumb:hover, .panel-body::-webkit-scrollbar-thumb:hover { background: var(--sb-thumb-hover); }

/* ---------- 大编辑面板（占其余全部宽度） ---------- */
.panel { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; min-height: 0; }
.panel-hd { flex: 0 0 auto; padding: var(--sp-5) var(--sp-8); border-bottom: var(--bw) solid var(--line-soft);
  display: flex; align-items: center; gap: var(--sp-6); }
.panel-title { color: var(--text-strong); font-weight: 700; }
.panel-title::before { content: "> "; color: var(--accent); }
.panel-sub { color: var(--text-4); }
.panel-id { margin-left: auto; color: var(--text-4); }
.toolbar { flex: 0 0 auto; display: flex; align-items: center; gap: var(--sp-5); flex-wrap: wrap;
  padding: var(--sp-4) var(--sp-8); border-bottom: var(--bw) solid var(--line-soft); color: var(--text-4); }
.panel-body { flex: 1 1 auto; min-height: 0; overflow-y: auto; overflow-x: hidden; padding: var(--sp-6) var(--sp-8); }
.panel-ft { flex: 0 0 auto; display: flex; align-items: center; gap: var(--sp-5);
  padding: var(--sp-5) var(--sp-8); border-top: var(--bw) solid var(--line-strong); color: var(--text-5); }

.btn { font-family: inherit; font-size: var(--fs-12); cursor: pointer; color: var(--text-btn);
  background: transparent; border: var(--bw) solid var(--line-strong); padding: 2px var(--sp-6); }
.btn:hover { border-color: var(--accent); color: var(--accent); }
.btn.primary { border-color: var(--accent); color: var(--accent); }
.btn.danger:hover { border-color: var(--danger); color: var(--danger); }
.btn:disabled { color: var(--text-disabled); border-color: var(--line); cursor: not-allowed; }
.btn:disabled:hover { color: var(--text-disabled); border-color: var(--line); }
.tbnote { color: var(--text-5); font-size: var(--fs-11); }

.meta { display: flex; align-items: center; gap: var(--sp-5); margin: 0 0 var(--sp-6);
  padding: var(--sp-3) var(--sp-5); border: var(--bw) solid var(--line); border-left: var(--bw-accent) solid var(--accent);
  color: var(--text-2); }
.meta .mk { color: var(--accent); }
.meta .mk::before { content: "["; color: var(--text-5); }
.meta .mk::after { content: "]"; color: var(--text-5); }
.meta .src { margin-left: auto; color: var(--text-4); }

/* 校验结果（红拦/黄提示；人话：哪一项 / 为什么 / 怎么改） */
.vbox { margin: 0 0 var(--sp-6); border: var(--bw) solid var(--line);
  border-left: var(--bw-accent) solid var(--ok); padding: var(--sp-4) var(--sp-5); }
.vbox.red { border-left-color: var(--danger); }
.vbox.warn { border-left-color: var(--warn); }
.vhead { color: var(--text-strong); margin-bottom: var(--sp-3); }
.vbox.red .vhead { color: var(--danger); }
.vbox.warn .vhead { color: var(--warn); }
.vrow { color: var(--text-2); padding: var(--sp-2) 0; border-top: var(--bw) solid var(--line-faint);
  line-height: var(--lh-ex); white-space: pre-wrap; overflow-wrap: anywhere; }
.vrow b { color: var(--danger); font-weight: 700; }
.vrow.yellow b { color: var(--warn); }
.vrow .vfix { color: var(--text-5); display: block; }

.gtabs { display: flex; align-items: center; gap: var(--sp-3); margin: 0 0 var(--sp-6);
  padding-bottom: var(--sp-4); border-bottom: var(--bw) solid var(--line-soft); flex-wrap: wrap; }
.gtab { font-family: inherit; font-size: var(--fs-12); cursor: pointer; color: var(--text-3);
  border: var(--bw) solid var(--line); background: transparent; padding: 2px var(--sp-5); }
.gtab b { margin-left: var(--sp-2); color: var(--text-5); font-weight: 400; }
.gtab.on { color: var(--accent); border-color: var(--accent); }
.gtab.on b { color: var(--accent); }

.rows2 { display: grid; grid-template-columns: 1fr 1fr; column-gap: var(--sp-11); }
.row { display: grid; grid-template-columns: 132px 1fr; gap: var(--sp-5); align-items: start;
  padding: var(--sp-4) 0; border-bottom: var(--bw) solid var(--line-faint); min-width: 0; }
.row > .rlab { color: var(--text-4); display: flex; align-items: center; gap: var(--sp-3); flex-wrap: wrap; }
.row > .rlab::before { content: "> "; color: var(--line-mute); }
.row.dirty > .rlab { color: var(--warn); }
.row.dirty > .rlab::after { content: " ● 已改动"; color: var(--warn); font-size: var(--fs-10); }
.ftype { color: var(--accent-dim); }
.ftype::before { content: "<"; color: var(--text-6); }
.ftype::after { content: ">"; color: var(--text-6); }
.rval { min-width: 0; }
.inp { color: var(--text-value); white-space: pre-wrap; overflow-wrap: anywhere; }
.inp.mono { color: var(--accent); white-space: pre-wrap; overflow-wrap: anywhere; }
.inp.bool { display: flex; align-items: center; gap: var(--sp-3); color: var(--text-value); }
.box { display: inline-block; width: 11px; height: 11px; border: var(--bw) solid var(--line-strong); }
.box.on { border-color: var(--accent); background: var(--accent); }
.ta { width: 100%; border: var(--bw) solid var(--line); background: transparent; color: var(--text);
  font-family: inherit; font-size: var(--fs-12); line-height: var(--lh-text); padding: var(--sp-4) var(--sp-5);
  white-space: pre-wrap; overflow-wrap: anywhere; }
.hint { color: var(--text-5); font-size: var(--fs-11); margin-top: var(--sp-2); }
.ex { color: var(--text-5); }
.ro { color: var(--text-5); font-size: var(--fs-10); }
.nest { border-bottom: 0; padding: var(--sp-2) 0; grid-template-columns: 110px 1fr; }

/* 编辑控件（终端极简风：直角、细边、聚焦亮线） */
.cin, .cta { width: 100%; background: transparent; color: var(--text-value);
  font-family: inherit; font-size: var(--fs-12); border: var(--bw) solid var(--line);
  padding: 2px var(--sp-4); outline: none; }
.cta { line-height: var(--lh-text); padding: var(--sp-4) var(--sp-5); resize: vertical; }
.cin:focus, .cta:focus { border-color: var(--focus); box-shadow: 0 0 0 var(--focus-offset) var(--focus); }
select.cin { padding: 1px var(--sp-2); }
.ctl-bool { display: inline-flex; align-items: center; gap: var(--sp-3); cursor: pointer; color: var(--text-value); }
.ctl-bool input { accent-color: var(--accent); width: 13px; height: 13px; }

.ltable { width: 100%; border-collapse: collapse; table-layout: fixed; }
.ltable th { text-align: left; font-weight: 400; color: var(--text-3); border: var(--bw) solid var(--line);
  background: var(--surface-th); padding: var(--sp-3) var(--sp-4); white-space: nowrap; overflow: hidden; }
.ltable th .ftype { margin-left: var(--sp-2); }
.ltable td { border: var(--bw) solid var(--line-soft); padding: var(--sp-3) var(--sp-4); color: var(--text);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ltable tr:nth-child(even) td { background: var(--surface-zebra); }
.lmeta { color: var(--text-4); font-size: var(--fs-11); margin: var(--sp-2) 0; }
.empty { color: var(--text-5); padding: var(--sp-10) var(--sp-8); line-height: var(--lh-ex); }
.vtag { flex: 0 0 auto; height: var(--h-ctl-sm); display: flex; align-items: center;
  padding: 0 var(--sp-8); color: var(--text-5); border-top: var(--bw) solid var(--line-soft); }
</style>
</head>
<body>
<div class="app">

  <header class="topbar">
    <span class="brand"><span class="mark">▚</span> 内容编辑器 :: 编辑与保存</span>
    <label class="pkgsel">
      <span class="lb">pkg=</span>
      <select id="packs" aria-label="内容包选择器"></select>
      <span class="from">manifest.json</span>
    </label>
    <span class="saved" id="dirty">已保存</span>
    <div class="topright">
      <label class="rolesel">
        <span class="lb">身份=</span>
        <select id="role" aria-label="权限位切换"></select>
      </label>
      <span class="role" id="roleTag">可编辑</span>
    </div>
  </header>

  <div class="body">

    <!-- 栏①：模块分类栏（模块与层级来自 manifest 声明；父子缩进表达） -->
    <aside class="col-mod">
      <div class="col-hd">模块<span class="src" id="mod-src">manifest.modules</span></div>
      <nav class="mods" id="mods"></nav>
    </aside>

    <!-- 栏②：条目列表栏（只名字 · 细滚动条 · 无翻页器） -->
    <aside class="col-list">
      <div class="list-hd">
        <span class="list-title" id="list-title">条目</span>
        <span class="list-count" id="list-count"></span>
      </div>
      <div class="list-tools">
        <div class="search"><input id="filter" placeholder="过滤当前列表（本地）" aria-label="过滤当前列表"></div>
      </div>
      <div class="rows" id="rows"></div>
      <div class="list-ft"><span>无翻页 · 滚动查看</span><span class="sp" id="list-ft">共 0 条</span></div>
    </aside>

    <!-- 栏③：大编辑面板（占其余全部宽度；批2 可编辑 + 草稿态 + 校验/保存/回退） -->
    <section class="panel">
      <div class="panel-hd">
        <span class="panel-title" id="p-title">未选择条目</span>
        <span class="panel-sub" id="p-sub"></span>
        <span class="panel-id" id="p-id"></span>
      </div>
      <div class="toolbar" id="toolbar">
        <button class="btn" id="btn-validate" disabled>校验</button>
        <button class="btn primary" id="btn-save" disabled>保存</button>
        <button class="btn" id="btn-cancel" disabled>取消</button>
        <span class="sp"></span>
        <span class="tbnote" id="backup-note">备份：—</span>
        <button class="btn danger" id="btn-rollback" disabled>回退到上一份备份</button>
      </div>
      <div class="panel-body" id="p-body">
        <div class="empty">从左侧选择模块与条目。字段按内容包元数据渲染；改动先进草稿，保存时才校验并落盘。</div>
      </div>
      <div class="panel-ft"><span>批2 · 编辑与保存（写前校验 + 自动备份 + 原子落盘 + 回退）</span></div>
    </section>

  </div>

  <div class="vtag" id="vtag">终端极简风 · 元数据驱动 · 零 CDN</div>
</div>

<script>
"use strict";

/* 草稿态纯逻辑（无 DOM 依赖；浏览器挂在 globalThis.EditorDraft，node 下走 module.exports）。
 * 语义：改动先进草稿 → 与「原值」相同的改动自动撤销（未保存计数据此归零）→ 保存/取消清空。 */
/* EDITOR_DRAFT_BEGIN */
(function (root, factory) {
  if (typeof module === "object" && module.exports) { module.exports = factory(); }
  else { root.EditorDraft = factory(); }
})(typeof globalThis !== "undefined" ? globalThis : this, function () {
  function deepSame(a, b) {
    if (a === b) { return true; }
    if (typeof a !== typeof b) { return false; }
    if (a && b && typeof a === "object") { return JSON.stringify(a) === JSON.stringify(b); }
    return false;
  }
  function newDraft() { return { changes: {} }; }
  function set(draft, key, value, baseValue) {
    if (deepSame(value, baseValue)) { delete draft.changes[key]; }
    else { draft.changes[key] = value; }
    return draft;
  }
  function count(draft) { return Object.keys(draft.changes).length; }
  function dirty(draft) { return count(draft) > 0; }
  function keys(draft) { return Object.keys(draft.changes); }
  function patch(draft) {
    var out = {};
    Object.keys(draft.changes).forEach(function (k) { out[k] = draft.changes[k]; });
    return out;
  }
  function discard(draft) { draft.changes = {}; return draft; }
  return { newDraft: newDraft, set: set, count: count, dirty: dirty, keys: keys,
           patch: patch, discard: discard, deepSame: deepSame };
});
/* EDITOR_DRAFT_END */

// ---------------------------------------------------------------------------
// 类型显示名（框架级映射，与内容包无关）：FieldMeta.type → 中文
// ---------------------------------------------------------------------------
var TYPE_ZH = {
  str: "文本", text: "文本", int: "数字", float: "数字", number: "数字",
  bool: "布尔", enum: "枚举", ref: "引用", list: "列表", obj: "对象",
  map: "映射", formula: "公式"
};

var state = {
  pack: null, modules: [], module: null, entries: [], entry: null, detail: null,
  filter: "", role: "owner", editable: true, backup: null, fieldIndex: {},
  refCache: {}, busy: false
};
var draft = EditorDraft.newDraft();

function esc(v) {
  return String(v == null ? "" : v)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}
function enc(v) { return encodeURIComponent(v); }
function typeZh(t) { return TYPE_ZH[t] || t || "文本"; }
function el(id) { return document.getElementById(id); }

function api(path) {
  return fetch(path, { headers: { "Accept": "application/json" } }).then(function (r) {
    return r.json().then(function (data) {
      if (!r.ok) { throw new Error((data && data.error) || ("HTTP " + r.status)); }
      return data;
    });
  });
}
function postJSON(path, body) {
  return fetch(path, {
    method: "POST",
    headers: { "Content-Type": "application/json", "Accept": "application/json" },
    body: JSON.stringify(body || {})
  }).then(function (r) {
    return r.json().then(function (data) {
      if (!r.ok) { throw new Error((data && data.error) || ("HTTP " + r.status)); }
      return data;
    });
  });
}
function fail(where, err) {
  el("p-body").innerHTML = '<div class="empty">' + esc(where + " 失败：" + err.message) + "</div>";
}

// ---------------------------------------------------------------------------
// 草稿态：未保存计数 / 取消 / 离开守卫（不静默丢失）
// ---------------------------------------------------------------------------
function draftCount() { return EditorDraft.count(draft); }

function markDirty() {
  var n = draftCount();
  var tag = el("dirty");
  tag.textContent = n ? ("未保存改动 " + n + " 项") : "已保存";
  tag.className = "saved" + (n ? " dirty" : "");
  var has = n > 0;
  el("btn-save").disabled = !has || !state.editable || state.busy;
  el("btn-cancel").disabled = !has || state.busy;
  el("btn-validate").disabled = !has || state.busy;
  Array.prototype.forEach.call(document.querySelectorAll(".row[data-field]"), function (row) {
    row.classList.toggle("dirty", Object.prototype.hasOwnProperty.call(draft.changes, row.dataset.field));
  });
}

function discardDraft() { EditorDraft.discard(draft); markDirty(); }

function canLeave() {
  if (!EditorDraft.dirty(draft)) { return true; }
  return window.confirm("当前条目有 " + draftCount() + " 项未保存改动；离开将丢弃这些改动。确定离开吗？");
}

// ---------------------------------------------------------------------------
// 权限位：机主可编辑 / GM 只读预览
// ---------------------------------------------------------------------------
function loadSession() {
  return api("/api/session").then(function (s) {
    state.role = s.role; state.editable = !!s.editable;
    var sel = el("role");
    sel.innerHTML = "";
    (s.roles || []).forEach(function (r) {
      var o = document.createElement("option");
      o.value = r.value; o.textContent = r.label;
      sel.appendChild(o);
    });
    sel.value = state.role;
    renderRoleTag();
  });
}

function renderRoleTag() {
  var tag = el("roleTag");
  tag.textContent = state.editable ? "可编辑" : "只读预览";
  tag.className = "role" + (state.editable ? "" : " ro");
  markDirty();
}

function switchRole(role) {
  return postJSON("/api/session/role", { role: role }).then(function (s) {
    state.role = s.role; state.editable = !!s.editable;
    renderRoleTag();
    return reloadDetail();  // 只读/可编辑切换后重画控件
  });
}

// ---------------------------------------------------------------------------
// 内容包选择器
// ---------------------------------------------------------------------------
function loadPacks() {
  return api("/api/packs").then(function (data) {
    var sel = el("packs");
    sel.innerHTML = "";
    (data.packs || []).forEach(function (p) {
      var o = document.createElement("option");
      o.value = p.id;
      o.textContent = p.name + "  (" + p.id + " · " + p.module_count + " 模块)";
      sel.appendChild(o);
    });
    state.pack = data.default || (data.packs[0] && data.packs[0].id) || null;
    if (state.pack) { sel.value = state.pack; }
    sel.addEventListener("change", function () {
      if (!canLeave()) { sel.value = state.pack; return; }
      discardDraft();
      state.pack = sel.value; state.module = null; state.entry = null; state.refCache = {};
      loadModules();
    });
  });
}

// ---------------------------------------------------------------------------
// 栏①：模块分类（层级来自包元数据；item.children 递归渲染）
// ---------------------------------------------------------------------------
function renderModules() {
  var nav = el("mods");
  nav.innerHTML = "";
  function node(n, depth) {
    var d = document.createElement("div");
    d.className = "mod" + (n.children && n.children.length ? " grp" : "") + (depth > 0 ? " sub" : "")
      + (n.module === state.module ? " on" : "");
    d.dataset.module = n.module;
    d.innerHTML = esc(n.label) + '<span class="ct">' + esc(n.count) + "</span>";
    d.addEventListener("click", function () { selectModule(n.module); });
    nav.appendChild(d);
    (n.children || []).forEach(function (c) { node(c, depth + 1); });
  }
  (state.modules || []).forEach(function (m) { node(m, 0); });
}

function loadModules() {
  if (!state.pack) { return Promise.resolve(); }
  return api("/api/pack/" + enc(state.pack) + "/modules").then(function (data) {
    state.modules = data.modules || [];
    var flat = data.flat ? "平铺" : "层级声明";
    el("mod-src").textContent = "manifest.modules · " + state.modules.length + " · " + flat;
    var first = state.modules[0];
    if (!state.module && first) { selectModule(first.module); } else { renderModules(); }
  });
}

// ---------------------------------------------------------------------------
// 栏②：条目列表（只名字；无翻页）
// ---------------------------------------------------------------------------
function selectModule(mod) {
  if (!canLeave()) { return; }
  discardDraft();
  state.result = null;
  state.module = mod; state.entry = null; state.filter = ""; el("filter").value = "";
  renderModules();
  var pos = findModule(mod);
  el("list-title").textContent = pos ? pos.label : mod;
  return loadEntries();
}

function findModule(mod) {
  var found = null;
  (function walk(list) {
    (list || []).forEach(function (n) {
      if (n.module === mod) { found = n; }
      if (n.children) { walk(n.children); }
    });
  })(state.modules);
  return found;
}

function loadEntries() {
  if (!state.pack || !state.module) { return Promise.resolve(); }
  return api("/api/pack/" + enc(state.pack) + "/module/" + enc(state.module) + "/entries")
    .then(function (data) {
      state.entries = data.entries || [];
      el("list-count").textContent = state.entries.length + " 条";
      renderEntries();
      if (state.entries.length) { selectEntry(state.entries[0].id); }
      else {
        el("p-body").innerHTML = '<div class="empty">该模块暂无条目（条目列表为空）。</div>';
        el("p-title").textContent = "（空）"; el("p-sub").textContent = ""; el("p-id").textContent = "";
      }
    });
}

function renderEntries() {
  var box = el("rows");
  box.innerHTML = "";
  var q = state.filter.toLowerCase();
  var shown = state.entries.filter(function (e) { return !q || e.name.toLowerCase().indexOf(q) >= 0; });
  shown.forEach(function (e) {
    var d = document.createElement("div");
    d.className = "item" + (e.id === state.entry ? " on" : "");
    d.textContent = e.name;
    d.title = e.name + "  [" + e.id + "]";
    d.addEventListener("click", function () { selectEntry(e.id); });
    box.appendChild(d);
  });
  el("list-ft").textContent = "共 " + shown.length + " 条"
    + (shown.length !== state.entries.length ? "（已过滤 / 全部 " + state.entries.length + "）" : "");
}

// ---------------------------------------------------------------------------
// 栏③：条目详情（字段由元数据生成；控件由后端 control 决定）
// ---------------------------------------------------------------------------
function selectEntry(id) {
  if (!canLeave()) { return; }
  discardDraft();
  state.result = null;
  state.entry = id;
  renderEntries();
  return reloadDetail();
}

function reloadDetail() {
  if (!state.pack || !state.module || !state.entry) { return Promise.resolve(); }
  return api("/api/pack/" + enc(state.pack) + "/entry/" + enc(state.module) + "/" + enc(state.entry))
    .then(function (data) {
      state.detail = data;
      state.fieldIndex = {};
      (data.fields || []).forEach(function (f) { state.fieldIndex[f.key] = f; });
      renderDetail(data);
      return refreshBackup();
    }).catch(function (err) { fail("读取条目", err); });
}

function refreshBackup() {
  if (!state.pack || !state.module) { return Promise.resolve(); }
  return api("/api/pack/" + enc(state.pack) + "/module/" + enc(state.module) + "/backup")
    .then(function (b) {
      state.backup = b;
      el("backup-note").textContent = b.exists
        ? ("备份：" + b.path + " · " + b.size + " 字节") : "备份：暂无（保存一次后生成）";
      el("btn-rollback").disabled = !b.exists || !state.editable || state.busy;
    }).catch(function () { /* 备份状态失败不阻断编辑 */ });
}

function renderDetail(d) {
  el("p-title").textContent = d.name;
  el("p-sub").textContent = (d.module_label || d.module) + " · 字段由元数据渲染";
  el("p-id").textContent = d.id;

  var html = '<div class="meta"><span class="mk">元数据驱动</span>'
    + "本页字段由内容包元数据生成 · " + d.field_count + " 个字段 · " + d.group_count + " 个分组"
    + (state.editable ? " · 可编辑" : " · 只读预览")
    + '<span class="src">' + esc(d.meta_source) + "</span></div>";
  html += '<div id="result" hidden></div>';

  var groups = d.groups || [];
  if (!groups.length) {
    el("p-body").innerHTML = html + '<div class="empty">该条目没有可渲染字段。</div>';
    markDirty();
    return;
  }
  var byGroup = {};
  (d.fields || []).forEach(function (f) {
    (byGroup[f.group] = byGroup[f.group] || []).push(f);
  });
  var tabs = '<div class="gtabs">';
  groups.forEach(function (g, i) {
    tabs += '<button class="gtab' + (i === 0 ? " on" : "") + '" data-g="' + i + '">'
      + esc(g.name) + " <b>" + g.count + "</b></button>";
  });
  tabs += "</div>";
  html += tabs;
  groups.forEach(function (g, i) {
    var fields = byGroup[g.name] || [];
    html += '<div class="gpane"' + (i === 0 ? "" : " hidden") + ' data-g="' + i + '">'
      + '<div class="rows2">' + fields.map(fieldRow).join("") + "</div></div>";
  });
  el("p-body").innerHTML = html;
  bindTabs();
  bindControls();
  if (state.result) { renderResult(state.result); }
  markDirty();
}

function bindTabs() {
  Array.prototype.forEach.call(el("p-body").querySelectorAll(".gtab"), function (btn) {
    btn.addEventListener("click", function () {
      var idx = btn.dataset.g;
      Array.prototype.forEach.call(el("p-body").querySelectorAll(".gtab"), function (b) {
        b.classList.toggle("on", b === btn);
      });
      Array.prototype.forEach.call(el("p-body").querySelectorAll(".gpane"), function (p) {
        p.hidden = p.dataset.g !== idx;
      });
    });
  });
}

function fieldRow(f) {
  return '<div class="row" data-field="' + esc(f.key) + '"><div class="rlab">' + esc(f.label)
    + ' <span class="ftype">' + esc(typeZh(f.type)) + "</span></div>"
    + '<div class="rval">' + fieldBody(f) + fieldHint(f) + "</div></div>";
}

function hintBits(f) {
  var bits = [];
  if (f.hint) { bits.push(esc(f.hint)); }
  if (!f.present) { bits.push("（该条目未写此字段）"); }
  return bits;
}

function fieldHint(f) {
  var bits = hintBits(f);
  return bits.length ? '<div class="hint">' + bits.join(" · ") + "</div>" : "";
}

function fieldBody(f) {
  // 只读渲染（非编辑控件 / 只读身份 / 本批只读形态）
  return state.editable && f.editable ? editControl(f) : readonlyValue(f);
}

function readonlyValue(f) {
  var html = fieldValue(f);
  if (!state.editable) { return html; }
  if (!f.editable) { return html + '<div class="hint"><span class="ro">本批只读展示（编辑见后续批次）</span></div>'; }
  return html;
}

// ---------------------------------------------------------------------------
// 编辑控件（只按后端 control 渲染，不认字段类型）
// ---------------------------------------------------------------------------
function editControl(f) {
  var v = f.value;
  switch (f.control) {
    case "textarea":
      return '<textarea class="cta" rows="4" data-key="' + esc(f.key) + '">'
        + esc(v == null ? "" : v) + "</textarea>";
    case "number":
      return '<input class="cin" type="number" step="' + esc(f.number_step || "any")
        + '" data-key="' + esc(f.key) + '" value="' + esc(v == null ? "" : v) + '">';
    case "bool":
      return '<label class="ctl-bool"><input type="checkbox" data-key="' + esc(f.key) + '"'
        + (v ? " checked" : "") + '> <span class="btxt">' + (v ? "是" : "否") + "</span></label>";
    case "select":
      return selectHtml(f, f.enum || [], "（未选择）");
    case "ref":
      return '<select class="cin" data-key="' + esc(f.key) + '" data-ref="' + esc(f.ref_target || "")
        + '"><option value="">（未选择）</option></select>';
    case "text":
    default:
      return '<input class="cin" type="text" data-key="' + esc(f.key) + '" value="'
        + esc(v == null ? "" : v) + '">';
  }
}

function selectHtml(f, options, placeholder) {
  var cur = f.value == null ? "" : String(f.value);
  var has = options.some(function (o) { return String(o.id) === cur; });
  var html = '<select class="cin" data-key="' + esc(f.key) + '"><option value="">'
    + esc(placeholder) + "</option>";
  if (cur && !has) {
    html += '<option value="' + esc(cur) + '">' + esc(cur) + "（当前值·不在候选内）</option>";
  }
  options.forEach(function (o) {
    html += '<option value="' + esc(o.id) + '">' + esc(o.name) + "（" + esc(o.id) + "）</option>";
  });
  return html + "</select>";
}

function bindControls() {
  var body = el("p-body");
  Array.prototype.forEach.call(body.querySelectorAll("[data-key]"), function (inp) {
    var key = inp.dataset.key;
    var f = state.fieldIndex[key];
    if (!f) { return; }
    var ev = (inp.type === "checkbox" || inp.tagName === "SELECT") ? "change" : "input";
    inp.addEventListener(ev, function () {
      var val = readControl(inp, f);
      EditorDraft.set(draft, key, val, f.value);
      if (inp.type === "checkbox") {
        var t = inp.parentNode.querySelector(".btxt");
        if (t) { t.textContent = inp.checked ? "是" : "否"; }
      }
      markDirty();
    });
  });
  // 引用字段：异步填候选（显示名称 + 标识；当前值不在候选内也保留）
  var byTarget = {};
  Array.prototype.forEach.call(body.querySelectorAll("select[data-ref]"), function (sel) {
    var t = sel.dataset.ref;
    if (!t) { return; }
    (byTarget[t] = byTarget[t] || []).push(sel);
  });
  Object.keys(byTarget).forEach(function (target) {
    loadRefOptions(target).then(function (opts) {
      byTarget[target].forEach(function (sel) {
        var cur = sel.value;
        sel.innerHTML = selectHtml({ value: cur, key: sel.dataset.key }, opts, "（未选择）")
          .replace(/^<select[^>]*>/, "").replace(/<\/select>$/, "");
      });
    }).catch(function () { /* 候选拉取失败：保留仅当前值，不阻断编辑 */ });
  });
}

function loadRefOptions(target) {
  if (state.refCache[target]) { return Promise.resolve(state.refCache[target]); }
  return api("/api/pack/" + enc(state.pack) + "/refs/" + enc(target)).then(function (d) {
    state.refCache[target] = d.options || [];
    return state.refCache[target];
  });
}

function readControl(inp, f) {
  if (inp.type === "checkbox") { return !!inp.checked; }
  if (inp.tagName === "SELECT") { return inp.value === "" ? null : inp.value; }
  if (f.control === "number") {
    if (inp.value === "") { return null; }
    var n = Number(inp.value);
    return isNaN(n) ? inp.value : n;
  }
  return inp.value;
}

// ---------------------------------------------------------------------------
// 校验 / 保存 / 取消 / 回退
// ---------------------------------------------------------------------------
function entryURL(suffix) {
  return "/api/pack/" + enc(state.pack) + "/entry/" + enc(state.module) + "/" + enc(state.entry) + suffix;
}

function setBusy(on) {
  state.busy = !!on;
  markDirty();
  el("btn-rollback").disabled = state.busy || !(state.backup && state.backup.exists && state.editable);
}

function runValidate() {
  var p = EditorDraft.patch(draft);
  if (!Object.keys(p).length) { return Promise.resolve(); }
  setBusy(true);
  return postJSON(entryURL("/validate"), { patch: p }).then(function (res) {
    state.result = res; renderResult(res);
  }).catch(function (err) {
    state.result = { ok: false, message: "校验请求失败：" + err.message, errors: [] };
    renderResult(state.result);
  }).then(function () { setBusy(false); });
}

function runSave() {
  var p = EditorDraft.patch(draft);
  if (!Object.keys(p).length) { return Promise.resolve(); }
  setBusy(true);
  return postJSON(entryURL("/save"), { patch: p }).then(function (res) {
    state.result = res; renderResult(res);
    if (res.ok) { discardDraft(); return reloadDetail(); }
  }).catch(function (err) {
    state.result = { ok: false, message: "保存请求失败：" + err.message, errors: [] };
    renderResult(state.result);
  }).then(function () { setBusy(false); });
}

function runRollback() {
  if (!state.backup || !state.backup.exists) { return Promise.resolve(); }
  if (!window.confirm("确定回退到上一份备份吗？当前文件内容会被备份覆盖。")) { return Promise.resolve(); }
  setBusy(true);
  return postJSON("/api/pack/" + enc(state.pack) + "/module/" + enc(state.module) + "/rollback", {})
    .then(function (res) {
      state.result = res; renderResult(res);
      if (res.ok) { discardDraft(); return reloadDetail(); }
    }).catch(function (err) {
      state.result = { ok: false, message: "回退请求失败：" + err.message, errors: [] };
      renderResult(state.result);
    }).then(function () { setBusy(false); });
}

function renderResult(res) {
  var box = el("result");
  if (!box) { return; }
  if (!res) { box.hidden = true; box.innerHTML = ""; return; }
  var reds = res.errors || [];
  var yellows = res.warnings || [];
  var cls = (reds.length || !res.ok) ? "red" : (yellows.length ? "warn" : "");
  var html = '<div class="vbox ' + cls + '"><div class="vhead">'
    + esc(res.message || (res.ok ? "完成。" : "未通过。")) + "</div>";
  reds.forEach(function (e) { html += vrow(e, "red"); });
  yellows.forEach(function (e) { html += vrow(e, "yellow"); });
  box.innerHTML = html + "</div>";
  box.hidden = false;
}

function vrow(e, cls) {
  var where = [e.module, e.entry_id, e.field_label].filter(function (x) { return !!x; }).join(" · ");
  return '<div class="vrow ' + cls + '"><b>[' + (cls === "red" ? "红拦" : "黄提示") + "]</b> "
    + esc(where) + "：" + esc(e.message || e.code || "")
    + (e.how_to_fix ? '<span class="vfix">怎么改：' + esc(e.how_to_fix) + "</span>" : "")
    + "</div>";
}

// ---------------------------------------------------------------------------
// 只读渲染（列表/对象/映射本批只读；沿用批1 形态）
// ---------------------------------------------------------------------------
function fieldValue(f) {
  switch (f.widget) {
    case "bool":
      return '<div class="inp bool"><span class="box' + (f.value ? " on" : "") + '"></span>'
        + (f.value ? "是" : "否") + "</div>";
    case "number":
    case "formula":
    case "ref":
      return '<div class="inp mono">' + esc(f.display || "（空）") + "</div>";
    case "enum":
      return '<div class="inp">' + esc(f.display || "（空）") + "</div>";
    case "list":
      return listTable(f);
    case "map":
      return kvTable(f);
    case "obj":
      return objTable(f);
    case "text":
    default:
      return textValue(f);
  }
}

function textValue(f) {
  var v = f.display == null ? "" : f.display;
  if (String(v).length > 80 || String(v).indexOf("\n") >= 0) {
    return '<div class="ta">' + esc(v || "（空）") + "</div>";
  }
  return '<div class="inp">' + esc(v || "（空）") + "</div>";
}

function listTable(f) {
  if (!f.value || !f.value.length) { return '<div class="ex">（空列表）</div>'; }
  var cols = f.columns || [];
  var head = "<tr>" + cols.map(function (c) {
    return "<th>" + esc(c.label) + ' <span class="ftype">' + esc(typeZh(c.type)) + "</span></th>";
  }).join("") + "</tr>";
  var body = (f.rows || []).map(function (row) {
    return "<tr>" + cols.map(function (c) {
      return "<td>" + esc(row[c.key] == null ? "" : row[c.key]) + "</td>";
    }).join("") + "</tr>";
  }).join("");
  var note = '<div class="lmeta">列表字段 · ' + f.row_count + " 行"
    + (f.rows && f.rows.length < f.row_count ? "（只读视图最多显示 " + f.rows.length + " 行）" : "")
    + " · 列名与类型来自内容包元数据</div>";
  return note + '<table class="ltable"><thead>' + head + "</thead><tbody>" + body + "</tbody></table>";
}

function kvTable(f) {
  if (!f.value || !Object.keys(f.value).length) { return '<div class="ex">（空映射）</div>'; }
  var body = (f.rows || []).map(function (r) {
    return "<tr><td>" + esc(r.key) + "</td><td>" + esc(r.display == null ? "" : r.display) + "</td></tr>";
  }).join("");
  return '<table class="ltable"><thead><tr><th>键</th><th>值</th></tr></thead>'
    + "<tbody>" + body + "</tbody></table>";
}

function objTable(f) {
  var kids = f.children || [];
  if (!kids.length) {
    return '<div class="ta">' + esc(JSON.stringify(f.value, null, 2)) + "</div>";
  }
  return kids.map(function (c) {
    return '<div class="row nest"><div class="rlab">' + esc(c.label)
      + ' <span class="ftype">' + esc(typeZh(c.type)) + "</span></div>"
      + '<div class="rval">' + fieldValue(c) + "</div></div>";
  }).join("");
}

// ---------------------------------------------------------------------------
// 启动
// ---------------------------------------------------------------------------
el("btn-validate").addEventListener("click", runValidate);
el("btn-save").addEventListener("click", runSave);
el("btn-cancel").addEventListener("click", function () {
  if (!draftCount()) { return; }
  state.result = null; renderResult(null); discardDraft(); reloadDetail();
});
el("btn-rollback").addEventListener("click", runRollback);
el("role").addEventListener("change", function (e) { switchRole(e.target.value); });
el("filter").addEventListener("input", function (e) {
  state.filter = e.target.value; renderEntries();
});
window.addEventListener("beforeunload", function (e) {
  if (EditorDraft.dirty(draft)) { e.preventDefault(); e.returnValue = ""; }
});

loadSession()
  .then(loadPacks)
  .then(loadModules)
  .catch(function (err) { fail("初始化", err); });
</script>
</body>
</html>
