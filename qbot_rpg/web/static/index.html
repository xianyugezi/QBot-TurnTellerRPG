<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>内容编辑器 · 批3 分区页签</title>
<link rel="stylesheet" href="/static/tokens.css">
<style>
/* 终端极简风（令牌全部来自 tokens.css；此处只写骨架与组件布局，零 CDN、零外链字体） */
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; height: 100%; }
body {
  font-family: var(--font-mono);
  font-size: var(--fs-12);
  line-height: var(--lh-tight);
  color: var(--text);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
}
.app { width: 100%; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

/* ---------- 顶栏：内容包选择器 + 保存状态 + 身份/权限开关 ----------
   窄窗口约束：三段信息不换行、不互相挤压——可收缩项（包名/保存状态）用省略号，
   身份切换与权限角标固定宽度（用户两批验收反馈：窄窗口顶栏被挤到换行）。 */
.topbar { height: var(--h-topbar); flex: 0 0 var(--h-topbar); display: flex; align-items: center;
  gap: var(--sp-7); padding: 0 var(--sp-8); border-bottom: var(--bw) solid var(--line-strong);
  white-space: nowrap; overflow: hidden; }
.brand { color: var(--text-strong); font-weight: 700; letter-spacing: .04em;
  flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.brand .mark { color: var(--accent); }
.pkgsel, .rolesel { display: inline-flex; align-items: center; gap: var(--sp-3);
  border: var(--bw) solid var(--line-strong); padding: 2px var(--sp-4); min-width: 0; }
.pkgsel { flex: 0 1 auto; max-width: 42vw; }
.rolesel { flex: 0 0 auto; }
.pkgsel .lb, .rolesel .lb { color: var(--text-4); flex: 0 0 auto; }
.pkgsel select, .rolesel select { font-family: inherit; font-size: var(--fs-12); color: var(--accent);
  background: var(--bg); border: 0; outline: none; padding: 1px 2px; max-width: 280px; min-width: 0; }
.pkgsel select { flex: 0 1 auto; text-overflow: ellipsis; }
.pkgsel .from { color: var(--text-6); flex: 0 0 auto; }
.saved { color: var(--accent); flex: 0 1 auto; min-width: 0;
  overflow: hidden; text-overflow: ellipsis; }
.saved::before { content: "["; color: var(--text-6); }
.saved::after { content: "]"; color: var(--text-6); }
.saved.dirty { color: var(--warn); }
.saved.err { color: var(--danger); }
.topright { margin-left: auto; display: flex; align-items: center; gap: var(--sp-6); color: var(--text-3);
  flex: 0 0 auto; white-space: nowrap; }
.who b { color: var(--text-value); font-weight: 700; }
.role { border: var(--bw) solid var(--accent); color: var(--accent); padding: 0 var(--sp-2); }
.role.ro { border-color: var(--warn); color: var(--warn); }
@media (max-width: 900px) {
  .topbar { gap: var(--sp-5); padding: 0 var(--sp-5); }
  .pkgsel .from { display: none; }        /* 窄窗口先舍来源标注，包名与状态保省略号 */
  .brand { letter-spacing: 0; }
}

.body { flex: 1 1 auto; display: flex; min-height: 0; }

/* ---------- 三栏骨架：①模块分类 ②条目列表 ③大编辑面板 ---------- */
.col-mod { width: var(--w-mod); flex: 0 0 var(--w-mod); border-right: var(--bw) solid var(--line-strong);
  display: flex; flex-direction: column; min-height: 0; }
.col-list { width: var(--w-list); flex: 0 0 var(--w-list); border-right: var(--bw) solid var(--line-strong);
  display: flex; flex-direction: column; min-height: 0; }
.col-hd { height: var(--h-bar); flex: 0 0 var(--h-bar); display: flex; align-items: center;
  padding: 0 var(--sp-6); border-bottom: var(--bw) solid var(--line-soft);
  color: var(--text-5); letter-spacing: .08em; }
.col-hd .src { margin-left: auto; color: var(--text-6); font-size: var(--fs-10); letter-spacing: 0; }
.mods { flex: 1 1 auto; min-height: 0; overflow-y: auto; overflow-x: hidden; padding: var(--sp-2) 0; }
.mod { display: flex; align-items: center; gap: 2px; padding: var(--sp-2) var(--sp-6);
  color: var(--text-2); white-space: nowrap; cursor: pointer; }
.mod::before { content: "\00b7 "; color: var(--text-6); }
.mod.grp::before { content: "\25be "; color: var(--text-4); }
.mod.sub { padding-left: calc(var(--sp-6) + var(--ind-lv)); }
.mod.sub::before { content: "\2514 "; color: var(--text-6); }
.mod:hover { background: var(--surface-hover); }
.mod.on { background: var(--surface-sel); color: var(--text-strong); border-left: var(--bw) solid var(--accent); }
.mod.on::before { content: "> "; color: var(--accent); }
.mod.sub.on::before { content: "\2514 "; color: var(--accent); }
.mod .ct { margin-left: auto; color: var(--text-4); }
.mod.on .ct { color: var(--accent); }

.list-hd { height: var(--h-bar); flex: 0 0 var(--h-bar); display: flex; align-items: center;
  padding: 0 var(--sp-6); border-bottom: var(--bw) solid var(--line-soft); }
.list-title { color: var(--text-strong); font-weight: 700; }
.list-count { margin-left: var(--sp-5); color: var(--text-5); font-size: var(--fs-11); font-weight: 400; }
.list-tools { display: flex; align-items: center; padding: var(--sp-3) var(--sp-6); border-bottom: var(--bw) solid var(--line-soft); }
.search { display: flex; align-items: center; border: var(--bw) solid var(--line-strong); padding: 2px var(--sp-4); width: 100%; }
.search input { border: 0; background: transparent; outline: none; color: var(--text-value);
  font-family: inherit; font-size: var(--fs-12); width: 100%; }
.rows { flex: 1 1 auto; min-height: 0; overflow-y: auto; overflow-x: hidden; padding: var(--sp-2) 0; }
.item { display: block; padding: var(--sp-3) var(--sp-6); color: var(--text-2); white-space: nowrap;
  overflow: hidden; text-overflow: ellipsis; cursor: pointer; }
.item::before { content: "\00b7 "; color: var(--text-6); }
.item:hover { background: var(--surface-hover); }
.item.on { background: var(--surface-sel); color: var(--text-strong); border-left: var(--bw) solid var(--accent); }
.item.on::before { content: "> "; color: var(--accent); }
.item.dirty::after { content: " *"; color: var(--warn); }
.list-ft { margin-top: auto; padding: var(--sp-4) var(--sp-6); border-top: var(--bw) solid var(--line-strong);
  color: var(--text-4); display: flex; align-items: center; gap: var(--sp-5); }
.sp { margin-left: auto; }

/* ---------- 细滚动条：6px、低对比、悬停略亮 ---------- */
.mods::-webkit-scrollbar, .rows::-webkit-scrollbar, .panel-body::-webkit-scrollbar { width: var(--sb-size); height: var(--sb-size); }
.mods::-webkit-scrollbar-track, .rows::-webkit-scrollbar-track, .panel-body::-webkit-scrollbar-track { background: transparent; }
.mods::-webkit-scrollbar-thumb, .rows::-webkit-scrollbar-thumb, .panel-body::-webkit-scrollbar-thumb { background: var(--sb-thumb); border-radius: var(--radius-sb); }
.mods::-webkit-scrollbar-thumb:hover, .rows::-webkit-scrollbar-thumb:hover, .panel-body::-webkit-scrollbar-thumb:hover { background: var(--sb-thumb-hover); }

/* ---------- 大编辑面板（占其余全部宽度） ---------- */
.panel { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; min-height: 0; }
.panel-hd { flex: 0 0 auto; padding: var(--sp-5) var(--sp-8); border-bottom: var(--bw) solid var(--line-soft);
  display: flex; align-items: center; gap: var(--sp-6); }
.panel-title { color: var(--text-strong); font-weight: 700; }
.panel-title::before { content: "> "; color: var(--accent); }
.panel-sub { color: var(--text-4); }
.panel-id { margin-left: auto; color: var(--text-4); }
.toolbar { flex: 0 0 auto; display: flex; align-items: center; gap: var(--sp-5); flex-wrap: wrap;
  padding: var(--sp-4) var(--sp-8); border-bottom: var(--bw) solid var(--line-soft); color: var(--text-4); }
.panel-body { flex: 1 1 auto; min-height: 0; overflow-y: auto; overflow-x: hidden; padding: var(--sp-6) var(--sp-8); }
.panel-ft { flex: 0 0 auto; display: flex; align-items: center; gap: var(--sp-5);
  padding: var(--sp-5) var(--sp-8); border-top: var(--bw) solid var(--line-strong); color: var(--text-5); }

.btn { font-family: inherit; font-size: var(--fs-12); cursor: pointer; color: var(--text-btn);
  background: transparent; border: var(--bw) solid var(--line-strong); padding: 2px var(--sp-6); }
.btn:hover { border-color: var(--accent); color: var(--accent); }
.btn.primary { border-color: var(--accent); color: var(--accent); }
.btn.danger:hover { border-color: var(--danger); color: var(--danger); }
.btn:disabled { color: var(--text-disabled); border-color: var(--line); cursor: not-allowed; }
.btn:disabled:hover { color: var(--text-disabled); border-color: var(--line); }
.tbnote { color: var(--text-5); font-size: var(--fs-11); }

.meta { display: flex; align-items: center; gap: var(--sp-5); margin: 0 0 var(--sp-6);
  padding: var(--sp-3) var(--sp-5); border: var(--bw) solid var(--line); border-left: var(--bw-accent) solid var(--accent);
  color: var(--text-2); }
.meta .mk { color: var(--accent); }
.meta .mk::before { content: "["; color: var(--text-5); }
.meta .mk::after { content: "]"; color: var(--text-5); }
.meta .src { margin-left: auto; color: var(--text-4); }

/* 校验结果（红拦/黄提示；人话：哪一项 / 为什么 / 怎么改） */
.vbox { margin: 0 0 var(--sp-6); border: var(--bw) solid var(--line);
  border-left: var(--bw-accent) solid var(--ok); padding: var(--sp-4) var(--sp-5); }
.vbox.red { border-left-color: var(--danger); }
.vbox.warn { border-left-color: var(--warn); }
.vhead { color: var(--text-strong); margin-bottom: var(--sp-3); }
.vbox.red .vhead { color: var(--danger); }
.vbox.warn .vhead { color: var(--warn); }
.vrow { color: var(--text-2); padding: var(--sp-2) 0; border-top: var(--bw) solid var(--line-faint);
  line-height: var(--lh-ex); white-space: pre-wrap; overflow-wrap: anywhere; }
.vrow b { color: var(--danger); font-weight: 700; }
.vrow.yellow b { color: var(--warn); }
.vrow .vfix { color: var(--text-5); display: block; }

/* 分组页签（终端极简风 06 组件）：名称 + 字段计数徽标；名称来自元数据 group_labels */
.gtabs { display: flex; align-items: center; gap: var(--sp-3); margin: 0 0 var(--sp-6);
  padding-bottom: var(--sp-4); border-bottom: var(--bw) solid var(--line-soft); flex-wrap: wrap; }
.gtab { display: inline-flex; align-items: center; height: var(--h-ctl); font-family: inherit;
  font-size: var(--fs-12); cursor: pointer; color: var(--text-3);
  border: var(--bw) solid var(--line); background: transparent; padding: 0 var(--sp-5); }
.gtab b { margin-left: var(--sp-2); color: var(--text-5); font-weight: 400; }
.gtab:hover { border-color: var(--line-strong); color: var(--text-value); }
.gtab.on { color: var(--accent); border-color: var(--accent); }
.gtab.on b { color: var(--accent); }
.gpane[hidden] { display: none; }
.gempty { color: var(--text-5); padding: var(--sp-8) var(--sp-6); line-height: var(--lh-ex); }

/* 双列字段网格：同一行的两列基线对齐。要点：
   · .row 内容顶部对齐（align-items:start），标签固定为「单行控件高度」的盒子并居中，
     因此两列的标签与首行控件始终落在同一条线上；长提示只向下撑高本行 .rval，
     不会把标签改成垂直居中（用户验收反馈：长提示把整行撑歪）；
   · .rows2 默认 stretch → 同一网格行的两列等高、底线对齐。 */
.rows2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); column-gap: var(--sp-11); align-items: stretch; }
.row { display: grid; grid-template-columns: 132px minmax(0, 1fr); gap: var(--sp-5); align-items: start;
  padding: var(--sp-4) 0; border-bottom: var(--bw) solid var(--line-faint); min-width: 0; }
/* 宽字段（列表/引用列表，批4 UX）：跨双列独占一行——多列表格拿整幅面板宽度，
   列不再被挤到面板右缘；仍放不下时由 .ltable-scroll 横向滚动兜底。 */
.rows2 > .row.wide { grid-column: 1 / -1; }
.row > .rlab { color: var(--text-4); display: flex; align-items: center; gap: var(--sp-3);
  flex-wrap: wrap; min-height: var(--h-ctl); min-width: 0; }
.row > .rlab::before { content: "> "; color: var(--line-mute); }
.row.dirty > .rlab { color: var(--warn); }
.row.dirty > .rlab::after { content: " ● 已改动"; color: var(--warn); font-size: var(--fs-10); }
.ftype { color: var(--accent-dim); }
.ftype::before { content: "<"; color: var(--text-6); }
.ftype::after { content: ">"; color: var(--text-6); }
/* 字段原始键名（批3.5）：中文名为主、键名为辅——弱化色 + 更小字号，不抢主标签 */
.fkey { color: var(--text-5); font-size: var(--fs-11); font-weight: 400; }
.rval { min-width: 0; align-self: start; }
.inp { color: var(--text-value); white-space: pre-wrap; overflow-wrap: anywhere; }
.inp.mono { color: var(--accent); white-space: pre-wrap; overflow-wrap: anywhere; }
.inp.bool { display: flex; align-items: center; gap: var(--sp-3); color: var(--text-value); }
.box { display: inline-block; width: 11px; height: 11px; border: var(--bw) solid var(--line-strong); }
.box.on { border-color: var(--accent); background: var(--accent); }
.ta { width: 100%; border: var(--bw) solid var(--line); background: transparent; color: var(--text);
  font-family: inherit; font-size: var(--fs-12); line-height: var(--lh-text); padding: var(--sp-4) var(--sp-5);
  white-space: pre-wrap; overflow-wrap: anywhere; }
.hint { color: var(--text-5); font-size: var(--fs-11); margin-top: var(--sp-2);
  overflow-wrap: anywhere; }
.ex { color: var(--text-5); }
.ro { color: var(--text-5); font-size: var(--fs-10); }
.nest { border-bottom: 0; padding: var(--sp-2) 0; grid-template-columns: 110px 1fr; }

/* 编辑控件（终端极简风：直角、细边、聚焦亮线） */
.cin, .cta { width: 100%; background: transparent; color: var(--text-value);
  font-family: inherit; font-size: var(--fs-12); border: var(--bw) solid var(--line);
  padding: 2px var(--sp-4); outline: none; }
.cta { line-height: var(--lh-text); padding: var(--sp-4) var(--sp-5); resize: vertical; }
.cin:focus, .cta:focus { border-color: var(--focus); box-shadow: 0 0 0 var(--focus-offset) var(--focus); }
select.cin { padding: 1px var(--sp-2); }
.ctl-bool { display: inline-flex; align-items: center; gap: var(--sp-3); cursor: pointer; color: var(--text-value); }
.ctl-bool input { accent-color: var(--accent); width: 13px; height: 13px; }

.ltable { width: 100%; border-collapse: collapse; table-layout: fixed; }
.ltable th { text-align: left; font-weight: 400; color: var(--text-3); border: var(--bw) solid var(--line);
  background: var(--surface-th); padding: var(--sp-3) var(--sp-4); white-space: nowrap; overflow: hidden; }
.ltable th .ftype { margin-left: var(--sp-2); }
.ltable td { border: var(--bw) solid var(--line-soft); padding: var(--sp-3) var(--sp-4); color: var(--text);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ltable tr:nth-child(even) td { background: var(--surface-zebra); }
.lmeta { color: var(--text-4); font-size: var(--fs-11); margin: var(--sp-2) 0; }

/* ---------- 可增删行表格（批4 组件04）：行内编辑 + 行尾删除 + 表下「+ 添加一行」 ---------- */
/* 宽表不缩写（批4 UX）：列宽按内容自适应 + 最小列宽，容器横向滚动（细滚动条令牌）；
   表格不再被 table-layout:fixed 压窄，列头不会退化成 act/pro/wei 这类截断缩写。 */
.ltable-scroll { max-width: 100%; overflow-x: auto; }
.ltable-scroll::-webkit-scrollbar { height: var(--sb-size); }
.ltable-scroll::-webkit-scrollbar-track { background: transparent; }
.ltable-scroll::-webkit-scrollbar-thumb { background: var(--sb-thumb); border-radius: var(--radius-sb); }
.ltable-scroll::-webkit-scrollbar-thumb:hover { background: var(--sb-thumb-hover); }
/* 表格宽度 = 容器宽（列按可用空间分配）；内容确实放不下时按最小内容宽溢出，
   由 .ltable-scroll 横向滚动兜底。不用 width:max-content —— 否则列恒取最长内容宽，
   表头换行也压不窄列。 */
.ltable-edit, .ltable-ro { table-layout: auto; width: 100%; }
.ltable-edit th { min-width: 96px; overflow: visible; white-space: normal; }
.ltable-ro th { min-width: 96px; overflow: visible; }
.ltable-edit td { padding: var(--sp-2) var(--sp-3); }
.ltable-edit td .cin { padding: 1px var(--sp-3); }
.ltable th.op, .ltable td.op { width: 84px; min-width: 84px; text-align: right; border-left: 0; }
.ltable-edit th.op, .ltable-edit td.op { padding-right: var(--sp-5); }
.lcell.warn { border-color: var(--warn); }
/* 表格内可编辑单元格（批4 UX）：与 tokens.css 控件同一套边框/底色/聚焦态（.cin 自带聚焦环）；
   --bg 底让输入框在斑马纹行上仍是清晰的「字段面」，不再与表格底色混成一块。 */
.ltable-edit .cin, .ltable-edit .cta { background: var(--bg); }
/* 只读单元格（对象/映射/嵌套列表）：同样有框有底，空值走 EMPTY_TEXT；宽 JSON 自动换行 */
.ro-cell { display: block; width: 100%; max-width: 260px; min-height: var(--h-ctl);
  padding: 1px var(--sp-3); border: var(--bw) solid var(--line-soft); background: var(--surface);
  color: var(--text-4); font-size: var(--fs-11); white-space: pre-wrap; overflow-wrap: anywhere; }
.ldel { display: inline-flex; align-items: center; height: var(--h-ctl-sm); padding: 0 var(--sp-3);
  font-family: inherit; font-size: var(--fs-11); cursor: pointer; background: transparent;
  border: var(--bw) solid var(--line-strong); color: var(--text-3); }
.ldel:hover { border-color: var(--danger); color: var(--danger); }
.ladd { display: inline-flex; align-items: center; margin-top: var(--sp-4); padding: var(--sp-2) var(--sp-6);
  font-family: inherit; font-size: var(--fs-12); cursor: pointer; background: transparent;
  border: var(--bw) dashed var(--line-accent-dash); color: var(--accent); }
.ladd:hover { background: var(--surface-hover); }
.lwrap { width: 100%; }

/* ---------- 引用字段选择器（批4 组件03）：可搜索候选 + 已选值 + 非法值黄提示 ---------- */
.refvals { display: flex; flex-wrap: wrap; gap: var(--sp-3); margin-bottom: var(--sp-3); }
.refval { display: inline-flex; align-items: center; gap: var(--sp-4); border: var(--bw) solid var(--line);
  padding: var(--sp-2) var(--sp-4); color: var(--text-2); }
.refval .mono2 { color: var(--accent); }
.refval.warn { border-color: var(--warn); }
.refwarn { color: var(--warn); font-size: var(--fs-11); }
.refnote { display: block; }
.refsel { width: 100%; border: var(--bw) solid var(--line); margin-top: var(--sp-2); }
.rf-hd { display: flex; align-items: center; gap: var(--sp-4); height: var(--h-ctl);
  padding: 0 var(--sp-4); border-bottom: var(--bw) solid var(--line-soft); }
.rf-hd .q { color: var(--text-4); white-space: nowrap; }
.rf-hd input { flex: 1 1 auto; height: 18px; border: 0; background: transparent;
  color: var(--text-value); font-family: inherit; font-size: var(--fs-12); outline: none; }
.rf-list { padding: var(--sp-2) 0; max-height: 180px; overflow-y: auto; }
.rf-it { display: flex; align-items: center; gap: var(--sp-5); padding: var(--sp-3) var(--sp-4);
  color: var(--text-2); cursor: pointer; }
.rf-it::before { content: "\00b7 "; color: var(--text-6); }
.rf-it:hover, .rf-it.h { background: var(--surface); color: var(--text-strong); }
.rf-it:hover::before, .rf-it.h::before { content: "> "; color: var(--accent); }
.rf-it .id2 { margin-left: auto; color: var(--text-5); font-size: var(--fs-11); }
.rf-ft { display: flex; gap: var(--sp-8); padding: var(--sp-3) var(--sp-4);
  border-top: var(--bw) solid var(--line-soft); color: var(--text-5); font-size: var(--fs-11); }
.empty { color: var(--text-5); padding: var(--sp-10) var(--sp-8); line-height: var(--lh-ex); }
.vtag { flex: 0 0 auto; height: var(--h-ctl-sm); display: flex; align-items: center;
  padding: 0 var(--sp-8); color: var(--text-5); border-top: var(--bw) solid var(--line-soft); }

/* ---------- 字段说明气泡（批4.6）：悬停中文名出现 · 点击固定 · Esc/点空白关闭 ----------

<body>
<div class="app">

  <header class="topbar">
    <span class="brand"><span class="mark">▚</span> 内容编辑器 :: 分区页签</span>
    <label class="pkgsel">
      <span class="lb">pkg=</span>
      <select id="packs" aria-label="内容包选择器"></select>
      <span class="from">manifest.json</span>
    </label>
    <span class="saved" id="dirty">已保存</span>
    <div class="topright">
      <label class="rolesel">
        <span class="lb">身份=</span>
        <select id="role" aria-label="权限位切换"></select>
      </label>
      <span class="role" id="roleTag">可编辑</span>
    </div>
  </header>

  <div class="body">

    <!-- 栏①：模块分类栏（模块与层级来自 manifest 声明；父子缩进表达） -->
    <aside class="col-mod">
      <div class="col-hd">模块<span class="src" id="mod-src">manifest.modules</span></div>
      <nav class="mods" id="mods"></nav>
    </aside>

    <!-- 栏②：条目列表栏（只名字 · 细滚动条 · 无翻页器） -->
    <aside class="col-list">
      <div class="list-hd">
        <span class="list-title" id="list-title">条目</span>
        <span class="list-count" id="list-count"></span>
      </div>
      <div class="list-tools">
        <div class="search"><input id="filter" placeholder="过滤当前列表（本地）" aria-label="过滤当前列表"></div>
      </div>
      <div class="rows" id="rows"></div>
      <div class="list-ft"><span>无翻页 · 滚动查看</span><span class="sp" id="list-ft">共 0 条</span></div>
    </aside>

    <!-- 栏③：大编辑面板（占其余全部宽度；批2 可编辑 + 草稿态 + 校验/保存/回退） -->
    <section class="panel">
      <div class="panel-hd">
        <span class="panel-title" id="p-title">未选择条目</span>
        <span class="panel-sub" id="p-sub"></span>
        <span class="panel-id" id="p-id"></span>
      </div>
      <div class="toolbar" id="toolbar">
        <button class="btn" id="btn-validate" disabled>校验</button>
        <button class="btn primary" id="btn-save" disabled>保存</button>
        <button class="btn" id="btn-cancel" disabled>取消</button>
        <span class="sp"></span>
        <span class="tbnote" id="backup-note">备份：—</span>
        <button class="btn danger" id="btn-rollback" disabled>回退到上一份备份</button>
      </div>
      <div class="panel-body" id="p-body">
        <div class="empty">从左侧选择模块与条目。字段按内容包元数据渲染；改动先进草稿，保存时才校验并落盘。</div>
      </div>
      <div class="panel-ft"><span>批4.6 · 字段说明气泡（悬停/点击中文名看解释 · 改动先进草稿）</span></div>
    </section>

  </div>

  <div class="vtag" id="vtag">终端极简风 · 元数据驱动 · 零 CDN</div>
</div>

<!-- 字段说明气泡（批4.6）：内容由后端 help_card 自动拼装 + 元数据人工 help 填充 -->
<div id="help-card" class="help-card" role="tooltip" hidden></div>

<script>
"use strict";

/* 草稿态纯逻辑（无 DOM 依赖；浏览器挂在 globalThis.EditorDraft，node 下走 module.exports）。

  else { root.EditorDraft = factory(); }

/* EDITOR_DRAFT_END */

 * 语义：页签 = 后端元数据声明的分组（顺序/显示名/计数都来自元数据，
 * 但声明了却没有字段落进去的组也保留 → empty=true 走空态文案）。
 * 切组只改「当前视图索引」，**绝不触碰草稿**：草稿按字段键持有，跨组编辑不丢。 */
/* EDITOR_GROUPS_BEGIN */
(function (root, factory) {

  else { root.EditorGroups = factory(); }

  function labelOf(g) {
    var name = g && g.name != null ? String(g.name) : "";
    var label = g && g.label ? String(g.label) : "";

  }

/* EDITOR_LIST_END */

/* 引用字段纯逻辑（批4 · 引用选择器；无 DOM 依赖，node 下走 module.exports）。
 * 语义：保存的是目标标识；候选用于显示名称与可搜索筛选；值不在候选内只做黄提示（不拦）。 */

    if (known === undefined || known === null) { return { warn: false, text: "" }; }
    if (known === false) {

// 类型显示名（框架级映射，与内容包无关）：FieldMeta.type → 中文
// ---------------------------------------------------------------------------

  bool: "布尔", enum: "枚举", ref: "引用", list: "列表", obj: "对象",
  map: "映射", formula: "公式"
};

// 空值文案唯一来源（批3 统一：此前空值有两种写法，现全部走本常量）。
var EMPTY_TEXT = "（空）";

  pack: null, modules: [], module: null, entries: [], entry: null, detail: null,
  filter: "", role: "owner", editable: true, backup: null, fieldIndex: {},
  refCache: {}, refKnown: {}, refQuery: {}, busy: false, tabs: []

  return String(v == null ? "" : v)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}
function enc(v) { return encodeURIComponent(v); }
function typeZh(t) { return TYPE_ZH[t] || t || "文本"; }

/* EDITOR_FIELD_LABEL_BEGIN */
// 字段标签渲染（批3.5）：中文名为主 + 原始键名为辅。
//   · 元数据给了中文名（label !== 原始键）→「中文名 + 弱化键名」并列；
//   · 无中文名（label 与键相同 / 键缺失）→ 只显示原始键（现状，不凭空造词）；
//   · 通用：任何模块、任何字段都走这一个函数，框架不认任何业务字段名。
function fieldLabelHtml(label, key) {
  var l = label == null ? "" : String(label);
  var k = key == null ? "" : String(key);
  if (k && l && l !== k) {
    return esc(l) + ' <span class="fkey">' + esc(k) + "</span>";
  }
  return esc(l || k);
}
/* EDITOR_FIELD_LABEL_END */
function el(id) { return document.getElementById(id); }

/* EDITOR_HELP_BEGIN */
// 字段说明气泡（批4.6）：纯逻辑部分（可 node 直接执行；DOM 接线在本模块下方）。
//   · 卡片内容 = 后端 help_card（自动拼装：类型/数值还是比例/建议范围/默认值/必填/
//     候选值/引用目标 + 人工 help）；前端只按结构渲染，不认字段类型、不认业务字段名。

  var out = [];
  if (card.help) { out.push({ k: "说明", v: card.help }); }
  out.push({ k: "类型", v: card.type || "未标注" });
  out.push({ k: "数值/比例", v: card.scale || "未标注" });
  out.push({ k: "建议范围", v: card.range || "未标注" });
  out.push({ k: "默认值", v: card.default || "无默认值" });
  out.push({ k: "填写要求", v: card.required ? "必填" : "选填" });
  if (card.enum && card.enum.length) { out.push({ k: "候选值", v: card.enum.join(" / ") }); }

// 卡片标题：中文名（原始键）——与字段标签同一口径。
function helpTitle(card) {

  if (card.key && label && card.key !== label) { return label + "（" + card.key + "）"; }
  return label || card.key || "";
}

function helpCardHtml(card) {
  if (!card) { return ""; }
  var rows = helpLines(card).map(function (r) {
    return '<div class="hc-row"><span class="hc-k">' + esc(r.k) + "</span>"
      + '<span class="hc-v">' + esc(r.v) + "</span></div>";
  }).join("");
  return '<div class="hc-hd"><span class="hc-t">' + esc(helpTitle(card)) + "</span>"
    + (card.unregistered ? '<span class="hc-tag">元数据未登记</span>' : "")
    + "</div>" + rows;

// 状态机（纯函数，便于 node 断言）：{open, pinned, id}
function helpStateClosed() { return { open: false, pinned: false, id: null }; }

  return { open: true, pinned: false, id: id };
}

  return helpStateClosed();
}

// 收进视口。各候选都不与 avoid（正在编辑的字段矩形）重叠；窄窗口自动避让。

  return '<span class="flabel helpable" data-help="' + esc(id) + '" tabindex="0"'
    + ' role="button" aria-expanded="false" aria-label="字段说明：'
    + esc(f.label || f.key || "") + '">' + inner + "</span>";
}
/* EDITOR_HELP_END */

// ---- 说明气泡 DOM 接线（纯逻辑状态机见上；此处只做事件/定位/显隐）----
var helpDom = { state: helpStateClosed(), timer: null };

function helpCardBox() { return el("help-card"); }
function helpCancelClose() {
  if (helpDom.timer) { clearTimeout(helpDom.timer); helpDom.timer = null; }
}

function helpHideDom() {
  helpDom.state = helpStateClosed();
  var box = helpCardBox();
  if (box) { box.hidden = true; }
  Array.prototype.forEach.call(document.querySelectorAll(".flabel.helpable"), function (t) {
    t.setAttribute("aria-expanded", "false");
  });
}

function helpRenderDom(id) {
  var card = HELP_CARDS[id];
  var box = helpCardBox();
  if (!card || !box) { helpHideDom(); return; }
  box.innerHTML = helpCardHtml(card);
  box.hidden = false;
  var trig = document.querySelector('.flabel.helpable[data-help="' + id + '"]');
  var anchor = trig ? trig.getBoundingClientRect()
    : { left: 8, top: 8, right: 8, bottom: 8 };
  var row = (trig && trig.closest) ? trig.closest(".row") : null;
  var avoid = (row && row.getBoundingClientRect) ? row.getBoundingClientRect() : anchor;
  var pos = helpPlace(
    { left: anchor.left, top: anchor.top, right: anchor.right, bottom: anchor.bottom },
    { w: box.offsetWidth, h: box.offsetHeight },
    { w: window.innerWidth || 1024, h: window.innerHeight || 768 },
    { left: avoid.left, top: avoid.top, right: avoid.right, bottom: avoid.bottom }, 6);
  box.style.left = pos.left + "px";
  box.style.top = pos.top + "px";
  Array.prototype.forEach.call(document.querySelectorAll(".flabel.helpable"), function (t) {
    t.setAttribute("aria-expanded", t === trig ? "true" : "false");
  });
}

function helpApply(state) {
  helpDom.state = state;
  if (state && state.open) { helpRenderDom(state.id); } else { helpHideDom(); }
}

function bindHelp() {
  helpHideDom();
  Array.prototype.forEach.call(document.querySelectorAll(".flabel.helpable"), function (trig) {
    var id = trig.dataset.help;
    trig.addEventListener("mouseenter", function () {
      helpCancelClose();
      helpApply(helpHover(helpDom.state, id));
    });
    trig.addEventListener("mouseleave", function () {
      if (helpDom.state.pinned) { return; }
      helpCancelClose();
      helpDom.timer = setTimeout(function () { helpApply(helpUnhover(helpDom.state)); }, 140);
    });
    trig.addEventListener("click", function (ev) {
      ev.preventDefault();
      helpCancelClose();
      helpApply(helpClick(helpDom.state, id));
    });
    trig.addEventListener("keydown", function (ev) {
      var next = helpKey(helpDom.state, id, ev.key);
      if (next === helpDom.state) { return; }
      ev.preventDefault();
      helpCancelClose();
      helpApply(next);
    });
  });
  var box = helpCardBox();
  if (!box || box.dataset.bound) { return; }
  box.dataset.bound = "1";
  box.addEventListener("mouseenter", helpCancelClose);
  box.addEventListener("mouseleave", function () {
    if (helpDom.state.pinned) { return; }
    helpApply(helpUnhover(helpDom.state));
  });
  document.addEventListener("click", function (ev) {
    if (!helpDom.state.open) { return; }
    var t = ev.target;
    if (t && t.closest && (t.closest(".help-card") || t.closest(".flabel.helpable"))) { return; }
    helpApply(helpStateClosed());
  });
  document.addEventListener("keydown", function (ev) {
    if (ev.key === "Escape" && helpDom.state.open) { helpApply(helpStateClosed()); }
  });
  window.addEventListener("resize", function () {
    if (helpDom.state.open) { helpRenderDom(helpDom.state.id); }
  });
}

function api(path) {
  return fetch(path, { headers: { "Accept": "application/json" } }).then(function (r) {
    return r.json().then(function (data) {
      if (!r.ok) { throw new Error((data && data.error) || ("HTTP " + r.status)); }
      return data;
    });
  });
}
function postJSON(path, body) {
  return fetch(path, {
    method: "POST",
    headers: { "Content-Type": "application/json", "Accept": "application/json" },
    body: JSON.stringify(body || {})
  }).then(function (r) {
    return r.json().then(function (data) {
      if (!r.ok) { throw new Error((data && data.error) || ("HTTP " + r.status)); }
      return data;
    });
  });
}
function fail(where, err) {
  el("p-body").innerHTML = '<div class="empty">' + esc(where + " 失败：" + err.message) + "</div>";
}

// ---------------------------------------------------------------------------
// 草稿态：未保存计数 / 取消 / 离开守卫（不静默丢失）
// ---------------------------------------------------------------------------
function draftCount() { return EditorDraft.count(draft); }

function markDirty() {
  var n = draftCount();
  var tag = el("dirty");
  tag.textContent = n ? ("未保存改动 " + n + " 项") : "已保存";
  tag.className = "saved" + (n ? " dirty" : "");
  var has = n > 0;
  el("btn-save").disabled = !has || !state.editable || state.busy;
  el("btn-cancel").disabled = !has || state.busy;
  el("btn-validate").disabled = !has || state.busy;
  Array.prototype.forEach.call(document.querySelectorAll(".row[data-field]"), function (row) {
    row.classList.toggle("dirty", Object.prototype.hasOwnProperty.call(draft.changes, row.dataset.field));
  });
  Array.prototype.forEach.call(document.querySelectorAll(".item[data-id]"), function (it) {
    it.classList.toggle("dirty", n > 0 && it.dataset.id === state.entry);
  });
}

function discardDraft() { EditorDraft.discard(draft); markDirty(); }

function canLeave() {
  if (!EditorDraft.dirty(draft)) { return true; }
  return window.confirm("当前条目有 " + draftCount() + " 项未保存改动；离开将丢弃这些改动。确定离开吗？");
}

// ---------------------------------------------------------------------------
// 权限位：机主可编辑 / GM 只读预览
// ---------------------------------------------------------------------------
function loadSession() {
  return api("/api/session").then(function (s) {
    state.role = s.role; state.editable = !!s.editable;
    var sel = el("role");
    sel.innerHTML = "";
    (s.roles || []).forEach(function (r) {
      var o = document.createElement("option");
      o.value = r.value; o.textContent = r.label;
      sel.appendChild(o);
    });
    sel.value = state.role;
    renderRoleTag();
  });
}

function renderRoleTag() {
  var tag = el("roleTag");
  tag.textContent = state.editable ? "可编辑" : "只读预览";
  tag.className = "role" + (state.editable ? "" : " ro");
  markDirty();
}

function switchRole(role) {
  return postJSON("/api/session/role", { role: role }).then(function (s) {
    state.role = s.role; state.editable = !!s.editable;
    renderRoleTag();
    return reloadDetail();  // 只读/可编辑切换后重画控件
  });
}

// ---------------------------------------------------------------------------
// 内容包选择器
// ---------------------------------------------------------------------------
function loadPacks() {
  return api("/api/packs").then(function (data) {
    var sel = el("packs");
    sel.innerHTML = "";
    (data.packs || []).forEach(function (p) {
      var o = document.createElement("option");
      o.value = p.id;
      o.textContent = p.name + "  (" + p.id + " · " + p.module_count + " 模块)";
      sel.appendChild(o);
    });
    state.pack = data.default || (data.packs[0] && data.packs[0].id) || null;
    if (state.pack) { sel.value = state.pack; }
    sel.addEventListener("change", function () {
      if (!canLeave()) { sel.value = state.pack; return; }
      discardDraft();
      state.pack = sel.value; state.module = null; state.entry = null;
      state.refCache = {}; state.refKnown = {}; state.refQuery = {};  // 换包后引用候选必须重拉
      loadModules();
    });
  });
}

// ---------------------------------------------------------------------------
// 栏①：模块分类（层级来自包元数据；item.children 递归渲染）
// ---------------------------------------------------------------------------
function renderModules() {
  var nav = el("mods");
  nav.innerHTML = "";
  function node(n, depth) {
    var d = document.createElement("div");
    d.className = "mod" + (n.children && n.children.length ? " grp" : "") + (depth > 0 ? " sub" : "")
      + (n.module === state.module ? " on" : "");
    d.dataset.module = n.module;
    d.innerHTML = esc(n.label) + '<span class="ct">' + esc(n.count) + "</span>";
    d.addEventListener("click", function () { selectModule(n.module); });
    nav.appendChild(d);
    (n.children || []).forEach(function (c) { node(c, depth + 1); });
  }
  (state.modules || []).forEach(function (m) { node(m, 0); });
}

function loadModules() {
  if (!state.pack) { return Promise.resolve(); }
  return api("/api/pack/" + enc(state.pack) + "/modules").then(function (data) {
    state.modules = data.modules || [];
    var flat = data.flat ? "平铺" : "层级声明";
    el("mod-src").textContent = "manifest.modules · " + state.modules.length + " · " + flat;
    var first = state.modules[0];
    if (!state.module && first) { selectModule(first.module); } else { renderModules(); }
  });
}

// ---------------------------------------------------------------------------
// 栏②：条目列表（只名字；无翻页）
// ---------------------------------------------------------------------------
function selectModule(mod) {
  if (!canLeave()) { return; }
  discardDraft();
  state.result = null;
  state.module = mod; state.entry = null; state.filter = ""; el("filter").value = "";
  renderModules();
  var pos = findModule(mod);
  el("list-title").textContent = pos ? pos.label : mod;
  return loadEntries();
}

function findModule(mod) {
  var found = null;
  (function walk(list) {
    (list || []).forEach(function (n) {
      if (n.module === mod) { found = n; }
      if (n.children) { walk(n.children); }
    });
  })(state.modules);
  return found;
}

function loadEntries() {
  if (!state.pack || !state.module) { return Promise.resolve(); }
  return api("/api/pack/" + enc(state.pack) + "/module/" + enc(state.module) + "/entries")
    .then(function (data) {
      state.entries = data.entries || [];
      el("list-count").textContent = state.entries.length + " 条";
      renderEntries();
      if (state.entries.length) { selectEntry(state.entries[0].id); }
      else {
        el("p-body").innerHTML = '<div class="empty">该模块暂无条目（条目列表为空）。</div>';
        el("p-title").textContent = EMPTY_TEXT; el("p-sub").textContent = ""; el("p-id").textContent = "";
        helpHideDom();
      }
    });
}

function renderEntries() {
  var box = el("rows");
  box.innerHTML = "";
  var q = state.filter.toLowerCase();
  var shown = state.entries.filter(function (e) { return !q || e.name.toLowerCase().indexOf(q) >= 0; });
  shown.forEach(function (e) {
    var d = document.createElement("div");
    d.className = "item" + (e.id === state.entry ? " on" : "");
    d.dataset.id = e.id;
    d.textContent = e.name;
    d.title = e.name + "  [" + e.id + "]";
    d.addEventListener("click", function () { selectEntry(e.id); });
    box.appendChild(d);
  });
  el("list-ft").textContent = "共 " + shown.length + " 条"
    + (shown.length !== state.entries.length ? "（已过滤 / 全部 " + state.entries.length + "）" : "");
}

// ---------------------------------------------------------------------------
// 栏③：条目详情（字段由元数据生成；控件由后端 control 决定）
// ---------------------------------------------------------------------------
function selectEntry(id) {
  if (!canLeave()) { return; }
  discardDraft();
  state.result = null;
  state.entry = id;
  renderEntries();
  return reloadDetail();
}

function reloadDetail() {
  if (!state.pack || !state.module || !state.entry) { return Promise.resolve(); }
  return api("/api/pack/" + enc(state.pack) + "/entry/" + enc(state.module) + "/" + enc(state.entry))
    .then(function (data) {
      state.detail = data;
      state.fieldIndex = {};
      (data.fields || []).forEach(function (f) { state.fieldIndex[f.key] = f; });
      renderDetail(data);
      return refreshBackup();
    }).catch(function (err) { fail("读取条目", err); });
}

function refreshBackup() {
  if (!state.pack || !state.module) { return Promise.resolve(); }
  return api("/api/pack/" + enc(state.pack) + "/module/" + enc(state.module) + "/backup")
    .then(function (b) {
      state.backup = b;
      el("backup-note").textContent = b.exists
        ? ("备份：" + b.path + " · " + b.size + " 字节") : "备份：暂无（保存一次后生成）";
      el("btn-rollback").disabled = !b.exists || !state.editable || state.busy;
    }).catch(function () { /* 备份状态失败不阻断编辑 */ });
}

function renderDetail(d) {
  el("p-title").textContent = d.name;
  el("p-sub").textContent = (d.module_label || d.module) + " · 字段由元数据渲染";
  el("p-id").textContent = d.id;
  resetHelpCards();   // 说明卡注册表随渲染重建（字段行构建时注册 help id）

  var html = '<div class="meta"><span class="mk">元数据驱动</span>'
    + "本页字段由内容包元数据生成 · " + d.field_count + " 个字段 · " + d.group_count + " 个分组"
    + (state.editable ? " · 可编辑" : " · 只读预览")
    + '<span class="src">' + esc(d.meta_source) + "</span></div>";
  html += '<div id="result" hidden></div>';

  var tabs = EditorGroups.view(d.groups || [], d.fields || []);
  if (!tabs.length) {
    state.tabs = tabs;
    el("p-body").innerHTML = html + '<div class="empty">该条目没有可渲染字段。</div>';
    helpHideDom();
    markDirty();
    return;
  }
  state.tabs = tabs;
  var tbar = '<div class="gtabs">';
  tabs.forEach(function (g, i) {
    tbar += '<button class="gtab' + (i === 0 ? " on" : "") + '" data-g="' + i
      + '" title="' + esc("分组键：" + g.name) + '">'
      + esc(g.label) + " <b>" + g.count + "</b></button>";
  });
  tbar += "</div>";
  html += tbar;
  tabs.forEach(function (g, i) {
    html += '<div class="gpane"' + (i === 0 ? "" : " hidden") + ' data-g="' + i + '">'
      + (g.empty
        ? '<div class="gempty">该分组暂无字段（元数据声明了此分组，本条目里没有字段落在其中）。</div>'
        : '<div class="rows2">' + g.fields.map(fieldRow).join("") + "</div>")
      + "</div>";
  });
  el("p-body").innerHTML = html;
  bindTabs();
  bindControls();
  bindHelp();
  if (state.result) { renderResult(state.result); }
  markDirty();
}

function bindTabs() {
  var tabs = state.tabs || [];
  Array.prototype.forEach.call(el("p-body").querySelectorAll(".gtab"), function (btn) {
    btn.addEventListener("click", function () {
      var idx = Number(btn.dataset.g);
      EditorGroups.switchGroup(tabs, idx);   // 纯视图索引：草稿（按字段键持有）不受影响
      Array.prototype.forEach.call(el("p-body").querySelectorAll(".gtab"), function (b) {
        b.classList.toggle("on", b === btn);
      });
      Array.prototype.forEach.call(el("p-body").querySelectorAll(".gpane"), function (p) {
        p.hidden = Number(p.dataset.g) !== idx;
      });
      helpHideDom();  // 切组后原字段可能不可见：关掉说明卡，避免悬空
      markDirty();  // 跨组编辑过的字段仍标脏、未保存计数不变
    });
  });
}

function fieldRow(f) {
  // 列表型控件（可增删行表格 / 引用列表）标记为跨列：宽字段独占整行，避免多列表格
  // 被挤在双列网格的右缘（批4 UX）。只按后端 control 判定，框架不认业务字段名。
  var wide = (f.control === "listtable" || f.control === "reflist") ? " wide" : "";
  return '<div class="row' + wide + '" data-field="' + esc(f.key) + '" data-present="'
    + (f.present ? "true" : "false") + '"><div class="rlab">'
    + helpTriggerHtml(f, fieldLabelHtml(f.label, f.key))
    + ' <span class="ftype">' + esc(typeZh(f.type)) + "</span></div>"
    + '<div class="rval">' + fieldBody(f) + fieldHint(f) + "</div></div>";
}

function hintBits(f) {
  // 空值措辞统一走 EMPTY_TEXT，不再另造第二种写法
  // （字段是否写过由 value 的空态与 data-present 表达）。
  var bits = [];
  if (f.hint) { bits.push(esc(f.hint)); }
  return bits;
}

function fieldHint(f) {
  var bits = hintBits(f);
  return bits.length ? '<div class="hint">' + bits.join(" · ") + "</div>" : "";
}

function fieldBody(f) {
  // 只读渲染（非编辑控件 / 只读身份 / 本批只读形态）
  return state.editable && f.editable ? editControl(f) : readonlyValue(f);
}

function readonlyValue(f) {
  var html = fieldValue(f);
  if (!state.editable) { return html; }
  if (!f.editable) { return html + '<div class="hint"><span class="ro">本批只读展示（编辑见后续批次）</span></div>'; }
  return html;
}

// ---------------------------------------------------------------------------
// 编辑控件（只按后端 control 渲染，不认字段类型）
// ---------------------------------------------------------------------------
function currentFieldValue(f) {
  return Object.prototype.hasOwnProperty.call(draft.changes, f.key) ? draft.changes[f.key] : f.value;
}

function editControl(f) {
  var v = currentFieldValue(f);
  switch (f.control) {
    case "textarea":
      return '<textarea class="cta" rows="4" data-key="' + esc(f.key) + '">'
        + esc(v == null ? "" : v) + "</textarea>";
    case "number":
      return '<input class="cin" type="number" step="' + esc(f.number_step || "any")
        + '" data-key="' + esc(f.key) + '" value="' + esc(v == null ? "" : v) + '">';
    case "bool":
      return '<label class="ctl-bool"><input type="checkbox" data-key="' + esc(f.key) + '"'
        + (v ? " checked" : "") + '> <span class="btxt">' + (v ? "是" : "否") + "</span></label>";
    case "select":
      return selectHtml(f.key, v, f.enum || [], "（未选择）", "");
    case "ref":
      return selectHtml(f.key, v, [], "（未选择）",
        ' data-ref="' + esc(f.ref_target || "") + '" data-current="'
        + esc(v == null ? "" : v) + '"')
        + '<span class="refnote" data-refnote="' + esc(f.key) + '"></span>';
    case "listtable":
      return listTableEdit(f);
    case "reflist":
      return refListEdit(f);
    case "text":
    default:
      return '<input class="cin" type="text" data-key="' + esc(f.key) + '" value="'
        + esc(v == null ? "" : v) + '">';
  }
}

/* EDITOR_SELECT_OPTIONS_BEGIN */
function selectOptions(value, options, placeholder) {
  var cur = value == null ? "" : String(value);
  // 候选形态规整（V8 修复）：枚举候选是纯字符串（FieldMeta.enum → ["boss", …]），
  // 引用候选是对象（{id, name}）。此前一律按对象取 o.id/o.name，字符串候选被读成
  // undefined → 候选渲染成空、当前值恒判「不在候选内」。此处按形态归一：
  //   字符串 → 只显示值本身；对象 → 显示「名称（标识）」。
  var rows = (options || []).map(function (o) {
    if (o && typeof o === "object") {
      var oid = o.id == null ? "" : String(o.id);
      return { id: oid, text: (o.name == null ? oid : String(o.name)) + "（" + oid + "）" };
    }
    var sid = o == null ? "" : String(o);
    return { id: sid, text: sid };
  });
  var has = rows.some(function (o) { return o.id === cur; });
  var html = '<option value="">' + esc(placeholder) + "</option>";
  if (cur && !has) {
    html += '<option value="' + esc(cur) + '" selected>' + esc(cur) + "（当前值·不在候选内）</option>";
  }
  rows.forEach(function (o) {
    var selected = o.id === cur ? " selected" : "";
    html += '<option value="' + esc(o.id) + '"' + selected + ">" + esc(o.text) + "</option>";
  });
  return html;
}
/* EDITOR_SELECT_OPTIONS_END */

function selectHtml(key, value, options, placeholder, extraAttrs) {
  return '<select class="cin" data-key="' + esc(key) + '"' + (extraAttrs || "") + ">"
    + selectOptions(value, options, placeholder) + "</select>";
}

function bindControls() {
  var body = el("p-body");
  Array.prototype.forEach.call(body.querySelectorAll("[data-key]"), function (inp) {
    var key = inp.dataset.key;
    var f = state.fieldIndex[key];
    if (!f) { return; }
    var ev = (inp.type === "checkbox" || inp.tagName === "SELECT") ? "change" : "input";
    inp.addEventListener(ev, function () {
      var val = readControl(inp, f);
      EditorDraft.set(draft, key, val, f.value);
      if (inp.type === "checkbox") {
        var t = inp.parentNode.querySelector(".btxt");
        if (t) { t.textContent = inp.checked ? "是" : "否"; }
      }
      if (inp.dataset && inp.dataset.ref) { applyScalarRefWarning(inp); }
      markDirty();
    });
  });
  // 引用字段：异步填候选（显示名称 + 标识；当前值不在候选内也保留）
  var byTarget = {};
  Array.prototype.forEach.call(body.querySelectorAll("select[data-ref]"), function (sel) {
    var t = sel.dataset.ref;
    if (!t) { return; }
    (byTarget[t] = byTarget[t] || []).push(sel);
  });
  Object.keys(byTarget).forEach(function (target) {
    loadRefOptions(target).then(function (opts) {
      byTarget[target].forEach(function (sel) {
        var cur = sel.dataset.current || "";
        sel.innerHTML = selectOptions(cur, opts, "（未选择）");
        sel.value = cur;  // 候选内命中；不在候选时由占位项承载
        applyScalarRefWarning(sel);
      });
    }).catch(function () { /* 候选拉取失败：保留仅当前值，不阻断编辑 */ });
  });
  // 批4：列表（可增删行表格）与引用多选（引用列表）的绑定
  bindListSections(body);
  bindRefListSections(body);
  // 引用列表：候选到位后重画一次（黄提示 + 候选列表）；只拉一次，不在重画里递归拉取。
  var rlByTarget = {};
  Array.prototype.forEach.call(body.querySelectorAll("[data-rlwrap]"), function (wrap) {
    var f = state.fieldIndex[wrap.dataset.rlwrap];
    if (!f) { return; }
    (rlByTarget[f.ref_target] = rlByTarget[f.ref_target] || []).push({ f: f, wrap: wrap });
  });
  Object.keys(rlByTarget).forEach(function (target) {
    loadRefOptions(target).then(function () {
      rlByTarget[target].forEach(function (it) { renderRefListField(it.f, it.wrap); });
    }).catch(function () { /* 候选失败不阻断编辑 */ });
  });
}

// ---------------------------------------------------------------------------
// 批4 · 可增删行表格（列表字段；行内编辑写回草稿，不落盘）
// ---------------------------------------------------------------------------
function listTableBody(f) {
  var rows = currentFieldValue(f);
  if (!Array.isArray(rows)) { rows = []; }
  var cols = f.columns || [];
  var scalar = !!f.scalar_element;
  var html = '<div class="lmeta">列表字段 · ' + rows.length + " 行 · 列名与类型来自内容包元数据"
    + " · 改动先进草稿（不落盘）</div>";
  if (!cols.length) {
    // 元素声明为对象但元数据没给子字段：如实提示、不臆造列名（否则会把对象行改写成
    // {"value": …}）。但仍照常渲染「+ 添加一行」——空列表必须能新建第一行；新行无数据列，
    // 只保留「操作」列可删，避免刚建的行不可见、不可撤销。
    html += '<div class="ex">该列表元素的字段未在内容包元数据中声明，'
      + (rows.length ? "" : "且当前没有数据行可供推断列；")
      + "请先在元数据里声明元素子字段，再回来编辑。</div>";
  }
  if (!rows.length) {
    html += '<div class="ex">（空列表）暂无数据行，用下面的「+ 添加一行」新建。</div>';
  } else {
    html += '<div class="ltable-scroll"><table class="ltable ltable-edit"><thead><tr>'
      + cols.map(function (c) {
        return "<th>" + helpTriggerHtml(c, fieldLabelHtml(c.label, c.key))
          + ' <span class="ftype">' + esc(typeZh(c.type)) + "</span></th>";
      }).join("")
      + '<th class="op">操作</th></tr></thead><tbody>';
    rows.forEach(function (row, i) {
      html += "<tr>" + cols.map(function (c) {
        return "<td>" + listCell(f, row, c, i, scalar) + "</td>";
      }).join("")
        + '<td class="op"><button type="button" class="ldel" data-ldel="' + i
        + '" title="删除本行（只改草稿）">删除</button></td></tr>';
    });
    html += "</tbody></table></div>";
  }
  html += '<button type="button" class="ladd" data-ladd="' + esc(f.key)
    + '" title="按元素元数据的默认值新建一行（只改草稿）">+ 添加一行</button>';
  return html;
}

function listTableEdit(f) {
  return '<div class="lwrap ltable-wrap" data-lwrap="' + esc(f.key) + '">'
    + listTableBody(f) + "</div>";
}

function listCell(f, row, col, i, scalar) {
  var v = EditorList.cellValue(row, col.key, scalar);
  var attrs = ' data-lcell="' + esc(f.key) + '" data-lrow="' + i + '" data-lcol="' + esc(col.key) + '"';
  switch (col.control) {
    case "number":
      return '<input class="cin lcell" type="number" step="' + esc(col.number_step || "any")
        + '" placeholder="' + esc(EMPTY_TEXT) + '"' + attrs
        + ' value="' + esc(v == null ? "" : v) + '">';
    case "bool":
      return '<label class="ctl-bool"><input type="checkbox"' + attrs + (v ? " checked" : "")
        + '> <span class="btxt">' + (v ? "是" : "否") + "</span></label>";
    case "select":
      return '<select class="cin lcell"' + attrs + ">"
        + selectOptions(v, col.enum || [], "（未选择）") + "</select>";
    case "ref":
      return '<select class="cin lcell"' + attrs + ' data-lref="' + esc(col.ref_target || "")
        + '" data-current="' + esc(v == null ? "" : v) + '">'
        + selectOptions(v, [], "（未选择）") + "</select>";
    case "readonly":
    case "listtable":
      // 对象/映射子字段与嵌套列表：本批不在单元格里内联编辑 → 给统一的有框只读外观，
      // 空值同样走 EMPTY_TEXT（不再裸露无边框 JSON 深色块）。
      return '<span class="ro-cell">' + esc(
        (v == null || v === "") ? EMPTY_TEXT
          : (typeof v === "object" ? JSON.stringify(v) : String(v))
      ) + "</span>";
    case "text":
    case "textarea":
    default:
      return '<input class="cin lcell" type="text"' + attrs
        + ' placeholder="' + esc(EMPTY_TEXT) + '" value="'
        + esc(v == null ? "" : v) + '">';
  }
}

function readCellValue(inp, f) {
  if (inp.type === "checkbox") { return !!inp.checked; }
  if (inp.tagName === "SELECT") { return inp.value === "" ? null : inp.value; }
  if (inp.classList.contains("lcell") && inp.type === "number") {
    if (inp.value === "") { return null; }
    var n = Number(inp.value);
    return isNaN(n) ? inp.value : n;
  }
  return inp.value;
}

function rerenderListField(f, wrap) {
  if (!wrap || !f) { return; }
  wrap.innerHTML = listTableBody(f);
  bindListSections(wrap);
  markDirty();
}

function bindListSections(root) {
  Array.prototype.forEach.call(root.querySelectorAll("[data-lcell]"), function (inp) {
    var f = state.fieldIndex[inp.dataset.lcell];
    if (!f) { return; }
    var ev = (inp.type === "checkbox" || inp.tagName === "SELECT") ? "change" : "input";
    inp.addEventListener(ev, function () {
      var rows = currentFieldValue(f);
      if (!Array.isArray(rows)) { rows = []; }
      rows = EditorList.setCell(rows, inp.dataset.lrow, inp.dataset.lcol,
        readCellValue(inp, f), !!f.scalar_element);
      EditorDraft.set(draft, inp.dataset.lcell, rows, f.value);
      if (inp.type === "checkbox") {
        var t = inp.parentNode.querySelector(".btxt");
        if (t) { t.textContent = inp.checked ? "是" : "否"; }
      }
      markDirty();
    });
    if (inp.dataset && inp.dataset.lref) { fillRefSelect(inp, inp.dataset.lref); }
  });
  Array.prototype.forEach.call(root.querySelectorAll("[data-ldel]"), function (btn) {
    btn.addEventListener("click", function () {
      var wrap = btn.closest(".lwrap");
      var f = wrap ? state.fieldIndex[wrap.dataset.lwrap] : null;
      if (!f) { return; }
      var rows = EditorList.delRow(currentFieldValue(f), btn.dataset.ldel);
      EditorDraft.set(draft, f.key, rows, f.value);
      rerenderListField(f, wrap);
    });
  });
  Array.prototype.forEach.call(root.querySelectorAll("[data-ladd]"), function (btn) {
    btn.addEventListener("click", function () {
      var f = state.fieldIndex[btn.dataset.ladd];
      if (!f) { return; }
      var wrap = btn.closest(".lwrap");
      var rows = EditorList.addRow(currentFieldValue(f), f.row_default, !!f.scalar_element);
      EditorDraft.set(draft, f.key, rows, f.value);
      rerenderListField(f, wrap);
    });
  });
}

// 引用下拉（列表单元格 / 标量）：异步填候选；非法值只标黄，不拦编辑。
function fillRefSelect(sel, target) {
  if (!target) { return; }
  loadRefOptions(target).then(function (opts) {
    var cur = sel.dataset.current || "";
    sel.innerHTML = selectOptions(cur, opts, "（未选择）");
    sel.value = cur;
    markRefWarn(sel, target);
  }).catch(function () { /* 候选失败不阻断 */ });
}

function markRefWarn(sel, target) {
  var opts = state.refCache[target] || [];
  var st = EditorRef.status(sel.value === "" ? null : sel.value,
    EditorRef.ids(opts), state.refKnown[target]);
  sel.classList.toggle("warn", st.warn);
  sel.title = st.text || "";
}

function applyScalarRefWarning(sel) {
  var target = sel.dataset.ref;
  var opts = state.refCache[target] || [];
  var st = EditorRef.status(sel.value === "" ? null : sel.value,
    EditorRef.ids(opts), state.refKnown[target]);
  var note = sel.parentNode ? sel.parentNode.querySelector(".refnote") : null;
  if (note) {
    note.innerHTML = st.warn ? '<span class="refwarn">' + esc(st.text) + "</span>" : "";
  }
}

// ---------------------------------------------------------------------------
// 批4 · 引用选择器（多选 / 引用列表；元素为 ref 的 list）
// ---------------------------------------------------------------------------
function refListEdit(f) {
  return '<div class="lwrap reflist-wrap" data-rlwrap="' + esc(f.key) + '">'
    + refListBody(f) + "</div>";
}

function refListBody(f) {
  var values = currentFieldValue(f);
  if (!Array.isArray(values)) { values = []; }
  var target = f.ref_target || "";
  var opts = state.refCache[target] || [];
  var known = state.refKnown[target];
  var html = '<div class="lmeta">引用列表 · 已选 ' + values.length + " 项 · 保存的是目标标识，名称仅用于显示"
    + "</div>";
  html += '<div class="refvals" data-rfvals="' + esc(f.key) + '">';
  html += refValChips(values, opts, known);
  html += "</div>";
  html += '<div class="refsel"><div class="rf-hd"><span class="q">搜索</span>'
    + '<input type="text" class="rf-q" data-refq="' + esc(f.key)
    + '" placeholder="输入名称或标识筛选候选" value="'
    + esc(state.refQuery[f.key] || "") + '">'
    + '<span class="q rf-cnt" data-rfcnt="' + esc(f.key) + '"></span></div>'
    + '<div class="rf-list" data-reflist="' + esc(f.key) + '"></div>'
    + '<div class="rf-ft"><span>点候选项加入；再次点「清除」移除。</span><span class="sp2">'
    + (known === false ? "本包内该引用目标暂无候选" : "") + "</span></div></div>";
  return html;
}

function refValChips(values, opts, known) {
  if (!values.length) { return '<span class="ex">（未选择任何引用）</span>'; }
  return values.map(function (id) {
    var st = EditorRef.status(id, opts, known);
    return '<span class="refval' + (st.warn ? " warn" : "") + '" title="' + esc(st.text) + '">'
      + '<span class="mono2">' + esc(EditorRef.label(id, opts)) + "</span>"
      + (st.warn ? '<span class="refwarn">目标不存在</span>' : "")
      + '<button type="button" class="ldel" data-refdel="' + esc(id) + '">清除</button></span>';
  }).join("");
}

function refCandidateList(f) {
  var target = f.ref_target || "";
  var opts = state.refCache[target] || [];
  var rows = EditorRef.filter(opts, state.refQuery[f.key] || "");
  if (!rows.length) {
    return '<div class="rf-ft" style="border-top:0"><span>'
      + (state.refKnown[target] === false
        ? "本包内该引用目标暂无候选项；可先去目标模块建立条目。"
        : "没有匹配的候选项；换个关键词试试。")
      + "</span></div>";
  }
  return rows.map(function (o) {
    return '<div class="rf-it" data-refpick="' + esc(o.id) + '" data-refpickkey="'
      + esc(f.key) + '" title="加入：' + esc(o.id) + '">' + esc(o.name)
      + '<span class="id2">' + esc(o.id) + "</span></div>";
  }).join("");
}

function renderRefListField(f, wrap) {
  if (!wrap || !f) { return; }
  var scroll = wrap.querySelector(".rf-list");
  var keep = scroll ? scroll.scrollTop : 0;
  wrap.innerHTML = refListBody(f);
  var list = wrap.querySelector(".rf-list");
  if (list) { list.innerHTML = refCandidateList(f); }
  var cnt = wrap.querySelector(".rf-cnt");
  if (cnt) { cnt.textContent = (state.refCache[f.ref_target] || []).length + " 条匹配候选"; }
  if (list) { list.scrollTop = keep; }
  bindRefListSections(wrap);
  markDirty();
}

function bindRefListSections(root) {
  // 候选列表渲染 + 点选绑定（本函数不做候选拉取，避免 re-render ⇄ load 互相触发）
  Array.prototype.forEach.call(root.querySelectorAll("[data-reflist]"), function (box) {
    var f = state.fieldIndex[box.dataset.reflist];
    if (!f) { return; }
    var wrap = box.closest(".reflist-wrap");
    box.innerHTML = refCandidateList(f);
    var cnt = wrap.querySelector(".rf-cnt");
    if (cnt) { cnt.textContent = (state.refCache[f.ref_target] || []).length + " 条匹配候选"; }
    bindRefPicks(box, f, wrap);
  });
  Array.prototype.forEach.call(root.querySelectorAll("[data-refq]"), function (inp) {
    inp.addEventListener("input", function () {
      var key = inp.dataset.refq;
      var f = state.fieldIndex[key];
      if (!f) { return; }
      state.refQuery[key] = inp.value;
      var wrap = inp.closest(".reflist-wrap");
      var box = wrap.querySelector("[data-reflist]");
      if (box) { box.innerHTML = refCandidateList(f); }
      bindRefPicks(box, f, wrap);
    });
  });
  Array.prototype.forEach.call(root.querySelectorAll("[data-refdel]"), function (btn) {
    btn.addEventListener("click", function () {
      var wrap = btn.closest(".reflist-wrap");
      var f = wrap ? state.fieldIndex[wrap.dataset.rlwrap] : null;
      if (!f) { return; }
      var vals = EditorRef.delRef(currentFieldValue(f), btn.dataset.refdel);
      EditorDraft.set(draft, f.key, vals, f.value);
      renderRefListField(f, wrap);
    });
  });
}

function bindRefPicks(box, f, wrap) {
  if (!box) { return; }
  Array.prototype.forEach.call(box.querySelectorAll("[data-refpick]"), function (it) {
    it.addEventListener("click", function () {
      var vals = EditorRef.addRef(currentFieldValue(f), it.dataset.refpick);
      EditorDraft.set(draft, f.key, vals, f.value);
      renderRefListField(f, wrap);
      var q = wrap ? wrap.querySelector(".rf-q") : null;
      if (q) { q.focus(); }   // 连续挑选：重画后把光标放回搜索框
    });
  });
}


function loadRefOptions(target) {
  if (state.refCache[target]) { return Promise.resolve(state.refCache[target]); }
  return api("/api/pack/" + enc(state.pack) + "/refs/" + enc(target)).then(function (d) {
    state.refCache[target] = d.options || [];
    state.refKnown[target] = d.known !== false;  // 目标无候选 → false（黄提示，不红拦）
    return state.refCache[target];
  });
}

function readControl(inp, f) {
  if (inp.type === "checkbox") { return !!inp.checked; }
  if (inp.tagName === "SELECT") { return inp.value === "" ? null : inp.value; }
  if (f.control === "number") {
    if (inp.value === "") { return null; }
    var n = Number(inp.value);
    return isNaN(n) ? inp.value : n;
  }
  return inp.value;
}

// ---------------------------------------------------------------------------
// 校验 / 保存 / 取消 / 回退
// ---------------------------------------------------------------------------
function entryURL(suffix) {
  return "/api/pack/" + enc(state.pack) + "/entry/" + enc(state.module) + "/" + enc(state.entry) + suffix;
}

function setBusy(on) {
  state.busy = !!on;
  markDirty();
  el("btn-rollback").disabled = state.busy || !(state.backup && state.backup.exists && state.editable);
}

function runValidate() {
  var p = EditorDraft.patch(draft);
  if (!Object.keys(p).length) { return Promise.resolve(); }
  setBusy(true);
  return postJSON(entryURL("/validate"), { patch: p }).then(function (res) {
    state.result = res; renderResult(res);
  }).catch(function (err) {
    state.result = { ok: false, message: "校验请求失败：" + err.message, errors: [] };
    renderResult(state.result);
  }).then(function () { setBusy(false); });
}

function runSave() {
  var p = EditorDraft.patch(draft);
  if (!Object.keys(p).length) { return Promise.resolve(); }
  setBusy(true);
  return postJSON(entryURL("/save"), { patch: p }).then(function (res) {
    state.result = res; renderResult(res);
    if (res.ok) { discardDraft(); return reloadDetail(); }
  }).catch(function (err) {
    state.result = { ok: false, message: "保存请求失败：" + err.message, errors: [] };
    renderResult(state.result);
  }).then(function () { setBusy(false); });
}

function runRollback() {
  if (!state.backup || !state.backup.exists) { return Promise.resolve(); }
  if (!window.confirm("确定回退到上一份备份吗？当前文件内容会被备份覆盖。")) { return Promise.resolve(); }
  setBusy(true);
  return postJSON("/api/pack/" + enc(state.pack) + "/module/" + enc(state.module) + "/rollback", {})
    .then(function (res) {
      state.result = res; renderResult(res);
      if (res.ok) { discardDraft(); return reloadDetail(); }
    }).catch(function (err) {
      state.result = { ok: false, message: "回退请求失败：" + err.message, errors: [] };
      renderResult(state.result);
    }).then(function () { setBusy(false); });
}

function renderResult(res) {
  var box = el("result");
  if (!box) { return; }
  if (!res) { box.hidden = true; box.innerHTML = ""; return; }
  var reds = res.errors || [];
  var yellows = res.warnings || [];
  var cls = (reds.length || !res.ok) ? "red" : (yellows.length ? "warn" : "");
  var html = '<div class="vbox ' + cls + '"><div class="vhead">'
    + esc(res.message || (res.ok ? "完成。" : "未通过。")) + "</div>";
  reds.forEach(function (e) { html += vrow(e, "red"); });
  yellows.forEach(function (e) { html += vrow(e, "yellow"); });
  box.innerHTML = html + "</div>";
  box.hidden = false;
}

function vrow(e, cls) {
  var where = [e.module, e.entry_id, e.field_label].filter(function (x) { return !!x; }).join(" · ");
  return '<div class="vrow ' + cls + '"><b>[' + (cls === "red" ? "红拦" : "黄提示") + "]</b> "
    + esc(where) + "：" + esc(e.message || e.code || "")
    + (e.how_to_fix ? '<span class="vfix">怎么改：' + esc(e.how_to_fix) + "</span>" : "")
    + "</div>";
}

// ---------------------------------------------------------------------------
// 只读渲染（列表/对象/映射本批只读；沿用批1 形态）
// ---------------------------------------------------------------------------
function fieldValue(f) {
  switch (f.widget) {
    case "bool":
      return '<div class="inp bool"><span class="box' + (f.value ? " on" : "") + '"></span>'
        + (f.value ? "是" : "否") + "</div>";
    case "number":
    case "formula":
    case "ref":
      return '<div class="inp mono">' + esc(f.display || EMPTY_TEXT) + "</div>";
    case "enum":
      return '<div class="inp">' + esc(f.display || EMPTY_TEXT) + "</div>";
    case "list":
      return listTable(f);
    case "map":
      return kvTable(f);
    case "obj":
      return objTable(f);
    case "text":
    default:
      return textValue(f);
  }
}

function textValue(f) {
  var v = f.display == null ? "" : f.display;
  if (String(v).length > 80 || String(v).indexOf("\n") >= 0) {
    return '<div class="ta">' + esc(v || EMPTY_TEXT) + "</div>";
  }
  return '<div class="inp">' + esc(v || EMPTY_TEXT) + "</div>";
}

function listTable(f) {
  if (!f.value || !f.value.length) { return '<div class="ex">（空列表）</div>'; }
  var cols = f.columns || [];
  var head = "<tr>" + cols.map(function (c) {
    return "<th>" + helpTriggerHtml(c, fieldLabelHtml(c.label, c.key))
      + ' <span class="ftype">' + esc(typeZh(c.type)) + "</span></th>";
  }).join("") + "</tr>";
  var body = (f.rows || []).map(function (row) {
    return "<tr>" + cols.map(function (c) {
      return "<td>" + esc(row[c.key] == null ? "" : row[c.key]) + "</td>";
    }).join("") + "</tr>";
  }).join("");
  var note = '<div class="lmeta">列表字段 · ' + f.row_count + " 行"
    + (f.rows && f.rows.length < f.row_count ? "（只读视图最多显示 " + f.rows.length + " 行）" : "")
    + " · 列名与类型来自内容包元数据</div>";
  return note + '<div class="ltable-scroll"><table class="ltable ltable-ro">'
    + "<thead>" + head + "</thead><tbody>" + body + "</tbody></table></div>";
}

function kvTable(f) {
  if (!f.value || !Object.keys(f.value).length) { return '<div class="ex">（空映射）</div>'; }
  var body = (f.rows || []).map(function (r) {
    return "<tr><td>" + esc(r.key) + "</td><td>" + esc(r.display == null ? "" : r.display) + "</td></tr>";
  }).join("");
  return '<table class="ltable"><thead><tr><th>键</th><th>值</th></tr></thead>'
    + "<tbody>" + body + "</tbody></table>";
}

function objTable(f) {
  var kids = f.children || [];
  if (!kids.length) {
    return '<div class="ta">' + esc(JSON.stringify(f.value, null, 2)) + "</div>";
  }
  return kids.map(function (c) {
    return '<div class="row nest"><div class="rlab">'
      + helpTriggerHtml(c, fieldLabelHtml(c.label, c.key))
      + ' <span class="ftype">' + esc(typeZh(c.type)) + "</span></div>"
      + '<div class="rval">' + fieldValue(c) + "</div></div>";
  }).join("");
}

// ---------------------------------------------------------------------------
// 启动
// ---------------------------------------------------------------------------
el("btn-validate").addEventListener("click", runValidate);
el("btn-save").addEventListener("click", runSave);
el("btn-cancel").addEventListener("click", function () {
  if (!draftCount()) { return; }
  state.result = null; renderResult(null); discardDraft(); reloadDetail();
});
el("btn-rollback").addEventListener("click", runRollback);
el("role").addEventListener("change", function (e) { switchRole(e.target.value); });
el("filter").addEventListener("input", function (e) {
  state.filter = e.target.value; renderEntries();
});
window.addEventListener("beforeunload", function (e) {
  if (EditorDraft.dirty(draft)) { e.preventDefault(); e.returnValue = ""; }
});

loadSession()
  .then(loadPacks)
  .then(loadModules)
  .catch(function (err) { fail("初始化", err); });
</script>
</body>
</html>
