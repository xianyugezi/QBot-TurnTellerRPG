[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qbot-rpg"
version = "0.1.0"
description = "QQ 回合制 RPG 框架（平台无关核心包 qbot_rpg + NoneBot 壳层 commands）"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-asyncio>=0.21", "ruff>=0.5", "mypy>=1.10", "coverage>=7"]  # COV-01（路A）：coverage 真实核算依赖

[tool.setuptools.packages.find]
include = ["qbot_rpg*"]

# ============================================================
# M6 质量门禁 LNT 组（细化_M6_质量门禁 D7 §二）
# ============================================================

[tool.ruff]
# LNT-01：line-length=100 已是护栏，禁全局 ignore E501（D7 §2.3 边界异常）
line-length = 100
target-version = "py39"  # requires-python >=3.9（pyproject L9）
# 规则集起步 E/F 组（D7 LNT-01）；存量豁免见 [tool.ruff.lint.per-file-ignores]（LNT-06，清单 docs/verify/lint_baseline.md）

[tool.ruff.lint]
select = ["E", "F"]

[tool.ruff.lint.per-file-ignores]
# 存量基线豁免（D7 LNT-05/06）：M6 批7·路B 首次扫描（2026-08-28）登记于
# docs/verify/lint_baseline.md；豁免仅限存量，新增代码零豁免；轮换规则 = 随对应文件重构消除。
