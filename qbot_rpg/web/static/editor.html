<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QBot RPG 内容编辑器</title>
<style>
  /* M12 批4 路4B：前端最小可用壳（P-01~P-04 固定视口/左列表右卡片简化版）。
     设计：顶栏（标题/包信息/登出）+ 侧边栏页清单 + 主区（列表/表单）。
     纯原生 JS 零依赖；对接 /api/* 15 端点。
     M12.5 批4 路4C：三形态渲染特化（list 列表 CRUD / object 整对象表单 /
     map 键值编辑）；侧边栏改按 p.group 动态分组。 */
  :root {
    --bg: #0f1115; --panel: #1a1d24; --border: #2a2f3a;
    --text: #d8dee6; --dim: #8b93a1; --accent: #4c8dff;
    --red: #ff5c5c; --yellow: #e8c14c; --green: #3fbf6f;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    font-size: 13px; height: 100vh; overflow: hidden;
  }
  /* 固定视口：顶栏 + 下区（侧边栏 + 主区），无整页滚动（P-01/P-03 简化） */
  #app { display: none; height: 100vh; flex-direction: column; }
  #app.active { display: flex; }
  #topbar {
    height: 40px; display: flex; align-items: center; gap: 12px;
    padding: 0 14px; border-bottom: 1px solid var(--border);
    background: var(--panel); flex-shrink: 0;
  }
  #topbar .title { font-weight: 600; font-size: 14px; }
  #topbar .spacer { flex: 1; }
  #topbar .pkinfo { color: var(--dim); font-size: 12px; }
  #main { flex: 1; display: flex; min-height: 0; }
  #sidebar {
    width: 170px; border-right: 1px solid var(--border); background: var(--panel);
    overflow-y: auto; flex-shrink: 0; padding: 6px 0;
  }
  #sidebar .group {
    font-size: 11px; color: var(--dim); padding: 8px 12px 4px;
    letter-spacing: 1px;
  }
  #sidebar .page {
    display: block; width: 100%; text-align: left; padding: 6px 14px;
    background: none; border: none; color: var(--text); cursor: pointer;
    font-size: 13px;
  }
  #sidebar .page:hover { background: #232833; }
  #sidebar .page.active { background: #263349; color: var(--accent); }
  #sidebar .page.disabled { color: var(--dim); opacity: .5; }
  #content { flex: 1; display: flex; min-width: 0; }
  /* 左列表 + 右编辑卡片（P-02 简化：固定表格内部滚动） */
  #listpane {
    width: 300px; border-right: 1px solid var(--border); display: flex;
    flex-direction: column; min-width: 0;
  }
  #listpane.hidden { display: none; } /* M12.5 批4：object 形态隐藏左栏 */
  #listhead {
    padding: 8px 10px; border-bottom: 1px solid var(--border);
    display: flex; gap: 6px; align-items: center;
  }
  #listhead.hidden { display: none; }
  #listhead input {
    flex: 1; background: #12151c; border: 1px solid var(--border);
    color: var(--text); padding: 4px 8px; border-radius: 4px;
  }
  #listhead #btnAddKey { /* map 形态「+ 新建键」（list 形态的 + 新建条目 btnNew 同款） */
    background: var(--accent); border: none; color: #fff;
    padding: 4px 10px; border-radius: 4px; cursor: pointer;
  }
  #listhead #btnNew { background: var(--accent); border: none; color: #fff;
    padding: 4px 10px; border-radius: 4px; cursor: pointer;
  }
  #listbody { flex: 1; overflow-y: auto; }
  #listbody .row {
    padding: 7px 12px; border-bottom: 1px solid #20242d; cursor: pointer;
    display: flex; justify-content: space-between; gap: 8px;
  }
  #listbody .row:hover { background: #232833; }
  #listbody .row.active { background: #263349; }
  #listbody .row .rid { color: var(--dim); font-size: 11px; }
  /* M12.5 批4 map：键行 = 左键名 + 中值摘要 + 右删除钮 */
  #listbody .mrow { display: flex; align-items: center; }
  #listbody .mrow .mkey { flex: 0 0 auto; font-weight: 600; }
  #listbody .mrow .msum {
    flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap; color: var(--dim); font-size: 11px;
  }
  #listbody .mrow .mdel {
    flex: 0 0 auto; background: none; border: 1px solid var(--border);
    color: var(--red); font-size: 11px; padding: 1px 7px; border-radius: 3px;
    cursor: pointer; visibility: hidden;
  }
  #listbody .mrow:hover .mdel { visibility: visible; }
  #listbody .mrow .mdel:hover { background: #3a2626; }
  #listfoot {
    padding: 6px 10px; border-top: 1px solid var(--border); color: var(--dim);
    display: flex; gap: 8px; font-size: 12px; align-items: center;
  }
  #listfoot.hidden { display: none; }
  #listfoot .spacer { flex: 1; }
  #listfoot button {
    background: none; border: 1px solid var(--border); color: var(--text);
    padding: 2px 8px; border-radius: 4px; cursor: pointer;
  }
  #editpane { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #edithead {
    padding: 8px 14px; border-bottom: 1px solid var(--border);
    display: flex; gap: 8px; align-items: center;
  }
  #edithead .ename { font-weight: 600; font-size: 14px; }
  #edithead .spacer { flex: 1; }
  #edithead button {
    padding: 4px 14px; border-radius: 4px; cursor: pointer; border: none;
  }
  #edithead button.hidden { display: none; }
  #btnSave { background: var(--accent); color: #fff; }
  #btnNew { background: #2d3542; color: var(--text); }
  #btnDel { background: #3a2626; color: #ff8a8a; }
  /* M12.5 批4 map：单键值编辑区（大 JSON 文本域） */
  #mapEdit { padding: 0 16px 10px; }
  #mapEdit .mkeylab { font-size: 12px; color: var(--dim); margin-bottom: 3px; }
  #mapEdit .mkeylab code { color: var(--yellow); }
  #mapEdit textarea, #mapEdit input, #mapEdit select {
    width: 100%; background: #12151c; border: 1px solid var(--border);
    color: var(--text); padding: 5px 8px; border-radius: 4px;
    font-size: 13px;
  }
  #mapEdit textarea { min-height: 220px; resize: vertical; font-family: monospace; }
  #formwrap { flex: 1; overflow-y: auto; padding: 12px 16px; }
  .field { margin-bottom: 10px; }
  .field label {
    display: block; font-size: 12px; color: var(--dim); margin-bottom: 3px;
  }
  .field label .req { color: var(--red); }
  .field input, .field select, .field textarea {
    width: 100%; background: #12151c; border: 1px solid var(--border);
    color: var(--text); padding: 5px 8px; border-radius: 4px;
    font-size: 13px;
  }
  .field textarea { min-height: 64px; resize: vertical; font-family: monospace; }
  .field .hint { font-size: 11px; color: var(--dim); margin-top: 2px; }
  #msgs { padding: 4px 14px; font-size: 12px; max-height: 60px; overflow-y: auto; }
  #msgs .ok { color: var(--green); }
  #msgs .err { color: var(--red); }
  #msgs .warn { color: var(--yellow); }
  /* 登录页 */
  #login {
    height: 100vh; display: flex; align-items: center; justify-content: center;
  }
  #login .card {
    background: var(--panel); border: 1px solid var(--border);
    padding: 28px 34px; border-radius: 8px; width: 320px;
  }
  #login h1 { font-size: 17px; margin-bottom: 16px; text-align: center; }
  #login input {
    width: 100%; background: #12151c; border: 1px solid var(--border);
    color: var(--text); padding: 7px 10px; border-radius: 4px; margin-bottom: 10px;
  }
  #login button {
    width: 100%; background: var(--accent); color: #fff; border: none;
    padding: 8px; border-radius: 4px; cursor: pointer; margin-top: 4px;
  }
  #login .err { color: var(--red); font-size: 12px; text-align: center; margin-top: 8px; }
  #login .hint { color: var(--dim); font-size: 12px; text-align: center; margin-top: 8px; }
  /* 空态 */
  .empty { color: var(--dim); text-align: center; padding: 40px 20px; }
</style>
</head>
<body>

<!-- 登录 -->
<div id="login">
  <div class="card">
    <h1>QBot RPG 内容编辑器</h1>
    <input id="lg_owner" placeholder="机主 QQ" autocomplete="username">
    <input id="lg_pass" type="password" placeholder="密码" autocomplete="current-password">
    <button id="btnLogin">登录</button>
    <div class="err" id="loginErr"></div>
    <div class="hint" id="loginHint"></div>
  </div>
</div>

<!-- 主界面 -->
<div id="app">
  <div id="topbar">
    <span class="title">内容编辑器</span>
    <span class="pkinfo" id="pkInfo"></span>
    <span class="spacer"></span>
    <button id="btnLogout" style="background:none;border:1px solid var(--border);color:var(--text);padding:3px 10px;border-radius:4px;cursor:pointer;">登出</button>
  </div>
  <div id="main">
    <nav id="sidebar"></nav>
    <div id="content">
      <div id="listpane">
        <div id="listhead">
          <input id="search" placeholder="搜索...">
          <input id="searchKey" placeholder="筛选键..." class="hidden" style="flex:1;background:#12151c;border:1px solid var(--border);color:var(--text);padding:4px 8px;border-radius:4px;">
          <button id="btnNew" title="新建">+</button>
          <button id="btnAddKey" title="新建键" class="hidden" style="flex:0 0 auto;">+ 新建键</button>
        </div>
        <div id="listbody"></div>
        <div id="listfoot">
          <span id="pgInfo"></span>
          <span class="spacer"></span>
          <button id="pgPrev">上一页</button>
          <button id="pgNext">下一页</button>
        </div>
      </div>
      <div id="editpane">
        <div id="edithead">
          <span class="ename" id="editName">—</span>
          <span class="spacer"></span>
          <button id="btnSave" class="hidden">保存</button>
          <button id="btnDel" class="hidden">删除</button>
        </div>
        <div id="mapEdit" class="hidden">
          <div class="mkeylab">编辑键 <code id="mapKeyName"></code></div>
          <textarea id="mapValue" placeholder="对象/数组值写 JSON 文本"></textarea>
          <div id="mapScalar" class="hidden"></div>
        </div>
        <div id="formwrap"><div class="empty">选择左侧条目或新建</div></div>
        <div id="msgs"></div>
      </div>
    </div>
  </div>
</div>

<script>
"use strict";
/* M12 批4 路4B 前端最小可用壳：登录 → 页清单 → 列表 → meta 驱动表单 → 保存。
   纯原生 JS 零依赖；全部走 /api 端点 + Bearer token。 */
(function () {
  var TOKEN = localStorage.getItem("editor_token") || "";
  var state = { page: null, items: [], meta: null, cur: null, isNew: false,
                pageNo: 1, size: 50, total: 0, pages: [] };

  var $ = function (id) { return document.getElementById(id); };

  /* ---------- API 调用 ---------- */
  function api(method, path, body) {
    var headers = { "Content-Type": "application/json" };
    if (TOKEN) headers["Authorization"] = "Bearer " + TOKEN;
    return fetch(path, { method: method, headers: headers,
                         body: body ? JSON.stringify(body) : undefined })
      .then(function (r) { return r.json().catch(function () { return {}; })
          .then(function (j) {
            j._status = r.status;
            // FastAPI HTTPException 把 detail 包在 {"detail": {...}}——
            // 解包让错误处理统一读 j.errors/j.ok（UI 检查修复 2026-09-03）
            if (j.detail && typeof j.detail === "object" && !j.ok) {
              var d = j.detail;
              d._status = j._status;
              return d;
            }
            return j;
          }); });
  }

  function msg(text, cls) {
    var m = $("msgs");
    var div = document.createElement("div");
    div.className = cls || "err";
    div.textContent = text;
    m.appendChild(div);
    while (m.children.length > 6) m.removeChild(m.firstChild);
  }

  /* ---------- 登录 ---------- */
  function showApp() {
    $("login").style.display = "none";
    $("app").classList.add("active");
    loadPackInfo();
    loadPages();
  }
  function showLogin(errText) {
    $("app").classList.remove("active");
    $("login").style.display = "flex";
    $("loginErr").textContent = errText || "";
    if (!TOKEN) $("loginHint").textContent = "首次使用请先设置密码（机主 QQ + 新密码）";
    else $("loginHint").textContent = "";
  }
  $("btnLogin").addEventListener("click", function () {
    var owner = $("lg_owner").value.trim();
    var pass = $("lg_pass").value;
    if (!owner || !pass) { $("loginErr").textContent = "请输入机主 QQ 与密码"; return; }
    api("POST", "/api/auth/login", { qq_id: owner, password: pass })
      .then(function (j) {
        if (j.ok && j.data && j.data.token) {
          TOKEN = j.data.token;
          localStorage.setItem("editor_token", TOKEN);
          showApp();
        } else {
          // 428 = 未设密 → 自动转首次设密（同表单二次提交；UI 检查修复
          // 2026-09-03：原判断 errs 含「未设置」永不命中——后端未设密
          // 返回 wrong_password 导致 setup 引导断链）
          if (j._status === 428) {
            setupOwner(owner, pass);
          } else {
            var errs = (j.errors || []).map(function (e) { return e.message; }).join("；");
            $("loginErr").textContent = errs || ("登录失败（" + j._status + "）");
            if (j._status === 423) {
              $("loginHint").textContent = "失败次数过多，已锁定 15 分钟";
            }
          }
        }
      }).catch(function (e) { $("loginErr").textContent = "网络错误：" + e; });
  });
  function setupOwner(owner, pass) {
    api("POST", "/api/auth/setup", { qq_id: owner, password: pass })
      .then(function (j) {
        if (j.ok) {
          // 设密成功 → 自动登录（用户刚输过密码，无需二次输入；UI 检查优化）
          api("POST", "/api/auth/login", { qq_id: owner, password: pass })
            .then(function (lj) {
              if (lj.ok && lj.data && lj.data.token) {
                TOKEN = lj.data.token;
                localStorage.setItem("editor_token", TOKEN);
                showApp();
              } else {
                $("loginHint").textContent = "密码已设置，请重新登录";
                $("loginErr").textContent = "";
              }
            });
        } else {
          var errs = (j.errors || []).map(function (e) { return e.message; }).join("；");
          $("loginErr").textContent = errs || "设置失败";
          // 弱密码提示
          if (j._status === 400) $("loginHint").textContent = "密码需 ≥8 位且含字母和数字";
        }
      });
  }
  $("btnLogout").addEventListener("click", function () {
    api("POST", "/api/auth/logout").then(function () {
      TOKEN = "";
      localStorage.removeItem("editor_token");
      showLogin("已登出");
    });
  });

  /* ---------- 数据包信息 / 页清单 ---------- */
  function loadPackInfo() {
    api("GET", "/api/packs").then(function (j) {
      if (j.ok && j.data) {
        var a = j.data.active || {};
        var name = a.pack_id || a.name || "";
        $("pkInfo").textContent = "包：" + name + "  gen:" + (j.data.generation || 0);
      }
    });
  }
  function loadPages() {
    api("GET", "/api/editor/pages").then(function (j) {
      if (j.ok && j.data && j.data.pages) {
        state.pages = j.data.pages;
        renderSidebar();
        if (state.pages.length) selectPage(state.pages[0].page_id);
      } else if (j._status === 401) {
        TOKEN = ""; localStorage.removeItem("editor_token"); showLogin("登录已失效");
      }
    });
  }
  function renderSidebar() {
    var sb = $("sidebar");
    sb.innerHTML = "";
    // M12.5 批4 路4C：分组按 p.group 动态（缺省 None → 「未分组」）。
    // 保留 enabled 语义：禁用页置灰仍可点开查看（disabled 只置灰不拦点击）。
    // 组序 = 页清单首次出现顺序；组内序 = 声明序。
    var groups = [];
    function groupOf(name) {
      for (var i = 0; i < groups.length; i++) {
        if (groups[i].name === name) return groups[i];
      }
      var g = { name: name, el: null };
      groups.push(g);
      return g;
    }
    state.pages.forEach(function (p) {
      var g = groupOf(p.group || "未分组");
      if (!g.el) {
        var h = document.createElement("div");
        h.className = "group"; h.textContent = g.name;
        sb.appendChild(h); g.el = h;
      }
      var b = document.createElement("button");
      b.className = "page" + (p.enabled ? "" : " disabled");
      b.dataset.page = p.page_id;
      b.textContent = (p.icon || "") + " " + p.title;
      b.addEventListener("click", function () { selectPage(p.page_id); });
      sb.appendChild(b);
    });
  }

  /* ---------- 页面选择 → 形态分支 ---------- */
  function pageKind() {
    // meta 未到前先读页清单登记值；meta 到后以 meta.page_kind 为准（后端
    // 归一 list/map/object）；两者皆无 → 缺省 list（现行为默认形态）
    if (state.meta && state.meta.page_kind) return state.meta.page_kind;
    var p = null;
    for (var i = 0; i < state.pages.length; i++) {
      if (state.pages[i].page_id === state.page) { p = state.pages[i]; break; }
    }
    return (p && p.page_kind) || "list";
  }
  function selectPage(pageId) {
    state.page = pageId;
    state.pageNo = 1; state.cur = null; state.isNew = false;
    state.kind = null; state.whole = null; state.curKey = null;
    state.meta = null;  // 切页清 meta，防旧页 meta 误配新页表单（路4C 竞态）
    // M12.5 批4 路4C：按形态走不同数据流——meta 先到即知形态；
    // 页清单登记 page_kind 可先行（obj/map 不等 meta 直接拉 whole）
    var kind = pageKind();
    if (kind === "object" || kind === "map") {
      uiMode(kind);
      loadWhole();
      loadMeta(pageId);
      return;
    }
    uiMode("list");
    loadMeta(pageId);
    loadList(pageId, 1);
    $("editName").textContent = "—";
    $("formwrap").innerHTML = '<div class="empty">加载中...</div>';
  }
  function loadMeta(pageId) {
    api("GET", "/api/meta/" + pageId).then(function (j) {
      if (j.ok && j.data) {
        state.meta = j.data;
        if (state.cur) renderForm();
      } else if (j._status !== 404) {
        state.meta = null;
      }
    });
  }
  /* ---------- M12.5 批4 路4C：obj/map 形态整模块读写 ---------- */
  function loadWhole() {
    // GET /api/pages/{page}/whole → data = {ok, module, shape, data}
    api("GET", "/api/pages/" + state.page + "/whole").then(function (j) {
      if (j.ok && j.data) {
        var shape = j.data.shape || pageKind();
        state.whole = (j.data.data && typeof j.data.data === "object") ? j.data.data : {};
        if (shape === "map") {
          if (!state.kind) { state.kind = "map"; uiMode("map"); }
          renderMapKeys();
          if (state.curKey) openMapKey(state.curKey, true);
          else $("formwrap").innerHTML = '<div class="empty">点击左侧键名编辑；「+ 新建键」添加</div>';
        } else {
          // object：整对象编辑（含无 meta.fields 的 __raw__ 兜底）
          state.kind = "object";
          if (state.meta && state.meta.page_kind !== "object") {
            state.meta = null;  // meta 竞态兜底：whole 已到而 meta 是旧页
            loadMeta(state.page);
          }
          state.cur = state.whole; state.isNew = false;
          $("btnSave").classList.remove("hidden");
          $("btnDel").classList.add("hidden");
          renderObjForm();
        }
      } else if (j._status === 401) {
        TOKEN = ""; localStorage.removeItem("editor_token"); showLogin("登录已失效");
      } else {
        var errs = (j.errors || []).map(function (e) { return e.message; }).join("；");
        state.whole = null;
        $("formwrap").innerHTML = '<div class="empty">' + (errs || "整模块加载失败") + "</div>";
      }
    });
  }
  function openMapKey(key, skipListRedraw) {
    if (!state.whole || key == null) return;
    state.curKey = key;
    // 值从本地 whole 快照取（map 键空间小、单键 PUT 后已重拉，本地即权威）
    var val = state.whole[key];
    var isObj = (val !== null && typeof val === "object");
    $("mapEdit").classList.remove("hidden");
    $("formwrap").classList.add("hidden");
    $("btnSave").classList.remove("hidden");
    $("btnDel").classList.remove("hidden");
    $("mapKeyName").textContent = key;
    $("editName").textContent = key + "（键值）";
    var ta = $("mapValue");
    if (isObj) {
      ta.style.display = "";
      $("mapScalar").classList.add("hidden");
      try { ta.value = JSON.stringify(val, null, 2); } catch (e) { ta.value = String(val); }
    } else {
      ta.style.display = "none";
      $("mapScalar").classList.remove("hidden");
      var inp = $("mapScalar");
      // 复用输入框：类型切换时重建以正确换控件（select for bool）
      inp.innerHTML = "";
      var ctl;
      if (typeof val === "boolean") {
        ctl = document.createElement("select");
        [["", "（空）"], ["true", "true"], ["false", "false"]].forEach(function (pair) {
          var o = document.createElement("option");
          o.value = pair[0]; o.textContent = pair[1];
          ctl.appendChild(o);
        });
        ctl.value = (val === true || val === false) ? String(val) : "";
      } else if (typeof val === "number") {
        ctl = document.createElement("input");
        ctl.type = "number";
        ctl.value = String(val);
      } else {
        ctl = document.createElement("input");
        ctl.type = "text";
        ctl.value = (val === undefined || val === null) ? "" : String(val);
      }
      inp.appendChild(ctl);
    }
    if (!skipListRedraw) renderMapKeys();
  }
  /* ---------- 列表（list 形态既有流程） ---------- */
  function loadList(pageId, pageNo) {
    var q = $("search").value.trim();
    var url = "/api/pages/" + pageId + "?page_no=" + pageNo + "&size=" + state.size +
              (q ? "&q=" + encodeURIComponent(q) : "");
    api("GET", url).then(function (j) {
      if (j.ok && j.data) {
        state.items = (j.data.items || []).slice(0, state.size);
        state.total = j.data.total || state.items.length;
        state.pageNo = pageNo;
        renderList();
      } else if (j._status === 401) {
        TOKEN = ""; localStorage.removeItem("editor_token"); showLogin("登录已失效");
      } else {
        var errs = (j.errors || []).map(function (e) { return e.message; }).join("；");
        $("listbody").innerHTML = '<div class="empty">' + (errs || "列表加载失败") + "</div>";
      }
    });
  }
  function renderList() {
    var lb = $("listbody");
    lb.innerHTML = "";
    if (!state.items.length) {
      lb.innerHTML = '<div class="empty">（空）点击 + 新建</div>';
    }
    state.items.forEach(function (it) {
      var row = document.createElement("div");
      row.className = "row" + (state.cur && state.cur.id === it.id ? " active" : "");
      var name = it.name || it.id || "?";
      var left = document.createElement("span"); left.textContent = name;
      var right = document.createElement("span"); right.className = "rid";
      right.textContent = it.id || "";
      row.appendChild(left); row.appendChild(right);
      row.addEventListener("click", function () { openItem(it.id); });
      lb.appendChild(row);
    });
    var totalPages = Math.max(1, Math.ceil(state.total / state.size));
    $("pgInfo").textContent = "第 " + state.pageNo + "/" + totalPages + " 页 · 共 " + state.total;
    $("pgPrev").disabled = state.pageNo <= 1;
    $("pgNext").disabled = state.pageNo >= totalPages;
  }
  $("pgPrev").addEventListener("click", function () {
    if (state.page && state.pageNo > 1) loadList(state.page, state.pageNo - 1);
  });
  $("pgNext").addEventListener("click", function () {
    if (state.page) loadList(state.page, state.pageNo + 1);
  });
  var searchTimer = null;
  $("search").addEventListener("input", function () {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(function () {
      if (state.page) { state.pageNo = 1; loadList(state.page, 1); }
    }, 350);
  });

  function uiMode(kind) {
    // 三形态布局切换：list = 左列表全要素（搜索/新建/分页）；object =
    // 隐藏左栏（单对象整页表单）；map = 左键列表（键筛选/新建键/键删除）
    var isList = kind === "list";
    var isMap = kind === "map";
    state.kind = kind;
    $("listpane").classList.toggle("hidden", !isList && !isMap);
    $("listhead").classList.toggle("hidden", !isList && !isMap);
    $("search").classList.toggle("hidden", !isList);
    $("btnNew").classList.toggle("hidden", !isList);
    $("searchKey").classList.toggle("hidden", !isMap);
    $("btnAddKey").classList.toggle("hidden", !isMap);
    $("listfoot").classList.toggle("hidden", !isList);
    $("btnSave").classList.add("hidden");
    $("btnDel").classList.add("hidden");
    $("mapEdit").classList.add("hidden");
    $("mapScalar").classList.add("hidden");
    $("formwrap").classList.remove("hidden");
    if (isList) {
      $("mapValue").style.display = "";
      $("formwrap").innerHTML = '<div class="empty">选择左侧条目或新建</div>';
    }
  }
  function mapKeyFilter() {
    // 新建键名合法性预检（键值空间约束前端先行提示——最终以服务端为准）
    if (state.kind !== "map" || !state.whole) return;
    var k = prompt("新键名（唯一；已存在则打开编辑）：", "");
    if (k === null) return;
    k = String(k).trim();
    if (!k) { msg("键名不能为空", "err"); return; }
    if (Object.prototype.hasOwnProperty.call(state.whole, k)) {
      msg("键已存在，直接打开编辑", "warn");
      openMapKey(k);
      return;
    }
    // 空串值兜底开局（用户随后在编辑区填值再保存）
    state.whole[k] = "";
    state.curKey = k;
    renderMapKeys();
    openMapKey(k);
  }
  function mapSummary(v) {
    // 键行摘要：obj/array → JSON 压缩（截 60）；标量 → 原文
    if (v === null) return "null";
    if (typeof v === "object") {
      var s;
      try { s = JSON.stringify(v); } catch (e) { s = String(v); }
      if (s.length > 60) s = s.slice(0, 60) + "…";
      return s;
    }
    return String(v);
  }
  function renderMapKeys() {
    var lb = $("listbody");
    lb.innerHTML = "";
    var q = $("searchKey").value.trim();
    var keys = [];
    for (var k in state.whole) {
      if (Object.prototype.hasOwnProperty.call(state.whole, k)) {
        if (!q || String(k).indexOf(q) >= 0) keys.push(k);
      }
    }
    keys.sort();
    if (!keys.length) {
      lb.innerHTML = '<div class="empty">' + (q ? "无匹配键" : "（空）点「+ 新建键」") + "</div>";
    }
    keys.forEach(function (k) {
      var row = document.createElement("div");
      row.className = "row mrow" + (state.curKey === k ? " active" : "");
      var lk = document.createElement("span");
      lk.className = "mkey"; lk.textContent = k;
      var sum = document.createElement("span");
      sum.className = "msum"; sum.textContent = mapSummary(state.whole[k]);
      var del = document.createElement("button");
      del.className = "mdel"; del.textContent = "删";
      del.title = "删除键 " + k;
      del.addEventListener("click", function (ev) {
        ev.stopPropagation();
        delMapKeyRow(k);
      });
      row.appendChild(lk); row.appendChild(sum); row.appendChild(del);
      row.addEventListener("click", function () { openMapKey(k); });
      lb.appendChild(row);
    });
  }
  $("searchKey").addEventListener("input", function () {
    if (state.kind === "map") renderMapKeys();
  });
  $("btnAddKey").addEventListener("click", mapKeyFilter);
  function renderObjForm() {
    // object 形态整对象表单：渲染 meta.fields（renderFields 通用）+ __raw__ 兜底
    $("editName").textContent = state.page + "（整对象）";
    var fw = $("formwrap");
    fw.innerHTML = "";
    var fields = (state.meta && state.meta.fields) || [];
    if (!fields.length) {
      fw.innerHTML = '<div class="empty">该页暂无字段元数据——可展开下方原始 JSON 编辑</div>';
    }
    renderFields(fw, state.cur || {}, fields);
    // 原始 JSON 折叠区（字段元数据缺失/扩展字段兜底查看）
    var pre = document.createElement("details");
    var sum = document.createElement("summary");
    sum.textContent = "原始 JSON（仅高级编辑；改动才覆盖表单）";
    pre.appendChild(sum);
    var ta = document.createElement("textarea");
    ta.style.minHeight = "200px"; ta.dataset.field = "__raw__";
    var rawInit = JSON.stringify(state.cur || {}, null, 2);
    ta.value = rawInit;
    ta._rawInit = rawInit;
    ta.addEventListener("input", function () {
      ta._rawDirty = (ta.value !== ta._rawInit);
    });
    pre.appendChild(ta);
    fw.appendChild(pre);
  }
  /* ---------- 条目打开 / 新建 / 表单 ---------- */
  function openItem(id) {
    api("GET", "/api/pages/" + state.page + "/" + encodeURIComponent(id))
      .then(function (j) {
        if (j.ok && j.data && j.data.item) {
          state.cur = j.data.item; state.isNew = false;
          renderForm();
        }
      });
  }
  $("btnNew").addEventListener("click", function () {
    if (!state.page) return;
    state.cur = { id: "", name: "" };
    state.isNew = true;
    renderForm();
  });
  function fieldValue(it, name, f) {
    var v = it[name];
    if (v === undefined || v === null) return "";
    if (f && f.type === "list") return JSON.stringify(v);
    if (typeof v === "object") return JSON.stringify(v);
    return v;
  }
  function renderFields(container, data, fields) {
    // M12.5 批4 路4C：renderForm 字段渲染抽出的通用函数（list 条目表单 /
    // object 整对象表单共用）——按 field type 渲染 input/select/textarea JSON
    container.appendChild(makeRawDetails(data));
    fields.forEach(function (f) {
      var div = document.createElement("div");
      div.className = "field";
      var lab = document.createElement("label");
      lab.innerHTML = (f.label || f.name) +
        (f.required ? ' <span class="req">*</span>' : "") +
        ' <span style="opacity:.6">[' + f.type + "]</span>";
      var input;
      if (f.type === "select" || (f.enum && f.enum.length)) {
        input = document.createElement("select");
        var opt0 = document.createElement("option"); opt0.value = ""; opt0.textContent = "（空）";
        input.appendChild(opt0);
        (f.enum || []).forEach(function (e) {
          var o = document.createElement("option");
          o.value = e; o.textContent = e;
          input.appendChild(o);
        });
        // 数据值不在枚举（内容-元数据不一致）→ 动态追加原值选项，
        // 防 select 空选导致保存时静默清空该字段（UI 检查修复 2026-09-03）
        input._enumValues = (f.enum || []).slice();
      } else if (f.type === "list" || f.type === "object") {
        input = document.createElement("textarea");
        input.dataset.json = "1";
      } else if (f.type === "number") {
        input = document.createElement("input");
        input.type = "number";
      } else if (f.type === "boolean") {
        input = document.createElement("select");
        ["", "true", "false"].forEach(function (v) {
          var o = document.createElement("option");
          o.value = v; o.textContent = v === "" ? "（空）" : v;
          input.appendChild(o);
        });
      } else {
        input = document.createElement("input");
        input.type = "text";
      }
      input.dataset.field = f.name;
      var fv = fieldValue(data, f.name, f);
      if (input.tagName === "SELECT" && fv !== "" && input._enumValues &&
          input._enumValues.indexOf(fv) < 0) {
        // 原值不在枚举 → 追加「原值（未登记）」选项并选中（防静默清空）
        var keep = document.createElement("option");
        keep.value = fv; keep.textContent = fv + "（未登记）";
        input.appendChild(keep);
      }
      input.value = fv;
      div.appendChild(lab);
      div.appendChild(input);
      if (f.ref_target) {
        var hint = document.createElement("div");
        hint.className = "hint"; hint.textContent = "引用：" + f.ref_target;
        div.appendChild(hint);
      }
      container.appendChild(div);
    });
  }
  function makeRawDetails(data) {
    // 原始 JSON 折叠区构造（__raw__ 兜底：字段元数据缺失/扩展字段查看；
    // 改动才覆盖表单——UI 检查修复 2026-09-03：防旧快照吞字段修改）
    var pre = document.createElement("details");
    var sum = document.createElement("summary");
    sum.textContent = "原始 JSON（仅高级编辑；改动才覆盖表单）";
    pre.appendChild(sum);
    var ta = document.createElement("textarea");
    ta.style.minHeight = "200px"; ta.dataset.field = "__raw__";
    var rawInit = JSON.stringify(data, null, 2);
    ta.value = rawInit;
    ta._rawInit = rawInit;
    ta.addEventListener("input", function () {
      ta._rawDirty = (ta.value !== ta._rawInit);
    });
    pre.appendChild(ta);
    return pre;
  }
  function renderForm() {
    if (!state.cur) return;
    $("editName").textContent = (state.isNew ? "新建 · " : "") +
      (state.cur.name || state.cur.id || "未命名");
    var fw = $("formwrap");
    fw.innerHTML = "";
    var fields = (state.meta && state.meta.fields) || [];
    if (!fields.length) {
      fw.innerHTML = '<div class="empty">该页暂无字段元数据（field_meta 未注入）——可查看原始 JSON</div>';
    }
    renderFields(fw, state.cur, fields);
  }
  function collectForm() {
    if (!state.meta) return Object.assign({}, state.cur);
    var out = {};
    document.querySelectorAll("#formwrap [data-field]").forEach(function (el) {
      var name = el.dataset.field;
      if (name === "__raw__") return;
      var v = el.value;
      if (el.dataset.json) {
        try { out[name] = v.trim() ? JSON.parse(v) : undefined; }
        catch (e) { msg("字段 " + name + " JSON 解析失败：" + e.message, "err"); }
      } else if (el.type === "number") {
        out[name] = v === "" ? undefined : Number(v);
      } else {
        out[name] = v;
      }
    });
    // 原始 JSON 覆盖（仅用户实际改动过 raw 区才覆盖表单收集——UI 检查修复）
    var raw = document.querySelector('#formwrap [data-field="__raw__"]');
    if (raw && raw._rawDirty) {
      try { out = JSON.parse(raw.value); } catch (e) { /* 忽略原始区语法错 */ }
    }
    return out;
  }

  /* ---------- 保存 / 删除 ---------- */
  function saveObj() {
    // object 整对象保存：collectForm 收集顶层 dict → PUT /whole
    var body = collectForm();
    api("PUT", "/api/pages/" + state.page + "/whole", body).then(function (j) {
      if (j.ok) {
        msg("已保存 " + state.page, "ok");
        loadWhole();
      } else if (j._status === 409) {
        msg("版本冲突：内容已被他人修改，请刷新后重试", "err");
      } else {
        var errs = (j.errors || []).map(function (e) { return e.message; }).join("；");
        msg(errs || "保存失败", "err");
      }
    });
  }
  function saveMapKey() {
    // map 单键保存：按控件类型收集值 → PUT /map/{key} body {value}
    if (!state.curKey) return;
    var ta = $("mapValue");
    var scalar = $("mapScalar");
    var ctl = scalar.querySelector("input,select");
    var value;
    if (ta.style.display !== "none") {
      var text = ta.value.trim();
      if (!text) {
        msg("值不能为空 JSON", "err");
        return;
      }
      try { value = JSON.parse(text); }
      catch (e) { msg("值 JSON 解析失败：" + e.message, "err"); return; }
    } else if (ctl && ctl.type === "number") {
      value = ctl.value === "" ? "" : Number(ctl.value);
    } else if (ctl && ctl.tagName === "SELECT") {
      value = ctl.value === "" ? "" : (ctl.value === "true");
    } else {
      value = ctl ? ctl.value : "";
    }
    api("PUT", "/api/pages/" + state.page + "/map/" + encodeURIComponent(state.curKey),
        { value: value }).then(function (j) {
      if (j.ok) {
        msg("已保存键 " + state.curKey, "ok");
        state.whole[state.curKey] = value;
        renderMapKeys();
      } else if (j._status === 409) {
        msg("版本冲突：内容已被他人修改，请刷新后重试", "err");
      } else {
        var errs = (j.errors || []).map(function (e) { return e.message; }).join("；");
        msg(errs || "保存失败", "err");
      }
    });
  }
  function onSave() {
    if (!state.page) return;
    if (state.kind === "object") { saveObj(); return; }
    if (state.kind === "map") { saveMapKey(); return; }
    if (!state.cur) return;
    var body = collectForm();
    if (state.isNew) {
      // 用户手填 id → 保留（后端查重）；空 id → 删除触发自动生成 类型_序号
      // （UI 检查修复 2026-09-03：原无条件 delete body.id → 手填 id 被覆盖）
      if (!body.id || !String(body.id).trim()) delete body.id;
      api("POST", "/api/pages/" + state.page, body).then(function (j) {
        if (j.ok) {
          msg("已保存 " + (j.data.item && j.data.item.id), "ok");
          state.isNew = false;
          loadList(state.page, 1);
          if (j.data.item) openItem(j.data.item.id);
        } else {
          var errs = (j.errors || []).map(function (e) { return e.message; }).join("；");
          msg(errs || "保存失败", "err");
        }
      });
    } else {
      body.base_version = state.cur._version || 0;
      api("PUT", "/api/pages/" + state.page + "/" + encodeURIComponent(state.cur.id), body)
        .then(function (j) {
          if (j.ok) {
            msg("已保存 " + state.cur.id, "ok");
            loadList(state.page, state.pageNo);
          } else if (j._status === 409) {
            msg("版本冲突：条目已被他人修改，请刷新后重试", "err");
          } else {
            var errs = (j.errors || []).map(function (e) { return e.message; }).join("；");
            msg(errs || "保存失败", "err");
          }
        });
    }
  }
  function onDel() {
    if (!state.page) return;
    if (state.kind === "map") {
      // map 删除当前选中键（行内「删」按钮同路径；btnDel 复用）
      if (!state.curKey) return;
      delMapKeyRow(state.curKey);
      return;
    }
    if (state.kind === "object") {
      // object 形态无删除（整对象不删）
      msg("整对象页不支持删除", "warn");
      return;
    }
    if (!state.cur || state.isNew) return;
    if (!confirm("确定删除 " + state.cur.id + "？（级联清理引用）")) return;
    api("DELETE", "/api/pages/" + state.page + "/" + encodeURIComponent(state.cur.id))
      .then(function (j) {
        if (j.ok) {
          msg("已删除 " + state.cur.id, "ok");
          state.cur = null;
          loadList(state.page, 1);
          $("editName").textContent = "—";
          $("formwrap").innerHTML = '<div class="empty">选择左侧条目或新建</div>';
        } else {
          var errs = (j.errors || []).map(function (e) { return e.message; }).join("；");
          msg(errs || "删除失败", "err");
        }
      });
  }
  /* map 键值行内删除（renderMapKeys 键行「删」按钮独立路径；行删除后
     重拉 whole 而非本地 splice——单键写盘后键序/键集以服务端为准） */
  function delMapKeyRow(k) {
    if (!k) return;  // 空键守卫（M12.5 批4 清理重复定义后保留）
    if (!confirm("确定删除键 " + k + " ？")) return;
    api("DELETE", "/api/pages/" + state.page + "/map/" + encodeURIComponent(k))
      .then(function (dj) {
        if (dj.ok) {
          msg("已删除键 " + k, "ok");
          if (state.curKey === k) {
            state.curKey = null;
            $("mapEdit").classList.add("hidden");
            $("mapScalar").classList.add("hidden");
            $("btnSave").classList.add("hidden");
            $("btnDel").classList.add("hidden");
            $("formwrap").classList.remove("hidden");
            $("editName").textContent = state.page;
            $("formwrap").innerHTML = '<div class="empty">点击左侧键名编辑；「+ 新建键」添加</div>';
          }
          loadWhole();
        } else {
          var errs = (dj.errors || []).map(function (e) { return e.message; }).join("；");
          msg(errs || "删除失败", "err");
        }
      });
  }
  $("btnSave").addEventListener("click", onSave);
  $("btnDel").addEventListener("click", onDel);

  /* ---------- 启动 ---------- */
  if (TOKEN) {
    // 验证 token：me 成功 → 主界面；失败 → 登录
    api("GET", "/api/auth/me").then(function (j) {
      if (j.ok) showApp();
      else { TOKEN = ""; localStorage.removeItem("editor_token"); showLogin("登录已失效，请重新登录"); }
    });
  } else {
    showLogin("");
  }
})();
</script>
</body>
</html>
