        ' data-ref="' + esc(f.ref_target || "") + '" data-current="'
        + esc(v == null ? "" : v) + '"')
        + '<span class="refnote" data-refnote="' + esc(f.key) + '"></span>';
    case "listtable":
      return listTableEdit(f);
    case "reflist":
      return refListEdit(f);
    case "condition":
      return '<div class="cond-edit" data-condfield="' + esc(f.key) + '">'
        + condFieldInner(f, v) + "</div>";
    case "maptable":
      return '<div class="map-edit" data-mapfield="' + esc(f.key) + '">'
        + mapFieldInner(f, v) + "</div>";
    case "text":
    default:
      return '<input class="cin" type="text" data-key="' + esc(f.key)
        + '" placeholder="' + esc(INPUT_EMPTY) + '" value="'
        + esc(v == null ? "" : v) + '">';
  }
}

/* EDITOR_SELECT_OPTIONS_BEGIN */
function selectOptions(value, options, placeholder) {
  var cur = value == null ? "" : String(value);
  // 候选形态规整（V8 修复）：枚举候选是纯字符串（FieldMeta.enum → ["boss", …]），
  // 引用候选是对象（{id, name}）。此前一律按对象取 o.id/o.name，字符串候选被读成
  // undefined → 候选渲染成空、当前值恒判「不在候选内」。此处按形态归一：
  //   字符串 → 只显示值本身；对象 → 显示「名称（标识）」。
  var rows = (options || []).map(function (o) {
    if (o && typeof o === "object") {
      var oid = o.id == null ? "" : String(o.id);
      return { id: oid, text: (o.name == null ? oid : String(o.name)) + "（" + oid + "）" };
    }
    var sid = o == null ? "" : String(o);
    return { id: sid, text: sid };
  });
  var has = rows.some(function (o) { return o.id === cur; });
  var html = '<option value="">' + esc(placeholder) + "</option>";
  if (cur && !has) {
    html += '<option value="' + esc(cur) + '" selected>' + esc(cur) + "（当前值·不在候选内）</option>";
  }
  rows.forEach(function (o) {
    var selected = o.id === cur ? " selected" : "";
    html += '<option value="' + esc(o.id) + '"' + selected + ">" + esc(o.text) + "</option>";
  });
  return html;
}
/* EDITOR_SELECT_OPTIONS_END */

function selectHtml(key, value, options, placeholder, extraAttrs) {
  return '<select class="cin" data-key="' + esc(key) + '"' + (extraAttrs || "") + ">"
    + selectOptions(value, options, placeholder) + "</select>";
}

function bindControls() {
  var body = el("p-body");
  Array.prototype.forEach.call(body.querySelectorAll("[data-key]"), function (inp) {
    var key = inp.dataset.key;
    var ctx = ctxFromNode(inp);
    var f = ctx.fieldIndex[key];
    if (!f) { return; }
    var ev = (inp.type === "checkbox" || inp.tagName === "SELECT") ? "change" : "input";
    inp.addEventListener(ev, function () {
      var val = readControl(inp, f);
      EditorDraft.set(ctx.draft, key, val, f.value);
      if (inp.type === "checkbox") {
        var t = inp.parentNode.querySelector(".btxt");
        if (t) { t.textContent = inp.checked ? "是" : "否"; }
      }
      if (inp.dataset && inp.dataset.ref) { applyScalarRefWarning(inp); }
      markDirty();
    });
  });
  // 引用字段：异步填候选（显示名称 + 标识；当前值不在候选内也保留）
  var byTarget = {};
  Array.prototype.forEach.call(body.querySelectorAll("select[data-ref]"), function (sel) {
    var t = sel.dataset.ref;
    if (!t) { return; }
    (byTarget[t] = byTarget[t] || []).push(sel);
  });
  Object.keys(byTarget).forEach(function (target) {
    loadRefOptions(target).then(function (opts) {
      byTarget[target].forEach(function (sel) {
        var cur = sel.dataset.current || "";
        sel.innerHTML = selectOptions(cur, opts, "（未选择）");
        sel.value = cur;  // 候选内命中；不在候选时由占位项承载
        applyScalarRefWarning(sel);
      });
    }).catch(function () { /* 候选拉取失败：保留仅当前值，不阻断编辑 */ });
  });
  // 批4：列表（可增删行表格）与引用多选（引用列表）的绑定
  bindListSections(body);
  bindRefListSections(body);
  // 批5：条件行编辑器 / 键值对表格的绑定（列表单元格内 & 顶层字段）
  bindConditionSections(body);
  bindMapSections(body);
  // 引用列表：候选到位后重画一次（黄提示 + 候选列表）；只拉一次，不在重画里递归拉取。
  var rlByTarget = {};
  Array.prototype.forEach.call(body.querySelectorAll("[data-rlwrap]"), function (wrap) {
    var f = ctxFromNode(wrap).fieldIndex[wrap.dataset.rlwrap];
    if (!f) { return; }
    (rlByTarget[f.ref_target] = rlByTarget[f.ref_target] || []).push({ f: f, wrap: wrap });
  });
  Object.keys(rlByTarget).forEach(function (target) {
    loadRefOptions(target).then(function () {
      rlByTarget[target].forEach(function (it) { renderRefListField(it.f, it.wrap); });
    }).catch(function () { /* 候选失败不阻断编辑 */ });
  });
}

// ---------------------------------------------------------------------------
// 批4 · 可增删行表格（列表字段；行内编辑写回草稿，不落盘）
// ---------------------------------------------------------------------------
function listTableBody(f) {
  var rows = currentFieldValue(f);
  if (!Array.isArray(rows)) { rows = []; }
  var cols = f.columns || [];
  var scalar = !!f.scalar_element;
  // 批5.1：元素含嵌套结构化子字段（列描述 nested=true；判定依据是控件形态，不是字段名）→
  // 块状换行布局；纯标量列表（列全是引用/数值/文本，无嵌套结构）仍用可增删行表格。
  var nestedCol = false;
  for (var ci = 0; ci < cols.length; ci++) {
    if (cols[ci] && cols[ci].nested) { nestedCol = true; break; }
  }
  if (f.block_layout || nestedCol) { return listBlockBody(f, rows, cols, scalar); }
  var html = '<div class="lmeta">列表字段 · ' + rows.length + " 行 · 列名与类型来自内容包元数据"
    + " · 改动先进草稿（不落盘）</div>";
  if (!cols.length) {
    // 元素声明为对象但元数据没给子字段：如实提示、不臆造列名（否则会把对象行改写成
    // {"value": …}）。但仍照常渲染「+ 添加一行」——空列表必须能新建第一行；新行无数据列，
    // 只保留「操作」列可删，避免刚建的行不可见、不可撤销。
    html += '<div class="ex">该列表元素的字段未在内容包元数据中声明，'
      + (rows.length ? "" : "且当前没有数据行可供推断列；")
      + "请先在元数据里声明元素子字段，再回来编辑。</div>";
  }
  if (!rows.length) {
    html += '<div class="ex">（空列表）暂无数据行，用下面的「+ 添加一行」新建。</div>';
  } else {
    html += '<div class="ltable-scroll"><table class="ltable ltable-edit"><thead><tr>'
      + cols.map(function (c) {
        // V11：表头只留「中文 + 类型」，键名缩为悬停 tooltip（不再折三行）。
        // V10：给引用列加宽档（scalarCssClass 只按控件形态），下拉文本不被裁。
        return '<th class="' + esc(scalarCssClass(c.control)) + '">'
          + helpTriggerHtml(c, headerLabelHtml(c.label, c.key))
          + ' <span class="ftype">' + esc(typeZh(c.type)) + "</span></th>";
      }).join("")
      + '<th class="op">操作</th></tr></thead><tbody>';
    rows.forEach(function (row, i) {
      html += "<tr>" + cols.map(function (c) {
        return "<td>" + listCell(f, row, c, i, scalar) + "</td>";
      }).join("")
        + '<td class="op"><button type="button" class="ldel" data-ldel="' + i
        + '" title="删除本行（只改草稿）">删除</button></td></tr>';
    });
    html += "</tbody></table></div>";
  }
  html += '<button type="button" class="ladd" data-ladd="' + esc(f.key)
    + '" title="按元素元数据的默认值新建一行（只改草稿）">+ 添加一行</button>';
  return html;
}

function listTableEdit(f) {
  return '<div class="lwrap ltable-wrap" data-lwrap="' + esc(f.key) + '">'
    + listTableBody(f) + "</div>";
}

// ---------------------------------------------------------------------------
// 批5.1 · 块状换行布局（列表元素含嵌套结构化子字段时）
// 逐条成块：块首行 = 该元素的标量列（横向排布、尽量占满一行），随后换行把嵌套字段
// （条件 / 键值对 / 对象 / 嵌套列表）各自成块、占满容器宽度。列的分类来自后端列描述
// 的 nested 标志（由控件形态判定），前端不认任何业务字段名。
// 增删行/引用候选/条件与键值编辑仍走原有 [data-ladd]/[data-ldel]/[data-lcell]/
// [data-condcell]/[data-mapcell] 接线，保存链零改动。
// ---------------------------------------------------------------------------
function listBlockBody(f, rows, cols, scalar) {
  var scalars = cols.filter(function (c) { return c && !c.nested; });
  var nests = cols.filter(function (c) { return c && c.nested; });
  var html = '<div class="lmeta">列表字段 · ' + rows.length + " 行 · 块状换行布局"
    + "（元素含嵌套子字段：标量列横排成块首行，嵌套字段各自成块、占满容器宽度）"
    + " · 改动先进草稿（不落盘）</div>";
  if (!cols.length) {
    // 元素声明为对象但元数据没给子字段：如实提示、不臆造列名（与表格路径同一口径）。
    html += '<div class="ex">该列表元素的字段未在内容包元数据中声明，'
      + (rows.length ? "" : "且当前没有数据行可供推断列；")
      + "请先在元数据里声明元素子字段，再回来编辑。</div>";
  }
  if (!rows.length) {
    html += '<div class="ex">（空列表）暂无数据行，用下面的「+ 添加一行」新建。</div>';
  } else if (cols.length) {
    html += '<div class="lblocks">';
    rows.forEach(function (row, i) {
      html += listBlockHtml(f, row, i, scalar, scalars, nests);
    });
    html += "</div>";
  }
  html += '<button type="button" class="ladd" data-ladd="' + esc(f.key)
    + '" title="按元素元数据的默认值新建一行（只改草稿）">+ 添加一行</button>';
  return html;
}

function listBlockHtml(f, row, i, scalar, scalars, nests) {
  var html = '<div class="lblock" data-lblock="' + i + '"><div class="lb-head">'
    + '<span class="lb-no">#' + (i + 1) + "</span>";
  if (scalars.length) {
    html += '<div class="lb-scalars">' + scalars.map(function (c) {
      return '<div class="lb-scalar ' + esc(scalarCssClass(c.control)) + '" data-lscalar="'
        + esc(c.key) + '"><span class="lb-k">'
        + helpTriggerHtml(c, headerLabelHtml(c.label, c.key))
        + ' <span class="ftype">' + esc(typeZh(c.type)) + "</span></span>"
        + listCell(f, row, c, i, scalar) + "</div>";
    }).join("") + "</div>";
  }
  html += '<button type="button" class="ldel" data-ldel="' + i
    + '" title="删除本行（只改草稿）">删除</button></div>';
  if (nests.length) {
    html += '<div class="lb-nests">' + nests.map(function (c) {
      return '<div class="lb-nest" data-lnest="' + esc(c.key) + '"><div class="lb-nest-h">'
        + helpTriggerHtml(c, headerLabelHtml(c.label, c.key))
        + ' <span class="ftype">' + esc(typeZh(c.type)) + "</span></div>"
        + '<div class="lb-nest-b">' + listCell(f, row, c, i, scalar) + "</div></div>";
    }).join("") + "</div>";
  }
  return html + "</div>";
}

// 标量列的宽度档（只按控件形态，不认字段名）：引用/文本给足宽（V12 下拉文本不再被裁），
// 数字/布尔窄档，多行文本整行。
function scalarCssClass(control) {
  if (control === "number") { return "num"; }
  if (control === "bool") { return "bool"; }
  if (control === "ref") { return "ref"; }
  if (control === "textarea") { return "wide"; }
  return "";
}

function listCell(f, row, col, i, scalar) {
  var v = EditorList.cellValue(row, col.key, scalar);
  var attrs = ' data-lcell="' + esc(f.key) + '" data-lrow="' + i + '" data-lcol="' + esc(col.key) + '"';
  switch (col.control) {
    case "number":
      return '<input class="cin lcell" type="number" step="' + esc(col.number_step || "any")
        + '" placeholder="' + esc(INPUT_EMPTY) + '"' + attrs
        + ' value="' + esc(v == null ? "" : v) + '">';
    case "bool":
      return '<label class="ctl-bool"><input type="checkbox"' + attrs + (v ? " checked" : "")
        + '> <span class="btxt">' + (v ? "是" : "否") + "</span></label>";
    case "select":
      return '<select class="cin lcell"' + attrs + ">"
        + selectOptions(v, col.enum || [], "（未选择）") + "</select>";
    case "ref":
      return '<select class="cin lcell"' + attrs + ' data-lref="' + esc(col.ref_target || "")
        + '" data-current="' + esc(v == null ? "" : v) + '">'
        + selectOptions(v, [], "（未选择）") + "</select>";
    case "readonly":
    case "listtable":
      // 对象/映射子字段与嵌套列表：本批不在单元格里内联编辑 → 给统一的有框只读外观，
      // 空值同样走 EMPTY_TEXT（不再裸露无边框 JSON 深色块）。
      return '<span class="ro-cell">' + esc(
        (v == null || v === "") ? EMPTY_TEXT
          : (typeof v === "object" ? JSON.stringify(v) : String(v))
      ) + "</span>";
    case "condition":
      return '<div class="cond-edit" data-condcell="' + esc(f.key) + '" data-condrow="' + i
        + '" data-condcol="' + esc(col.key) + '">'
        + condBodyHtml(EditorCondition.parse(v), col.condition || {}) + "</div>";
    case "maptable":
      return '<div class="map-edit" data-mapcell="' + esc(f.key) + '" data-maprow="' + i
        + '" data-mapcol="' + esc(col.key) + '">'
        + mapBodyHtml(EditorMap.rows(v), col) + "</div>";
    case "text":
    case "textarea":
    default:
      return '<input class="cin lcell" type="text"' + attrs
        + ' placeholder="' + esc(INPUT_EMPTY) + '" value="'
        + esc(v == null ? "" : v) + '">';
  }
}

function readCellValue(inp, f) {
  if (inp.type === "checkbox") { return !!inp.checked; }
  if (inp.tagName === "SELECT") { return inp.value === "" ? null : inp.value; }
  if (inp.classList.contains("lcell") && inp.type === "number") {
    if (inp.value === "") { return null; }
    var n = Number(inp.value);
    return isNaN(n) ? inp.value : n;
  }
  return inp.value;
}

function rerenderListField(f, wrap) {
  if (!wrap || !f) { return; }
  var ctx = ctxFromNode(wrap);
  var prev = renderCtx;
  renderCtx = ctx;
  wrap.innerHTML = listTableBody(f);
  renderCtx = prev;
  bindListSections(wrap);
  bindConditionSections(wrap);
  bindMapSections(wrap);
  markDirty();
}

function bindListSections(root) {
  Array.prototype.forEach.call(root.querySelectorAll("[data-lcell]"), function (inp) {
    var ctx = ctxFromNode(inp);
    var f = ctx.fieldIndex[inp.dataset.lcell];
    if (!f) { return; }
    var ev = (inp.type === "checkbox" || inp.tagName === "SELECT") ? "change" : "input";
    inp.addEventListener(ev, function () {
      var rows = ctxFieldValue(ctx, f);
      if (!Array.isArray(rows)) { rows = []; }
      rows = EditorList.setCell(rows, inp.dataset.lrow, inp.dataset.lcol,
        readCellValue(inp, f), !!f.scalar_element);
      EditorDraft.set(ctx.draft, inp.dataset.lcell, rows, f.value);
      if (inp.type === "checkbox") {
        var t = inp.parentNode.querySelector(".btxt");
        if (t) { t.textContent = inp.checked ? "是" : "否"; }
      }
      markDirty();
    });
    if (inp.dataset && inp.dataset.lref) { fillRefSelect(inp, inp.dataset.lref); }
  });
  Array.prototype.forEach.call(root.querySelectorAll("[data-ldel]"), function (btn) {
    btn.addEventListener("click", function () {
      var wrap = btn.closest(".lwrap");
      var ctx = ctxFromNode(btn);
      var f = wrap ? ctx.fieldIndex[wrap.dataset.lwrap] : null;
      if (!f) { return; }
      var rows = EditorList.delRow(ctxFieldValue(ctx, f), btn.dataset.ldel);
      EditorDraft.set(ctx.draft, f.key, rows, f.value);
      rerenderListField(f, wrap);
    });
  });
  Array.prototype.forEach.call(root.querySelectorAll("[data-ladd]"), function (btn) {
    btn.addEventListener("click", function () {
      var ctx = ctxFromNode(btn);
      var f = ctx.fieldIndex[btn.dataset.ladd];
      if (!f) { return; }
      var wrap = btn.closest(".lwrap");
      var rows = EditorList.addRow(ctxFieldValue(ctx, f), f.row_default, !!f.scalar_element);
      EditorDraft.set(ctx.draft, f.key, rows, f.value);
      rerenderListField(f, wrap);
    });
  });
}

// ---------------------------------------------------------------------------
// 批5 · 条件行编辑器（通用控件；键名不写死、两级嵌套、可增删行）
// 数据面 = EditorCondition（与后端 api.condition_rows/condition_value 同构）。
// 单元格内与顶层字段共用同一套渲染/绑定；改动写回草稿，不落盘。
// ---------------------------------------------------------------------------
function condBodyHtml(rows, meta) {
  var declared = !!(meta && meta.declared);
  var html = '<div class="cmeta">条件行 · ' + rows.length + " 行 · 主体/比较符/值"
    + (declared ? "（主体声明来自内容包元数据）" : "（元数据未声明主体，按实际值形态推断）")
    + "</div>";
  html += '<div class="crows">' + condRowsHtml(rows, meta, []) + "</div>";
  html += '<button type="button" class="cadd" data-cadd="">+ 条件</button>';
  return html;
}

function condRowsHtml(rows, meta, parentPath) {
  if (!rows || !rows.length) { return '<div class="ex">（无条件）用下面「+ 条件」新建一行。</div>'; }
  return rows.map(function (r, i) {
    return condRowHtml(r, meta, parentPath.concat([i]));
  }).join("");
}

function condRowHtml(r, meta, path) {
  var p = path.join(".");
  if (r.kind === "combine") {
    var groups = (r.children && r.children.length) ? r.children : [[]];
    var inner = groups.map(function (g, gi) {
      return '<div class="cgroup"><span class="cglab">分支 ' + (gi + 1) + "</span>"
        + condRowsHtml(g, meta, path.concat([gi]))
        + '<button type="button" class="cadd" data-cadd="' + esc(p + "|" + gi) + '">+ 条件</button>'
        + (groups.length > 1
          ? '<button type="button" class="cdel" data-cdelbranch="' + esc(p + "|" + gi) + '">删分支</button>'
          : "")
        + "</div>";
    }).join("");
    return '<div class="crow combine" data-cpath="' + esc(p) + '">'
      + '<div class="chead">' + condSubjectHtml(r.subject, meta, p) + " 组合"
      + '<button type="button" class="cadd" data-caddbranch="' + esc(p) + '">+ 分支</button>'
      + '<button type="button" class="cdel" data-cdel="' + esc(p) + '">删除</button></div>'
      + '<div class="cchildren">' + inner + "</div></div>";
  }
  var info = EditorCondition.subjectInfo(meta, r.subject);
  var isComplex = !!r.complex;
  var hasKey = !!(r.key || (info && info.key_ref));
  var html = '<div class="crow' + (isComplex ? " cplx" : "") + '" data-cpath="' + esc(p) + '">'
    + condSubjectHtml(r.subject, meta, p)
    + (hasKey ? condKeyHtml(r, info, p) : "")
    + (isComplex ? condRawHtml(r, p) : condOpHtml(r, meta, p) + condValueHtml(r, info, p))
    + '<button type="button" class="cdel" data-cdel="' + esc(p) + '">删除</button></div>';
  return html;
}

function condSubjectHtml(value, meta, path) {
  var cur = value == null ? "" : String(value);
  var subs = EditorCondition.subjectList(meta);
  var attrs = ' data-cpart="subject" data-cpath="' + esc(path) + '"';
  if (!subs.length) {
    return '<input class="cin csubject" type="text" placeholder="主体（如 count）"'
      + attrs + ' value="' + esc(cur) + '">';
  }
  var opts = subs.map(function (s) { return { id: s.key, name: s.label }; });
  return '<select class="cin csubject"' + attrs + ">"
    + selectOptions(cur, opts, "（选择主体）") + "</select>";
}

function condKeyHtml(r, info, path) {
  var cur = r.key == null ? "" : String(r.key);
  var attrs = ' data-cpart="key" data-cpath="' + esc(path) + '"';
  var target = info ? info.key_ref : "";
  if (target) {
    return '<select class="cin ckey"' + attrs + ' data-lref="' + esc(target)
      + '" data-current="' + esc(cur) + '">' + selectOptions(cur, [], "（选择键）") + "</select>";
  }
  return '<input class="cin ckey" type="text" placeholder="二级键"'
    + attrs + ' value="' + esc(cur) + '">';
}

function condOpHtml(r, meta, path) {
  var cur = r.op == null ? "" : String(r.op);
  var ops = EditorCondition.opOptions(meta);
  var attrs = ' data-cpart="op" data-cpath="' + esc(path) + '"';
  return '<select class="cin cop"' + attrs + ">"
    + selectOptions(cur, ops, "（比较符）") + "</select>";
}

function condValueHtml(r, info, path) {
  var v = r.value;
  var isList = Array.isArray(v);
  var cur = isList ? (v.length ? v[0] : "") : (v == null ? "" : v);
  var attrs = ' data-cpart="value" data-cpath="' + esc(path) + '"'
    + (isList ? ' data-clist="1"' : "");
  var target = info ? info.value_ref : "";
  if (target) {
    return '<select class="cin cvalue"' + attrs + ' data-lref="' + esc(target)
      + '" data-current="' + esc(cur) + '">' + selectOptions(cur, [], "（选择值）") + "</select>";
  }
  if (typeof v === "number" && !isList) {
    return '<input class="cin cvalue" type="number" step="any"' + attrs
      + ' value="' + esc(v) + '">';
  }
  return '<input class="cin cvalue" type="text" placeholder="值"' + attrs
    + ' value="' + esc(cur) + '">';
}

function condRawHtml(r, path) {
  return '<span class="ro-cell">' + esc(JSON.stringify(r.value)) + "</span>"
    + '<span class="cnote">深于两级的结构，本控件只读保留</span>';
}

function condFieldInner(f, value) {
  return condBodyHtml(EditorCondition.parse(value), f.condition || {});
}

function condPathToArray(p) {
  return String(p || "").split(".").filter(function (x) { return x !== ""; })
    .map(function (x) { return Number(x); });
}

function condReadPart(el) {
  var part = el.dataset.cpart;
  if (part === "value" && el.dataset.clist === "1") {
    return el.value === "" ? [] : [el.value];
  }
  if (el.tagName === "SELECT" || el.type === "number") {
    if (el.value === "") { return part === "value" ? "" : ""; }
    if (el.type === "number") { var n = Number(el.value); return isNaN(n) ? el.value : n; }
    return el.value;
  }
  return el.value;
}

function conditionBoxCtx(box) {
  var ctx = ctxFromNode(box);
  if (box.dataset.condcell != null) {
    var f = ctx.fieldIndex[box.dataset.condcell];
    return { ctx: ctx, f: f, cell: true };
  }
  var g = ctx.fieldIndex[box.dataset.condfield];
  return { ctx: ctx, f: g, cell: false };
}

function condCurrentValue(ref) {
  if (!ref.f) { return undefined; }
  if (!ref.cell) { return ctxFieldValue(ref.ctx, ref.f); }
  var rows = ctxFieldValue(ref.ctx, ref.f);
  if (!Array.isArray(rows)) { rows = []; }
  // EditorList.cellValue 取「单行 + 列键」（不是整表 + 行号）：先按行号取行再取列
  return EditorList.cellValue(rows[Number(box0row(ref))], box0col(ref),
    !!ref.f.scalar_element);
}
function box0row(ref) { return ref.box.dataset.condrow; }
function box0col(ref) { return ref.box.dataset.condcol; }

function initCondBox(box) {
  if (box.__rows) { return; }
  var ref = conditionBoxCtx(box); ref.box = box;
  box.__ref = ref;
  box.__meta = ref.cell ? ((ref.f && ref.f.columns || []).filter(function (c) {
    return c.key === box.dataset.condcol; })[0] || {}).condition || {}
    : ((ref.f && ref.f.condition) || {});
  box.__rows = EditorCondition.parse(condCurrentValue(ref));
}

function commitCond(box) {
  var ref = box.__ref || conditionBoxCtx(box); ref.box = box;
  var value = EditorCondition.serialize(box.__rows);
  if (!ref.f) { return; }
  if (!ref.cell) {
    EditorDraft.set(ref.ctx.draft, ref.f.key, value, ref.f.value);
  } else {
    var rows = ctxFieldValue(ref.ctx, ref.f);
    if (!Array.isArray(rows)) { rows = []; }
    rows = EditorList.setCell(rows, box.dataset.condrow, box.dataset.condcol,
      value, !!ref.f.scalar_element);
    EditorDraft.set(ref.ctx.draft, ref.f.key, rows, ref.f.value);
  }
  markDirty();
}

function redrawCond(box) {
  box.innerHTML = condBodyHtml(box.__rows, box.__meta);
  bindCondOne(box);
}

function bindCondOne(box) {
  Array.prototype.forEach.call(box.querySelectorAll("[data-cpart]"), function (el) {
    var ev = (el.tagName === "SELECT") ? "change" : "input";
    el.addEventListener(ev, function () {
      EditorCondition.setField(box.__rows, condPathToArray(el.dataset.cpath),
        el.dataset.cpart, condReadPart(el));
      commitCond(box);
    });
    if (el.dataset && el.dataset.lref) { fillRefSelect(el, el.dataset.lref); }
  });
  Array.prototype.forEach.call(box.querySelectorAll("[data-cadd]"), function (btn) {
    btn.addEventListener("click", function () {
      var raw = btn.dataset.cadd;
      if (!raw) { EditorCondition.addRow(box.__rows, null); }
      else {
        var parts = String(raw).split("|");
        EditorCondition.addRow(box.__rows, condPathToArray(parts[0]), Number(parts[1]));
      }
      commitCond(box); redrawCond(box);
    });
  });
  Array.prototype.forEach.call(box.querySelectorAll("[data-caddbranch]"), function (btn) {
    btn.addEventListener("click", function () {
      EditorCondition.addBranch(box.__rows, condPathToArray(btn.dataset.caddbranch));
      commitCond(box); redrawCond(box);
    });
  });
  Array.prototype.forEach.call(box.querySelectorAll("[data-cdelbranch]"), function (btn) {
    btn.addEventListener("click", function () {
      var parts = String(btn.dataset.cdelbranch).split("|");
      EditorCondition.delBranch(box.__rows, condPathToArray(parts[0]), Number(parts[1]));
      commitCond(box); redrawCond(box);
    });
  });
  Array.prototype.forEach.call(box.querySelectorAll("[data-cdel]"), function (btn) {
    btn.addEventListener("click", function () {
      EditorCondition.delRow(box.__rows, condPathToArray(btn.dataset.cdel));
      commitCond(box); redrawCond(box);
    });
  });
}

function bindConditionSections(root) {
  Array.prototype.forEach.call(root.querySelectorAll(".cond-edit"), function (box) {
    initCondBox(box);
    bindCondOne(box);
  });
}

// ---------------------------------------------------------------------------
// 批5 · 键值对表格（map 的可编辑形态；键/值可声明引用目标 → 引用选择器）
// ---------------------------------------------------------------------------
function mapBodyHtml(rows, col) {
  var kr = (col && col.key_ref) || "";
  var html = '<div class="cmeta">键值对 · ' + rows.length + " 行 · 改动先进草稿（不落盘）</div>";
  html += '<div class="mrows">';
  if (!rows.length) { html += '<div class="ex">（暂无键值）用下面「+ 键值」新建一行。</div>'; }
  rows.forEach(function (r, i) {
    html += '<div class="mrow" data-mpath="' + i + '">'
      + mapKeyHtml(r.key, kr)
      + mapValueHtml(r.value)
      + '<button type="button" class="cdel" data-mdel="' + i + '">删除</button></div>';
  });
  html += '</div><button type="button" class="cadd" data-madd="1">+ 键值</button>';
  return html;
}

function mapKeyHtml(key, target) {
  var cur = key == null ? "" : String(key);
  if (target) {
    return '<select class="cin mkey" data-mpart="key" data-lref="' + esc(target)
      + '" data-current="' + esc(cur) + '">' + selectOptions(cur, [], "（选择键）") + "</select>";
  }
  return '<input class="cin mkey" type="text" placeholder="键" data-mpart="key" value="'
    + esc(cur) + '">';
}

function mapValueHtml(value) {
  if (typeof value === "number") {
    return '<input class="cin mval" type="number" step="any" data-mpart="value" value="'
      + esc(value) + '">';
  }
  if (value && typeof value === "object") {
    return '<span class="ro-cell">' + esc(JSON.stringify(value)) + "</span>";
  }
  return '<input class="cin mval" type="text" placeholder="值" data-mpart="value" value="'
    + esc(value == null ? "" : value) + '">';
}

function mapFieldInner(f, value) {
  return mapBodyHtml(EditorMap.rows(value), f);
}

function mapBoxCtx(box) {
  var ctx = ctxFromNode(box);
  if (box.dataset.mapcell != null) {
    var f = ctx.fieldIndex[box.dataset.mapcell];
    var col = ((f && f.columns) || []).filter(function (c) {
      return c.key === box.dataset.mapcol; })[0] || {};
    return { ctx: ctx, f: f, cell: true, meta: col };
  }
  return { ctx: ctx, f: ctx.fieldIndex[box.dataset.mapfield], cell: false, meta: null };
}

function mapCurrentValue(ref) {
  if (!ref.f) { return undefined; }
  if (!ref.cell) { return ctxFieldValue(ref.ctx, ref.f); }
  var rows = ctxFieldValue(ref.ctx, ref.f);
  if (!Array.isArray(rows)) { rows = []; }
  return EditorList.cellValue(rows[Number(ref.box.dataset.maprow)], ref.box.dataset.mapcol,
    !!ref.f.scalar_element);
}

function initMapBox(box) {
  if (box.__rows) { return; }
  var ref = mapBoxCtx(box); ref.box = box;
  box.__ref = ref;
  box.__rows = EditorMap.rows(mapCurrentValue(ref));
}

function commitMap(box) {
  var ref = box.__ref || mapBoxCtx(box); ref.box = box;
  var value = EditorMap.value(box.__rows);
  if (!ref.f) { return; }
  if (!ref.cell) {
    EditorDraft.set(ref.ctx.draft, ref.f.key, value, ref.f.value);
  } else {
    var rows = ctxFieldValue(ref.ctx, ref.f);
    if (!Array.isArray(rows)) { rows = []; }
    rows = EditorList.setCell(rows, box.dataset.maprow, box.dataset.mapcol, value,
      !!ref.f.scalar_element);
    EditorDraft.set(ref.ctx.draft, ref.f.key, rows, ref.f.value);
  }
  markDirty();
}

function redrawMap(box) {
  box.innerHTML = mapBodyHtml(box.__rows, box.__ref ? box.__ref.meta : null);
  bindMapOne(box);
}

function bindMapOne(box) {
  Array.prototype.forEach.call(box.querySelectorAll("[data-mpart]"), function (el) {
    var ev = (el.tagName === "SELECT") ? "change" : "input";
    el.addEventListener(ev, function () {
      var i = Number(el.closest(".mrow").dataset.mpath);
      var part = el.dataset.mpart;
      var val = el.value;
      if (part === "value" && el.type === "number" && val !== "") {
        var n = Number(val); if (!isNaN(n)) { val = n; }
      }
      if (part === "key") { EditorMap.setKey(box.__rows, i, val); }
      else { EditorMap.setValue(box.__rows, i, val); }
      commitMap(box);
    });
    if (el.dataset && el.dataset.lref) { fillRefSelect(el, el.dataset.lref); }
  });
  Array.prototype.forEach.call(box.querySelectorAll("[data-mdel]"), function (btn) {
    btn.addEventListener("click", function () {
      EditorMap.delRow(box.__rows, Number(btn.dataset.mdel));
      commitMap(box); redrawMap(box);
    });
  });
  Array.prototype.forEach.call(box.querySelectorAll("[data-madd]"), function (btn) {
    btn.addEventListener("click", function () {
      EditorMap.addRow(box.__rows);
      commitMap(box); redrawMap(box);
    });
  });
}

function bindMapSections(root) {
  Array.prototype.forEach.call(root.querySelectorAll(".map-edit"), function (box) {
    initMapBox(box);
    bindMapOne(box);
  });
}

// 引用下拉（列表单元格 / 标量）：异步填候选；非法值只标黄，不拦编辑。
function fillRefSelect(sel, target) {
  if (!target) { return; }
  loadRefOptions(target).then(function (opts) {
    var cur = sel.dataset.current || "";
    sel.innerHTML = selectOptions(cur, opts, "（未选择）");
    sel.value = cur;
    markRefWarn(sel, target);
  }).catch(function () { /* 候选失败不阻断 */ });
}

function refSelectTitle(sel, target) {
  // V10：引用下拉被裁剪时，悬停给「当前：名称（标识）」全文 + 非法提示。
  var opts = state.refCache[target] || [];
  var cur = sel.value === "" ? null : sel.value;
  var st = EditorRef.status(cur, EditorRef.ids(opts), state.refKnown[target]);
  var label = cur == null ? "" : EditorRef.label(cur, opts);
  var parts = [];
  if (label) { parts.push("当前：" + label); }
  if (st.warn && st.text) { parts.push(st.text); }
  sel.title = parts.join(" · ");
  return st;
}

function markRefWarn(sel, target) {
  var st = refSelectTitle(sel, target);
  sel.classList.toggle("warn", st.warn);
}

function applyScalarRefWarning(sel) {
  var target = sel.dataset.ref;
  var st = refSelectTitle(sel, target);
  var note = sel.parentNode ? sel.parentNode.querySelector(".refnote") : null;
  if (note) {
    note.innerHTML = st.warn ? '<span class="refwarn">' + esc(st.text) + "</span>" : "";
  }
}

// ---------------------------------------------------------------------------
// 批4 · 引用选择器（多选 / 引用列表；元素为 ref 的 list）
// ---------------------------------------------------------------------------
function refListEdit(f) {
  return '<div class="lwrap reflist-wrap" data-rlwrap="' + esc(f.key) + '">'
    + refListBody(f) + "</div>";
}

function refListBody(f) {
  var values = currentFieldValue(f);
  if (!Array.isArray(values)) { values = []; }
  var target = f.ref_target || "";
  var opts = state.refCache[target] || [];
  var known = state.refKnown[target];
  var html = '<div class="lmeta">引用列表 · 已选 ' + values.length + " 项 · 保存的是目标标识，名称仅用于显示"
    + "</div>";
  html += '<div class="refvals" data-rfvals="' + esc(f.key) + '">';
  html += refValChips(values, opts, known);
  html += "</div>";
  html += '<div class="refsel"><div class="rf-hd"><span class="q">搜索</span>'
    + '<input type="text" class="rf-q" data-refq="' + esc(f.key)
    + '" placeholder="输入名称或标识筛选候选" value="'
    + esc(state.refQuery[f.key] || "") + '">'
    + '<span class="q rf-cnt" data-rfcnt="' + esc(f.key) + '"></span></div>'
    + '<div class="rf-list" data-reflist="' + esc(f.key) + '"></div>'
    + '<div class="rf-ft"><span>点候选项加入；再次点「清除」移除。</span><span class="sp2">'
    + (known === false ? "本包内该引用目标暂无候选" : "") + "</span></div></div>";
  return html;
}

function refValChips(values, opts, known) {
  if (!values.length) { return '<span class="ex">（未选择任何引用）</span>'; }
  return values.map(function (id) {
    var st = EditorRef.status(id, opts, known);
    // V10：chip 文本被窄栏裁切时，悬停 title 给全文（名称（标识）+ 非法提示）；
    // 此前合法值 title 为空，裁了也看不到全文。
    var label = EditorRef.label(id, opts);
    var title = label + (st.warn && st.text ? " · " + st.text : "");
    return '<span class="refval' + (st.warn ? " warn" : "") + '" title="' + esc(title) + '">'
      + '<span class="mono2">' + esc(label) + "</span>"
      + (st.warn ? '<span class="refwarn">目标不存在</span>' : "")
      + '<button type="button" class="ldel" data-refdel="' + esc(id) + '">清除</button></span>';
  }).join("");
}

function refCandidateList(f) {
  var target = f.ref_target || "";
  var opts = state.refCache[target] || [];
  var rows = EditorRef.filter(opts, state.refQuery[f.key] || "");
  if (!rows.length) {
    return '<div class="rf-ft" style="border-top:0"><span>'
      + (state.refKnown[target] === false
        ? "本包内该引用目标暂无候选项；可先去目标模块建立条目。"
        : "没有匹配的候选项；换个关键词试试。")
      + "</span></div>";
  }
  return rows.map(function (o) {
    return '<div class="rf-it" data-refpick="' + esc(o.id) + '" data-refpickkey="'
      + esc(f.key) + '" title="加入：' + esc(o.id) + '">' + esc(o.name)
      + '<span class="id2">' + esc(o.id) + "</span></div>";
  }).join("");
}

function renderRefListField(f, wrap) {
  if (!wrap || !f) { return; }
  var ctx = ctxFromNode(wrap);
  var prev = renderCtx;
  renderCtx = ctx;
  var scroll = wrap.querySelector(".rf-list");
  var keep = scroll ? scroll.scrollTop : 0;
  wrap.innerHTML = refListBody(f);
  renderCtx = prev;
  var list = wrap.querySelector(".rf-list");
  if (list) { list.innerHTML = refCandidateList(f); }
  var cnt = wrap.querySelector(".rf-cnt");
  if (cnt) { cnt.textContent = (state.refCache[f.ref_target] || []).length + " 条匹配候选"; }
  if (list) { list.scrollTop = keep; }
  bindRefListSections(wrap);
  markDirty();
}

function bindRefListSections(root) {
  // 候选列表渲染 + 点选绑定（本函数不做候选拉取，避免 re-render ⇄ load 互相触发）
  Array.prototype.forEach.call(root.querySelectorAll("[data-reflist]"), function (box) {
    var f = ctxFromNode(box).fieldIndex[box.dataset.reflist];
    if (!f) { return; }
    var wrap = box.closest(".reflist-wrap");
    box.innerHTML = refCandidateList(f);
    var cnt = wrap.querySelector(".rf-cnt");
    if (cnt) { cnt.textContent = (state.refCache[f.ref_target] || []).length + " 条匹配候选"; }
    bindRefPicks(box, f, wrap);
  });
  Array.prototype.forEach.call(root.querySelectorAll("[data-refq]"), function (inp) {
    inp.addEventListener("input", function () {
      var key = inp.dataset.refq;
      var f = ctxFromNode(inp).fieldIndex[key];
      if (!f) { return; }
      state.refQuery[key] = inp.value;
      var wrap = inp.closest(".reflist-wrap");
      var box = wrap.querySelector("[data-reflist]");
      if (box) { box.innerHTML = refCandidateList(f); }
      bindRefPicks(box, f, wrap);
    });
  });
  Array.prototype.forEach.call(root.querySelectorAll("[data-refdel]"), function (btn) {
    btn.addEventListener("click", function () {
      var wrap = btn.closest(".reflist-wrap");
      var ctx = ctxFromNode(btn);
      var f = wrap ? ctx.fieldIndex[wrap.dataset.rlwrap] : null;
      if (!f) { return; }
      var vals = EditorRef.delRef(ctxFieldValue(ctx, f), btn.dataset.refdel);
      EditorDraft.set(ctx.draft, f.key, vals, f.value);
      renderRefListField(f, wrap);
    });
  });
}

function bindRefPicks(box, f, wrap) {
  if (!box) { return; }
  var ctx = ctxFromNode(box);
  Array.prototype.forEach.call(box.querySelectorAll("[data-refpick]"), function (it) {
    it.addEventListener("click", function () {
      var vals = EditorRef.addRef(ctxFieldValue(ctx, f), it.dataset.refpick);
      EditorDraft.set(ctx.draft, f.key, vals, f.value);
      renderRefListField(f, wrap);
      var q = wrap ? wrap.querySelector(".rf-q") : null;
      if (q) { q.focus(); }   // 连续挑选：重画后把光标放回搜索框
    });
  });
}


function loadRefOptions(target) {
  if (state.refCache[target]) { return Promise.resolve(state.refCache[target]); }
  return api("/api/pack/" + enc(state.pack) + "/refs/" + enc(target)).then(function (d) {
    state.refCache[target] = d.options || [];
    state.refKnown[target] = d.known !== false;  // 目标无候选 → false（黄提示，不红拦）
    return state.refCache[target];
  });
}

function readControl(inp, f) {
  if (inp.type === "checkbox") { return !!inp.checked; }
  if (inp.tagName === "SELECT") { return inp.value === "" ? null : inp.value; }
  if (f.control === "number") {
    if (inp.value === "") { return null; }
    var n = Number(inp.value);
    return isNaN(n) ? inp.value : n;
  }
  return inp.value;
}

// ---------------------------------------------------------------------------
// 校验 / 保存 / 取消 / 回退（主表单 + 关联分区条目共用同一条后端链路）
// ---------------------------------------------------------------------------
function formURL(ctx, suffix) {
  return "/api/pack/" + enc(state.pack) + "/entry/" + enc(ctx.module) + "/"
    + enc(ctx.entry) + suffix;
}

function entryURL(suffix) { return formURL(MAIN_CTX, suffix); }

// 其他表单上下文里未保存的改动（重画后按上下文键回填，避免保存一处丢掉别处的草稿）
function snapshotOtherDrafts(exceptKey) {
  var keep = {};
  Object.keys(state.forms).forEach(function (k) {
    if (k === exceptKey) { return; }
    if (EditorDraft.dirty(state.forms[k].draft)) {
      keep[k] = state.forms[k].draft.changes;
    }
  });
  return keep;
}

function setBusy(on) {
  state.busy = !!on;
  markDirty();
  refreshRollbackButton();
}

function postForm(ctx, suffix) {
  var patch = EditorDraft.patch(ctx.draft);
  if (!Object.keys(patch).length) { return Promise.resolve(); }
  setBusy(true);
  return postJSON(formURL(ctx, suffix), { patch: patch }).then(function (res) {
    state.result = res; renderResult(res);
    if (res.ok && suffix === "/save") {
      state.pendingDrafts = snapshotOtherDrafts(ctx.key);
      EditorDraft.discard(ctx.draft);
      return reloadDetail();
    }
  }).catch(function (err) {
    state.result = { ok: false, message: "请求失败：" + err.message, errors: [] };
    renderResult(state.result);
  }).then(function () { setBusy(false); });
}

function runValidate() { return postForm(MAIN_CTX, "/validate"); }
function runSave() { return postForm(MAIN_CTX, "/save"); }
function validateForm(key) { return postForm(state.forms[key] || MAIN_CTX, "/validate"); }
function saveForm(key) { return postForm(state.forms[key] || MAIN_CTX, "/save"); }

function runRollback() {
  if (!state.backup || !state.backup.exists) { return Promise.resolve(); }
  if (!window.confirm("确定回退到上一份备份吗？当前文件内容会被备份覆盖。")) { return Promise.resolve(); }
  setBusy(true);
  return postJSON("/api/pack/" + enc(state.pack) + "/module/" + enc(state.module) + "/rollback", {})
    .then(function (res) {
      state.result = res; renderResult(res);
      if (res.ok) { discardDraft(); return reloadDetail(); }
    }).catch(function (err) {
      state.result = { ok: false, message: "回退请求失败：" + err.message, errors: [] };
      renderResult(state.result);
    }).then(function () { setBusy(false); });
}

function renderResult(res) {
  var box = el("result");
  if (!box) { return; }
  if (!res) { box.hidden = true; box.innerHTML = ""; return; }
  var reds = res.errors || [];
  var yellows = res.warnings || [];
  var cls = (reds.length || !res.ok) ? "red" : (yellows.length ? "warn" : "");
  var html = '<div class="vbox ' + cls + '"><div class="vhead">'
    + esc(res.message || (res.ok ? "完成。" : "未通过。")) + "</div>";
  reds.forEach(function (e) { html += vrow(e, "red"); });
  yellows.forEach(function (e) { html += vrow(e, "yellow"); });
  box.innerHTML = html + "</div>";
  box.hidden = false;
}

function vrow(e, cls) {
  var where = [e.module, e.entry_id, e.field_label].filter(function (x) { return !!x; }).join(" · ");
  return '<div class="vrow ' + cls + '"><b>[' + (cls === "red" ? "红拦" : "黄提示") + "]</b> "
    + esc(where) + "：" + esc(e.message || e.code || "")
    + (e.how_to_fix ? '<span class="vfix">怎么改：' + esc(e.how_to_fix) + "</span>" : "")
    + "</div>";
}

// ---------------------------------------------------------------------------
// 只读渲染（列表/对象/映射本批只读；沿用批1 形态）
// ---------------------------------------------------------------------------
function fieldValue(f) {
  switch (f.widget) {
    case "bool":
      return '<div class="inp bool"><span class="box' + (f.value ? " on" : "") + '"></span>'
        + (f.value ? "是" : "否") + "</div>";
    case "number":
    case "formula":
    case "ref":
      return '<div class="inp mono">' + esc(f.display || EMPTY_TEXT) + "</div>";
    case "enum":
      return '<div class="inp">' + esc(f.display || EMPTY_TEXT) + "</div>";
    case "list":
      return listTable(f);
    case "map":
      return kvTable(f);
    case "obj":
      return objTable(f);
    case "text":
    default:
      return textValue(f);
  }
}

function textValue(f) {
  var v = f.display == null ? "" : f.display;
  if (String(v).length > 80 || String(v).indexOf("\n") >= 0) {
    return '<div class="ta">' + esc(v || EMPTY_TEXT) + "</div>";
  }
  return '<div class="inp">' + esc(v || EMPTY_TEXT) + "</div>";
}

function listTable(f) {
  if (!f.value || !f.value.length) { return '<div class="ex">（空列表）</div>'; }
  var cols = f.columns || [];
  // 批5.1：只读视图同样按 nested 标志走块状换行布局（与可编辑视图同一判定）。
  var nestedCol = false;
  for (var ci = 0; ci < cols.length; ci++) {
    if (cols[ci] && cols[ci].nested) { nestedCol = true; break; }
  }
  if (f.block_layout || nestedCol) { return listBlockTable(f, cols); }
  var head = "<tr>" + cols.map(function (c) {
    // V11：只读表头同样只留「中文 + 类型」，键名缩为悬停 tooltip。
    return '<th class="' + esc(scalarCssClass(c.control)) + '">'
      + helpTriggerHtml(c, headerLabelHtml(c.label, c.key))
      + ' <span class="ftype">' + esc(typeZh(c.type)) + "</span></th>";
  }).join("") + "</tr>";
  var body = (f.rows || []).map(function (row) {
    return "<tr>" + cols.map(function (c) {
      // V10：只读单元格省略号 + title 全文（悬停可见完整值）。
      var txt = row[c.key] == null ? "" : String(row[c.key]);
      return '<td title="' + esc(txt) + '">' + esc(txt) + "</td>";
    }).join("") + "</tr>";
  }).join("");
  var note = '<div class="lmeta">列表字段 · ' + f.row_count + " 行"
    + (f.rows && f.rows.length < f.row_count ? "（只读视图最多显示 " + f.rows.length + " 行）" : "")
    + " · 列名与类型来自内容包元数据</div>";
  return note + '<div class="ltable-scroll"><table class="ltable ltable-ro">'
    + "<thead>" + head + "</thead><tbody>" + body + "</tbody></table></div>";
}

// 只读块状换行布局（批5.1，与可编辑视图同一判定）：标量列横排成块首行，嵌套列各自成块。
function listBlockTable(f, cols) {
  var scalars = cols.filter(function (c) { return c && !c.nested; });
  var nests = cols.filter(function (c) { return c && c.nested; });
  var cells = f.rows || [];
  var note = '<div class="lmeta">列表字段 · ' + f.row_count + " 行 · 块状换行布局"
    + "（元素含嵌套子字段：标量列横排成块首行，嵌套字段各自成块、占满容器宽度）"
    + (cells.length < f.row_count ? "（只读视图最多显示 " + cells.length + " 行）" : "") + "</div>";
  var html = note + '<div class="lblocks">';
  cells.forEach(function (row, i) {
    html += '<div class="lblock" data-lblock="' + i + '"><div class="lb-head">'
      + '<span class="lb-no">#' + (i + 1) + "</span>";
    if (scalars.length) {
      html += '<div class="lb-scalars">' + scalars.map(function (c) {
        return '<div class="lb-scalar ' + esc(scalarCssClass(c.control)) + '"><span class="lb-k">'
          + helpTriggerHtml(c, headerLabelHtml(c.label, c.key))
          + ' <span class="ftype">' + esc(typeZh(c.type)) + "</span></span>"
          + '<div class="inp">' + esc(roCellText(row[c.key])) + "</div></div>";
      }).join("") + "</div>";
    }
    html += "</div>";
    if (nests.length) {
      html += '<div class="lb-nests">' + nests.map(function (c) {
        return '<div class="lb-nest"><div class="lb-nest-h">'
          + helpTriggerHtml(c, headerLabelHtml(c.label, c.key))
          + ' <span class="ftype">' + esc(typeZh(c.type)) + "</span></div>"
          + '<div class="lb-nest-b"><div class="inp">' + esc(roCellText(row[c.key]))
          + "</div></div></div>";
      }).join("") + "</div>";
    }
    html += "</div>";
  });
  return html + "</div>";
}

function roCellText(v) {
  return (v == null || v === "") ? EMPTY_TEXT : String(v);
}

function kvTable(f) {
  if (!f.value || !Object.keys(f.value).length) { return '<div class="ex">（空映射）</div>'; }
  var body = (f.rows || []).map(function (r) {
    return "<tr><td>" + esc(r.key) + "</td><td>" + esc(r.display == null ? "" : r.display) + "</td></tr>";
  }).join("");
  return '<table class="ltable"><thead><tr><th>键</th><th>值</th></tr></thead>'
    + "<tbody>" + body + "</tbody></table>";
}

function objTable(f) {
  var kids = f.children || [];
  if (!kids.length) {
    return '<div class="ta">' + esc(JSON.stringify(f.value, null, 2)) + "</div>";
  }
  return kids.map(function (c) {
    return '<div class="row nest"><div class="rlab">'
      + helpTriggerHtml(c, fieldLabelHtml(c.label, c.key))
      + ' <span class="ftype">' + esc(typeZh(c.type)) + "</span></div>"
      + '<div class="rval">' + fieldValue(c) + "</div></div>";
  }).join("");
}

// ---------------------------------------------------------------------------
// 启动
// ---------------------------------------------------------------------------
el("btn-validate").addEventListener("click", runValidate);
el("btn-save").addEventListener("click", runSave);
el("btn-cancel").addEventListener("click", function () {
  if (state.newEntry) {   // 新建态：取消 = 放弃并关闭（有未保存内容时二次确认）
    if (draftCount() && !window.confirm("放弃这次新建的未保存内容并关闭吗？")) { return; }
    discardDraft(); closeNewEntry(); return;
  }
  if (!draftCount()) { return; }
  state.result = null; renderResult(null); discardDraft(); reloadDetail();
});
el("btn-rollback").addEventListener("click", runRollback);
el("btn-delete").addEventListener("click", deleteEntry);
el("btn-new").addEventListener("click", openNewEntry);
el("role").addEventListener("change", function (e) { switchRole(e.target.value); });
el("filter").addEventListener("input", function (e) {
  state.filter = e.target.value; renderEntries();
});
el("gfilter").addEventListener("input", function (e) {
  state.gquery = e.target.value; renderEntries();
});
window.addEventListener("beforeunload", function (e) {
  if (draftCount() > 0) { e.preventDefault(); e.returnValue = ""; }
});

loadSession()
  .then(loadPacks)
  .then(function () { return loadModules(); })
  .then(function () { return loadEntryIndex(); })
  .catch(function (err) { fail("初始化", err); });
</script>
</body>
</html>
