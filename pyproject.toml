[tool.mypy]
# LNT-02：按现状定档 non-strict（D7 决策记录 D7-D1【细化定型】）——存量大量未标注，
# strict 一次开启会产生不可维护的巨型基线；strict 升级留待覆盖率/依赖门禁稳定后决策。
warn_unused_ignores = true
warn_redundant_casts = true
# `mypy .` 模块解析（tests/ 无 __init__.py 链 → 命名空间包 + 显式包基，防
# "Source file found twice" 冲突；M6 批7·路B 实测必需，登记于 lint_baseline.md）
explicit_package_bases = true
namespace_packages = true
mypy_path = "."
