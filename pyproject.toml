[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qbot-rpg"
version = "0.1.0"
description = "QQ 回合制 RPG 框架（平台无关核心包 qbot_rpg + NoneBot 壳层 commands）"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-asyncio>=0.21"]

[tool.setuptools.packages.find]
include = ["qbot_rpg*"]
